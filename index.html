<template class="pattern" data-title="Modal Stack" data-category="Components" data-source="Kujira Collectibles v3.31 (app.js, kjrModalCtrl + kjrConfirm/trapFocus)" data-note="The starter ships a single-modal baseline (see Modal Shell), this adds a stacking controller so more than one dialog can be open at once, a promise-based confirm that replaces window.confirm, and a focus trap that keeps Tab cycling inside whichever dialog is on top. Related: the Modal Shell card is the single-overlay baseline, this one adds stacking, a promise-based confirm and a focus trap.">
<style>
.mdl-wrap{position:relative;width:100%;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.mdl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.mdl-btn{padding:8px 14px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg4);color:var(--text);cursor:pointer;font-size:12px;font-weight:500;font-family:inherit;transition:background var(--dur) ease-out,transform var(--dur) var(--spring)}
.mdl-btn:hover{background:var(--bg3)}
.mdl-btn:active{transform:scale(.96)}
.mdl-btn-primary{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.mdl-status,.mdl-result{font-size:11px;color:var(--text3);text-align:center;max-width:280px;overflow-wrap:anywhere;margin:0}
.mdl-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:14px;border-radius:var(--radius-lg)}
.mdl-modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:250px;box-shadow:var(--shadow-2);animation:mdl-in var(--dur) var(--spring)}
@keyframes mdl-in{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.mdl-head{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.mdl-head h4{font-size:13px;font-weight:640}
.mdl-x{border:none;background:none;color:var(--text2);cursor:pointer;font-size:14px;line-height:1;padding:2px}
.mdl-x:hover{color:var(--text)}
.mdl-body{padding:14px;font-size:12px;color:var(--text2);overflow-wrap:anywhere}
.mdl-foot{padding:11px 14px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
</style>
<div class="mdl-wrap">
  <div class="mdl-row">
    <button type="button" class="mdl-btn mdl-open">Open modal</button>
    <button type="button" class="mdl-btn mdl-run-confirm">Run confirm</button>
  </div>
  <p class="mdl-status">No modal opened yet.</p>
  <p class="mdl-result">Confirm result: none yet.</p>
</div>
<script>
(function(){
  // Finds its own root relative to itself, never a global id, so several
  // instances (or repeated re-renders from the filter cycle) never collide.
  var script = document.currentScript;
  var root = script.parentElement;
  var wrap = root.querySelector('.mdl-wrap');
  var openBtn = root.querySelector('.mdl-open');
  var confirmBtn = root.querySelector('.mdl-run-confirm');
  var statusEl = root.querySelector('.mdl-status');
  var resultEl = root.querySelector('.mdl-result');
  if (!wrap || !openBtn || !confirmBtn || !statusEl || !resultEl) return;

  // Overlays are absolutely positioned within .mdl-wrap (not a native
  // top-layer <dialog>), so the demo stays scoped to its own card instead of
  // covering the whole gallery viewport. Scope note: the source's
  // history.pushState/popstate back-button integration is deliberately left
  // out of this reusable fragment, it is app-shell plumbing, not part of the
  // stacking/confirm/focus-trap idea this pattern demonstrates.
  var stack = []; // { overlay, trigger, trapHandler, onClose, onEsc }

  // iOS WebKit can leave the visual viewport offset after the keyboard was
  // up, blurring a still-focused text input before opening a layer dismisses
  // the keyboard first so the sheet opens against the settled viewport.
  function blurIfTextInput(el){
    if (el && el.matches && el.matches('input,select,textarea') && typeof el.blur === 'function') el.blur();
  }

  function bindTrap(overlayEl){
    var sel = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
    var handler = function(e){
      if (e.key !== 'Tab') return;
      var nodes = Array.prototype.slice.call(overlayEl.querySelectorAll(sel));
      if (!nodes.length) return;
      var first = nodes[0], last = nodes[nodes.length - 1];
      if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    };
    overlayEl.addEventListener('keydown', handler);
    return handler;
  }

  // Every dismissal path (X button, Close button, backdrop click, Esc) funnels
  // through here, so a caller's onClose hook always runs exactly once,
  // regardless of how the layer was dismissed.
  function closeEntry(entry, reason){
    var idx = stack.indexOf(entry);
    if (idx === -1) return;
    stack.splice(idx, 1);
    entry.overlay.removeEventListener('keydown', entry.trapHandler);
    entry.overlay.remove();
    if (entry.trigger && typeof entry.trigger.focus === 'function') entry.trigger.focus();
    if (typeof entry.onClose === 'function') entry.onClose(reason);
  }
  function closeTop(reason){
    var entry = stack[stack.length - 1];
    if (entry) closeEntry(entry, reason);
  }

  function openLayer(depth){
    var trigger = document.activeElement;
    blurIfTextInput(trigger);
    var overlay = document.createElement('div');
    overlay.className = 'mdl-overlay';
    var isTop = depth > 1;
    overlay.innerHTML =
      '<div class="mdl-modal" role="dialog" aria-modal="true">' +
        '<div class="mdl-head"><h4>Layer ' + depth + '</h4><button type="button" class="mdl-x" aria-label="Close">&#10005;</button></div>' +
        '<div class="mdl-body">' + (isTop
          ? 'Stacked on top of layer 1. Esc or a backdrop click here dismisses only this layer, layer 1 stays open underneath.'
          : 'Esc, a backdrop click, or the buttons below all close this layer, and all of them run the same onClose hook. Stack another layer on top to see focus and Esc move to the new top.') + '</div>' +
        '<div class="mdl-foot">' +
          (isTop ? '' : '<button type="button" class="mdl-btn mdl-stack">Stack another</button>') +
          '<button type="button" class="mdl-btn mdl-btn-primary mdl-close">Close</button>' +
        '</div>' +
      '</div>';
    wrap.appendChild(overlay);
    var entry = {
      overlay: overlay,
      trigger: trigger,
      onClose: function(reason){ statusEl.textContent = 'Layer ' + depth + ' closed (' + reason + '). Its onClose hook ran, same as every other dismissal path.'; }
    };
    entry.trapHandler = bindTrap(overlay);
    stack.push(entry);
    overlay.addEventListener('click', function(e){ if (e.target === overlay) closeEntry(entry, 'backdrop click'); });
    overlay.querySelector('.mdl-x').addEventListener('click', function(){ closeEntry(entry, 'X button'); });
    overlay.querySelector('.mdl-close').addEventListener('click', function(){ closeEntry(entry, 'Close button'); });
    var stackBtn = overlay.querySelector('.mdl-stack');
    if (stackBtn) stackBtn.addEventListener('click', function(){ openLayer(depth + 1); });
    overlay.querySelector('.mdl-x').focus();
  }
  openBtn.addEventListener('click', function(){ openLayer(1); });

  // Promise-based confirm, resolves true/false on OK/Cancel/Esc/backdrop, a
  // drop-in replacement for window.confirm that a caller can await.
  function mdlConfirm(msg, opts){
    opts = opts || {};
    return new Promise(function(resolve){
      var trigger = document.activeElement;
      blurIfTextInput(trigger);
      var overlay = document.createElement('div');
      overlay.className = 'mdl-overlay';
      overlay.innerHTML =
        '<div class="mdl-modal" role="alertdialog" aria-modal="true">' +
          '<div class="mdl-head"><h4>Confirm</h4></div>' +
          '<div class="mdl-body">' + msg + '</div>' +
          '<div class="mdl-foot"><button type="button" class="mdl-btn mdl-cancel">' + (opts.cancel || 'Cancel') + '</button><button type="button" class="mdl-btn mdl-btn-primary mdl-ok">' + (opts.ok || 'OK') + '</button></div>' +
        '</div>';
      wrap.appendChild(overlay);
      var settled = false;
      var entry = { overlay: overlay, trigger: trigger };
      entry.trapHandler = bindTrap(overlay);
      function finish(val){
        if (settled) return;
        settled = true;
        var idx = stack.indexOf(entry);
        if (idx !== -1) stack.splice(idx, 1);
        overlay.removeEventListener('keydown', entry.trapHandler);
        overlay.remove();
        if (trigger && typeof trigger.focus === 'function') trigger.focus();
        resolve(val);
      }
      entry.onEsc = function(){ finish(false); };
      stack.push(entry);
      overlay.addEventListener('click', function(e){ if (e.target === overlay) finish(false); });
      overlay.querySelector('.mdl-ok').addEventListener('click', function(){ finish(true); });
      overlay.querySelector('.mdl-cancel').addEventListener('click', function(){ finish(false); });
      overlay.querySelector('.mdl-ok').focus();
    });
  }

  confirmBtn.addEventListener('click', function(){
    resultEl.textContent = 'Confirm result: waiting for a decision...';
    mdlConfirm('Proceed with this demo action? This mirrors kjrConfirm, a Promise-based drop-in for window.confirm so a caller can await the answer and run logic after either choice.').then(function(ok){
      resultEl.textContent = 'Confirm result: ' + (ok ? 'confirmed' : 'cancelled');
    });
  });

  // Document-level Esc listener: closes only the top of THIS instance's own
  // stack. Self-terminates the moment this pattern's root leaves the DOM
  // (checked on every keydown, and proactively via the MutationObserver
  // below), so cycling the gallery filter never stacks up dead listeners.
  function onKeydown(e){
    if (!root.isConnected){ document.removeEventListener('keydown', onKeydown, true); return; }
    if (e.key !== 'Escape' || !stack.length) return;
    var top = stack[stack.length - 1];
    e.stopPropagation();
    if (top.onEsc) top.onEsc(); else closeTop('Esc key');
  }
  document.addEventListener('keydown', onKeydown, true);

  var mo = new MutationObserver(function(){
    if (!root.isConnected){
      document.removeEventListener('keydown', onKeydown, true);
      mo.disconnect();
    }
  });
  mo.observe(document.body, { childList: true, subtree: true });
})();
</script>
</template>


<template class="pattern" data-title="Command Bar" data-category="Components" data-source="Kujira Collectibles v3.31 (app.js, openCmdBar)" data-note="Ctrl or Cmd+K opens a full-screen palette: type to filter grouped mock commands, arrow keys move the highlight, Enter runs the highlighted one, Escape or a backdrop click dismiss. The live preview pane always reflects whichever command is highlighted. This is the shell only, the source app's add/sell domain logic (parsing a quick-entry line, building a multi-item sale cart) is dropped entirely.">
<style>
.cbr-launch{padding:9px 16px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg4);color:var(--text);cursor:pointer;font-size:12.5px;font-weight:500;font-family:inherit;transition:background var(--dur) ease-out}
.cbr-launch:hover{background:var(--bg3)}
.cbr-status{margin:10px 0 0;font-size:11.5px;color:var(--text3);text-align:center}
.cbr-dialog{margin:auto;padding:0;border:1px solid var(--border2);border-radius:var(--radius-lg);background:var(--bg2);color:var(--text);width:min(420px,92vw);box-shadow:var(--shadow-2)}
.cbr-dialog::backdrop{background:rgba(0,0,0,.55)}
.cbr-box{display:flex;flex-direction:column;max-height:70vh}
.cbr-input-row{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.cbr-input-icon{color:var(--text3);font-size:13px;flex-shrink:0}
.cbr-input{flex:1;border:none;background:none;outline:none;color:var(--text);font-family:inherit;font-size:14px;min-width:0}
.cbr-input::placeholder{color:var(--text3)}
.cbr-close{border:none;background:none;color:var(--text2);cursor:pointer;font-size:14px;flex-shrink:0;padding:2px;line-height:1}
.cbr-close:hover{color:var(--text)}
.cbr-body{display:flex;flex-direction:column;overflow:hidden;min-height:0}
.cbr-results{overflow-y:auto;padding:6px;max-height:260px}
.cbr-group-label{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);font-weight:600;padding:8px 8px 4px}
.cbr-result{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius);cursor:pointer}
.cbr-result.active{background:var(--accent-soft)}
.cbr-result-icon{width:26px;height:26px;border-radius:7px;background:var(--bg4);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.cbr-result-main{display:flex;flex-direction:column;gap:1px;min-width:0}
.cbr-result-title{font-size:12.5px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbr-result-sub{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbr-empty{padding:20px;text-align:center;color:var(--text2);font-size:12px}
.cbr-preview{border-top:1px solid var(--border);padding:12px 14px;background:var(--bg3);flex-shrink:0}
.cbr-preview-icon{width:28px;height:28px;border-radius:8px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:13px;margin-bottom:6px}
.cbr-preview-title{font-size:12.5px;font-weight:640;color:var(--text);overflow-wrap:anywhere}
.cbr-preview-sub{font-size:11px;color:var(--text3);margin-top:2px;overflow-wrap:anywhere}
.cbr-preview-run{font-size:10.5px;color:var(--text3);margin-top:8px}
.cbr-hint{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--border);font-size:10.5px;color:var(--text3);flex-shrink:0}
.cbr-hint kbd,.cbr-preview-run kbd{font-size:10px;padding:1px 5px;border-radius:4px;background:var(--bg4);border:1px solid var(--border2);color:var(--text2)}
</style>
<button type="button" class="cbr-launch">Open (or press Ctrl/Cmd+K)</button>
<p class="cbr-status" aria-live="polite">Last run: none yet</p>
<dialog class="cbr-dialog" aria-label="Command bar">
  <div class="cbr-box">
    <div class="cbr-input-row">
      <span class="cbr-input-icon" aria-hidden="true">&#8984;</span>
      <input type="text" class="cbr-input" placeholder="Type a command..." autocomplete="off" aria-label="Search commands">
      <button type="button" class="cbr-close" aria-label="Close">&#10005;</button>
    </div>
    <div class="cbr-body">
      <div class="cbr-results" role="listbox" aria-label="Commands"></div>
      <div class="cbr-preview"></div>
    </div>
    <div class="cbr-hint"><span><kbd>&uarr;</kbd><kbd>&darr;</kbd> navigate</span><span><kbd>&crarr;</kbd> run</span><span><kbd>esc</kbd> close</span></div>
  </div>
</dialog>
<script>
(function(){
  // Finds its own elements relative to itself, never a global id, so several
  // instances (or repeated re-renders from the filter cycle) never collide.
  var script = document.currentScript;
  var root = script.parentElement;
  var launchBtn = root.querySelector('.cbr-launch');
  var statusEl = root.querySelector('.cbr-status');
  var dialog = root.querySelector('.cbr-dialog');
  var input = root.querySelector('.cbr-input');
  var closeBtn = root.querySelector('.cbr-close');
  var resultsEl = root.querySelector('.cbr-results');
  var previewEl = root.querySelector('.cbr-preview');
  if (!launchBtn || !dialog || !input || !resultsEl || !previewEl) return;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Generic mock commands, grouped. No app-specific (add/sell) domain logic
  // lives here, that stays in the source app, this is the palette shell only.
  var GROUPS = [
    { name: 'Navigate', items: [
      { title: 'Go to Dashboard', sub: 'Overview of activity and key metrics', icon: '◱' },
      { title: 'Go to Settings', sub: 'Account, billing and preferences', icon: '⚙' }
    ]},
    { name: 'Actions', items: [
      { title: 'Create new project', sub: 'Start a blank project from scratch', icon: '+' },
      { title: 'Invite a teammate', sub: 'Send an email invite with a role', icon: '◍' },
      { title: 'Export data as CSV', sub: 'Download every row in the current view', icon: '⇩' }
    ]},
    { name: 'Recent', items: [
      { title: 'Open "Quarterly Roadmap Review: Draft for Stakeholder Sign-off and Budget Approval"', sub: 'Document, edited 2 days ago', icon: '▤' },
      { title: 'Open "Weekly Sync Notes"', sub: 'Document, edited yesterday', icon: '▤' }
    ]}
  ];

  var flat = [];
  var activeIdx = 0;

  // Token-aware filter across title+sub, same idea as the source's
  // whitespace-tokenised inventory search: every token must match somewhere.
  function renderResults(){
    var q = input.value.trim();
    var tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
    flat = [];
    var html = '';
    GROUPS.forEach(function(g){
      var matches = g.items.filter(function(c){
        if (!tokens.length) return true;
        var hay = (c.title + ' ' + c.sub).toLowerCase();
        return tokens.every(function(t){ return hay.indexOf(t) !== -1; });
      });
      if (!matches.length) return;
      html += '<div class="cbr-group-label">' + esc(g.name) + '</div>';
      matches.forEach(function(c){
        var idx = flat.length;
        flat.push(c);
        html += '<div class="cbr-result" data-idx="' + idx + '" role="option">' +
          '<span class="cbr-result-icon" aria-hidden="true">' + esc(c.icon) + '</span>' +
          '<span class="cbr-result-main"><span class="cbr-result-title">' + esc(c.title) + '</span>' +
          '<span class="cbr-result-sub">' + esc(c.sub) + '</span></span></div>';
      });
    });
    if (!flat.length){
      resultsEl.innerHTML = '<div class="cbr-empty">No commands match "' + esc(q) + '"</div>';
      previewEl.innerHTML = '';
      return;
    }
    resultsEl.innerHTML = html;
    if (activeIdx >= flat.length) activeIdx = flat.length - 1;
    if (activeIdx < 0) activeIdx = 0;
    highlight();
  }

  function highlight(){
    var els = resultsEl.querySelectorAll('.cbr-result');
    els.forEach(function(el, i){
      var on = i === activeIdx;
      el.classList.toggle('active', on);
      el.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    var cmd = flat[activeIdx];
    if (!cmd){ previewEl.innerHTML = ''; return; }
    previewEl.innerHTML =
      '<div class="cbr-preview-icon" aria-hidden="true">' + esc(cmd.icon) + '</div>' +
      '<div class="cbr-preview-title">' + esc(cmd.title) + '</div>' +
      '<div class="cbr-preview-sub">' + esc(cmd.sub) + '</div>' +
      '<div class="cbr-preview-run">Press <kbd>Enter</kbd> to run</div>';
    var activeEl = els[activeIdx];
    if (activeEl && activeEl.scrollIntoView) activeEl.scrollIntoView({ block: 'nearest' });
  }

  function runActive(){
    var cmd = flat[activeIdx];
    if (!cmd) return;
    statusEl.textContent = 'Last run: ' + cmd.title;
    closeBar();
  }

  function openBar(){
    if (!root.isConnected || dialog.open) return;
    input.value = '';
    activeIdx = 0;
    renderResults();
    if (typeof dialog.showModal === 'function') dialog.showModal(); else dialog.setAttribute('open', '');
    setTimeout(function(){ input.focus(); }, 20);
  }
  function closeBar(){
    if (dialog.open) dialog.close(); else dialog.removeAttribute('open');
  }

  launchBtn.addEventListener('click', openBar);
  closeBtn.addEventListener('click', closeBar);
  // Backdrop click: a click lands ON the dialog element itself only when it
  // hits the backdrop area, never when it hits a descendant (.cbr-box etc),
  // same idiom as this gallery's Modal Shell overlay check.
  dialog.addEventListener('click', function(e){ if (e.target === dialog) closeBar(); });
  resultsEl.addEventListener('click', function(e){
    var row = e.target.closest ? e.target.closest('.cbr-result') : null;
    if (!row) return;
    activeIdx = parseInt(row.getAttribute('data-idx'), 10) || 0;
    runActive();
  });
  input.addEventListener('input', renderResults);
  input.addEventListener('keydown', function(e){
    if (e.key === 'ArrowDown'){ e.preventDefault(); activeIdx = Math.min(activeIdx + 1, flat.length - 1); highlight(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); highlight(); }
    else if (e.key === 'Enter'){ e.preventDefault(); runActive(); }
    // Escape is not handled here: the native <dialog> already closes itself
    // on Escape (fires 'cancel' then 'close'), nothing to wire up.
  });

  // Global Ctrl/Cmd+K shortcut. Self-terminating: every keypress re-checks
  // root.isConnected and detaches itself the instant this card leaves the
  // DOM. The gallery fully re-renders the grid on every filter click
  // (grid.innerHTML=''), so a stale instance must never keep listening, or
  // repeated filter cycles would stack one leaked listener per past render,
  // all fighting to open a dialog that no longer exists.
  function onGlobalKey(e){
    if (!root.isConnected){ document.removeEventListener('keydown', onGlobalKey); return; }
    var mod = e.ctrlKey || e.metaKey;
    if (mod && (e.key === 'k' || e.key === 'K')){ e.preventDefault(); openBar(); }
  }
  document.addEventListener('keydown', onGlobalKey);

  // Belt-and-braces: react the moment the grid re-renders rather than
  // waiting for a stray keypress, so cleanup is near-immediate, not just
  // eventual. Idempotent alongside the check above, removeEventListener on
  // an already-removed listener is a harmless no-op.
  var lifecycleObserver = new MutationObserver(function(){
    if (!root.isConnected){
      document.removeEventListener('keydown', onGlobalKey);
      lifecycleObserver.disconnect();
    }
  });
  lifecycleObserver.observe(document.body, { childList: true, subtree: true });
})();
</script>
</template>


<template class="pattern" data-title="Bulk Select" data-category="Flows" data-source="Kujira Collectibles v3.31 (app.js, bulk select + floating action bar, lines 1093-1212)" data-note="Row checkboxes plus a header select-all (goes indeterminate when only some visible rows are selected) drive a floating action bar that appears once anything is selected, showing the count and two demo bulk actions: tag the selection, or clear it. Nothing here deletes data, tagging is additive and clearing only changes the selection, never the rows. Tick a few cities to see the bar appear.">
<style>
.blk-wrap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.blk-bar{display:none;align-items:center;gap:10px;padding:9px 14px;background:var(--bg2);border:1px solid var(--accent);border-radius:var(--radius);box-shadow:var(--shadow-2);opacity:0;transform:translateY(-4px);transition:opacity var(--dur) ease-out,transform var(--dur) var(--spring)}
.blk-bar.show{display:flex;opacity:1;transform:none}
.blk-count{font-size:12.5px;font-weight:640;color:var(--accent)}
.blk-actions{display:flex;gap:8px;margin-left:auto}
.blk-btn-tag{padding:6px 12px;border-radius:var(--radius);border:none;background:var(--accent);color:var(--onacc);cursor:pointer;font-size:11.5px;font-weight:600;font-family:inherit;transition:filter var(--dur) ease-out}
.blk-btn-tag:hover{filter:brightness(1.08)}
.blk-btn-tag:active{transform:scale(.96)}
.blk-btn-clear{padding:6px 12px;border-radius:var(--radius);border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-size:11.5px;font-weight:500;font-family:inherit;transition:background var(--dur) ease-out}
.blk-btn-clear:hover{background:var(--bg3);color:var(--text)}
.blk-btn-clear:active{transform:scale(.96)}
.blk-table-scroll{width:100%;overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
.blk-table{width:100%;border-collapse:collapse;font-size:12px}
.blk-table th,.blk-table td{padding:7px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border)}
.blk-table tbody tr:last-child td{border-bottom:none}
.blk-table thead th{background:var(--bg3);color:var(--text3);font-size:10.5px;font-weight:640;text-transform:uppercase;letter-spacing:.4px}
.blk-th-cb,.blk-td-cb{width:34px}
.blk-row-cb,.blk-select-all{width:14px;height:14px;accent-color:var(--accent);cursor:pointer}
tr.blk-row-selected td{background:var(--accent-soft)}
.blk-city-name{font-weight:560}
.blk-tag-chip{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:640}
.blk-td-wrap{white-space:normal;overflow-wrap:anywhere;max-width:190px;line-height:1.35;color:var(--text2)}
.blk-empty-cell{color:var(--text3)}
.blk-toast-stack{display:flex;flex-direction:column;gap:6px}
.blk-toast{background:var(--bg4);border:1px solid var(--border2);color:var(--text);padding:8px 12px;border-radius:var(--radius);font-size:12px;box-shadow:var(--shadow-2);animation:blk-pop var(--dur) var(--spring)}
@keyframes blk-pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  .blk-toast{animation:none}
  .blk-bar{transition:none}
}
</style>
<div class="blk-wrap">
  <div class="blk-bar">
    <span class="blk-count">0 selected</span>
    <div class="blk-actions">
      <button type="button" class="blk-btn-tag">Tag as Featured</button>
      <button type="button" class="blk-btn-clear">Clear</button>
    </div>
  </div>
  <div class="blk-table-scroll">
    <table class="blk-table">
      <thead>
        <tr>
          <th class="blk-th-cb"><input type="checkbox" class="blk-select-all" aria-label="Select all cities"></th>
          <th>City</th><th>Country</th><th>Population</th><th>Notable for</th>
        </tr>
      </thead>
      <tbody class="blk-tbody"></tbody>
    </table>
  </div>
  <div class="blk-toast-stack"></div>
</div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var wrap = root.querySelector('.blk-wrap');
  if (!wrap) return;
  var bar = wrap.querySelector('.blk-bar');
  var countEl = wrap.querySelector('.blk-count');
  var tagBtn = wrap.querySelector('.blk-btn-tag');
  var clearBtn = wrap.querySelector('.blk-btn-clear');
  var selectAllCb = wrap.querySelector('.blk-select-all');
  var tbody = wrap.querySelector('.blk-tbody');
  var toastStack = wrap.querySelector('.blk-toast-stack');
  if (!bar || !countEl || !tagBtn || !clearBtn || !selectAllCb || !tbody || !toastStack) return;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Invented sample data, no Collectibles fields.
  var ROWS = [
    { id:1, city:'Singapore', country:'Singapore',   population:'5.9M', note:'Container port and financial hub for Southeast Asia, one of the busiest transhipment ports in the world', tagged:false },
    { id:2, city:'Lisbon',    country:'Portugal',    population:'0.5M', note:'', tagged:false },
    { id:3, city:'Nairobi',   country:'Kenya',       population:'4.4M', note:'', tagged:false },
    { id:4, city:'Auckland',  country:'New Zealand', population:'1.7M', note:'', tagged:false },
    { id:5, city:'Busan',     country:'South Korea', population:'3.4M', note:'', tagged:false },
    { id:6, city:'Quito',     country:'Ecuador',     population:'2.0M', note:'', tagged:false },
    { id:7, city:'Perth',     country:'Australia',   population:'2.1M', note:'', tagged:false }
  ];
  var selected = {}; // id -> true, only ids currently checked

  function selectedCount(){ return Object.keys(selected).length; }

  function updateBar(){
    if (!bar.isConnected) return;
    var count = selectedCount();
    var total = ROWS.length;
    bar.classList.toggle('show', count > 0);
    countEl.textContent = count + ' selected';
    selectAllCb.checked = total > 0 && count >= total;
    selectAllCb.indeterminate = count > 0 && count < total;
  }

  function render(){
    if (!tbody.isConnected) return;
    tbody.innerHTML = ROWS.map(function(row){
      var isSel = !!selected[row.id];
      return '<tr class="'+(isSel?'blk-row-selected':'')+'" data-id="'+row.id+'">' +
        '<td class="blk-td-cb"><input type="checkbox" class="blk-row-cb" data-id="'+row.id+'"'+(isSel?' checked':'')+' aria-label="Select '+esc(row.city)+'"></td>' +
        '<td><span class="blk-city-name">'+esc(row.city)+'</span>'+(row.tagged?'<span class="blk-tag-chip">Featured</span>':'')+'</td>' +
        '<td>'+esc(row.country)+'</td>' +
        '<td>'+esc(row.population)+'</td>' +
        '<td><div class="blk-td-wrap">'+(row.note ? esc(row.note) : '<span class="blk-empty-cell">&mdash;</span>')+'</div></td>' +
      '</tr>';
    }).join('');
    updateBar();
  }

  // Delegated on tbody: rows are rebuilt wholesale by render(), a delegated
  // listener survives that rebuild without needing to be rewired each time.
  tbody.addEventListener('change', function(e){
    var cb = e.target.closest('.blk-row-cb');
    if (!cb) return;
    var id = Number(cb.dataset.id);
    if (cb.checked) selected[id] = true; else delete selected[id];
    var tr = cb.closest('tr');
    if (tr) tr.classList.toggle('blk-row-selected', cb.checked);
    updateBar();
  });

  selectAllCb.addEventListener('change', function(){
    // Only affects rows currently rendered (all of them here, there is no
    // filter in this demo, but the flag flows through the same code path a
    // filtered table would use).
    var checked = selectAllCb.checked;
    ROWS.forEach(function(row){ if (checked) selected[row.id] = true; else delete selected[row.id]; });
    render();
  });

  function fireToast(msg){
    if (!toastStack.isConnected) return;
    var el = document.createElement('div');
    el.className = 'blk-toast';
    el.textContent = msg;
    toastStack.appendChild(el);
    setTimeout(function(){ if (el.isConnected) el.remove(); }, 2600);
  }

  tagBtn.addEventListener('click', function(){
    var n = selectedCount();
    if (!n) return;
    ROWS.forEach(function(row){ if (selected[row.id]) row.tagged = true; });
    selected = {};
    render();
    fireToast(n + ' cit' + (n === 1 ? 'y' : 'ies') + ' tagged as Featured');
  });

  clearBtn.addEventListener('click', function(){
    selected = {};
    render();
  });

  render();
})();
</script>
</template>


<template class="pattern" data-title="Column Menu" data-category="Components" data-source="Kujira Collectibles v3.31 (features.js, generic column reorder helpers, lines 1602-1835)" data-note="Per-column show/hide plus reorder, either by dragging a header or, for touch users who cannot drag, tap-to-move buttons in the Columns menu, the required fallback for any drag interaction. Locked columns (the identity column, Actions) skip both and are marked Fixed. Order and visibility persist to localStorage under a namespaced demo key. Open Columns, try the checkboxes and the up/down buttons, or drag a header directly.">
<style>
.col-wrap{width:100%;max-width:440px;display:flex;flex-direction:column;gap:10px}
.col-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.col-toolbar-label{font-size:12.5px;font-weight:640;color:var(--text)}
.col-menu-wrap{position:relative}
.col-menu-btn{padding:7px 13px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg3);color:var(--text);cursor:pointer;font-size:12px;font-weight:500;font-family:inherit;transition:background var(--dur) ease-out}
.col-menu-btn:hover{background:var(--bg4)}
.col-menu-btn:active{transform:scale(.96)}
.col-menu-dropdown{display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:6px 0;z-index:20;min-width:230px;box-shadow:var(--shadow-2)}
.col-menu-wrap.open .col-menu-dropdown{display:block}
.col-menu-item{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12.5px;color:var(--text2)}
.col-menu-item-locked{color:var(--text3)}
.col-menu-check{display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer}
.col-menu-check input{width:13px;height:13px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.col-menu-check span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-menu-fixed{font-size:10.5px;color:var(--text3);margin-left:auto;flex-shrink:0}
.col-menu-move{display:flex;gap:2px;flex-shrink:0}
.col-move-btn{width:22px;height:22px;border-radius:calc(var(--radius) - 3px);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:background var(--dur) ease-out,color var(--dur) ease-out}
.col-move-btn:hover:not(:disabled){background:var(--bg4);color:var(--text)}
.col-move-btn:disabled{opacity:.35;cursor:not-allowed}
.col-table-scroll{width:100%;overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
.col-table{width:100%;border-collapse:collapse;font-size:12px}
.col-table th,.col-table td{padding:7px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border)}
.col-table tbody tr:last-child td{border-bottom:none}
.col-table thead th{background:var(--bg3);color:var(--text3);font-size:10.5px;font-weight:640;text-transform:uppercase;letter-spacing:.4px;user-select:none}

</style>
<div class="col-wrap">
  <div class="col-toolbar">
    <span class="col-toolbar-label">Products</span>
    <div class="col-menu-wrap">
      <button type="button" class="col-menu-btn" aria-haspopup="true" aria-expanded="false">&#8862; Columns</button>
      <div class="col-menu-dropdown"><div class="col-menu-list"></div></div>
    </div>
  </div>
  <div class="col-table-scroll">
    <table class="col-table">
      <thead><tr class="col-head-row"></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var wrap = root.querySelector('.col-wrap');
  if (!wrap) return;
  var menuBtn = wrap.querySelector('.col-menu-btn');
  var menuWrap = wrap.querySelector('.col-menu-wrap');
  var menuList = wrap.querySelector('.col-menu-list');
  var headRow = wrap.querySelector('.col-head-row');
  var tbody = wrap.querySelector('tbody');
  if (!menuBtn || !menuWrap || !menuList || !headRow || !tbody) return;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  var STORAGE_KEY = 'kjr-lib-colmenu'; // demo-only, namespaced so it never touches a real app's column state

  // Invented sample columns/rows, no Collectibles fields.
  var COLS = [
    { key:'product',  label:'Product',  locked:true },
    { key:'category', label:'Category' },
    { key:'price',    label:'Price' },
    { key:'stock',    label:'Stock' },
    { key:'supplier', label:'Supplier' },
    { key:'updated',  label:'Updated' },
    { key:'actions',  label:'Actions',  locked:true }
  ];
  var COLS_BY_KEY = {};
  COLS.forEach(function(c){ COLS_BY_KEY[c.key] = c; });
  var DEFAULT_ORDER = COLS.map(function(c){ return c.key; });
  var LOCKED = {};
  COLS.forEach(function(c){ if (c.locked) LOCKED[c.key] = true; });
  function isLocked(key){ return !!LOCKED[key]; }

  var ROWS = [
    { product:'Wireless Mouse', category:'Electronics', price:'$24.90',  stock:'120', supplier:'Nova Traders Pte Ltd, Singapore Distribution Hub', updated:'12 Jul' },
    { product:'Standing Desk',  category:'Furniture',   price:'$389.00', stock:'8',   supplier:'Oakline Co',   updated:'10 Jul' },
    { product:'USB-C Cable 2m', category:'Electronics', price:'$9.50',   stock:'340', supplier:'Nova Traders', updated:'14 Jul' },
    { product:'Ceramic Mug',    category:'Homeware',    price:'$12.00',  stock:'75',  supplier:'Kiln & Co',    updated:'09 Jul' },
    { product:'Yoga Mat',       category:'Fitness',     price:'$34.00',  stock:'52',  supplier:'Flex Supply',  updated:'11 Jul' },
    { product:'Desk Lamp',      category:'Lighting',    price:'$28.50',  stock:'0',   supplier:'Brightline',   updated:'08 Jul' }
  ];

  // Graceful merge across schema changes: keep saved positions for keys that
  // still exist, append any new default key at the end, drop stale ones.
  function loadState(){
    var raw = null;
    try{ raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); }catch(e){ raw = null; }
    var savedOrder = Array.isArray(raw && raw.order) ? raw.order : null;
    var savedHidden = Array.isArray(raw && raw.hidden) ? raw.hidden : [];
    var order;
    if (savedOrder){
      var valid = savedOrder.filter(function(k){ return DEFAULT_ORDER.indexOf(k) >= 0; });
      var missing = DEFAULT_ORDER.filter(function(k){ return valid.indexOf(k) < 0; });
      order = valid.concat(missing);
    } else {
      order = DEFAULT_ORDER.slice();
    }
    var hidden = {};
    savedHidden.forEach(function(k){ if (DEFAULT_ORDER.indexOf(k) >= 0 && !isLocked(k)) hidden[k] = true; });
    return { order: order, hidden: hidden };
  }
  function persist(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ order: state.order, hidden: Object.keys(state.hidden) }));
    }catch(e){}
  }

  var state = loadState();

  function wireHeaderDrag(th, key){
    th.draggable = true;
    th.classList.add('col-th-draggable');
    th.addEventListener('dragstart', function(e){
      e.dataTransfer.setData('text/plain', key);
      e.dataTransfer.effectAllowed = 'move';
    });
    th.addEventListener('dragover', function(e){
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      headRow.querySelectorAll('th').forEach(function(el){ el.classList.remove('col-th-over'); });
      th.classList.add('col-th-over');
    });
    th.addEventListener('dragleave', function(){ th.classList.remove('col-th-over'); });
    th.addEventListener('drop', function(e){
      e.preventDefault();
      headRow.querySelectorAll('th').forEach(function(el){ el.classList.remove('col-th-over'); });
      var fromKey = e.dataTransfer.getData('text/plain');
      moveColumn(fromKey, key);
    });
  }

  // Reorder + persist. Shared by the header drag-drop path and the tap
  // up/down buttons in the Columns menu (mirrors the source split).
  function moveColumn(fromKey, toKey){
    if (!fromKey || fromKey === toKey || isLocked(fromKey) || isLocked(toKey)) return;
    var order = state.order.slice();
    var fi = order.indexOf(fromKey);
    if (fi < 0) return;
    order.splice(fi, 1);
    var ti = order.indexOf(toKey);
    if (ti < 0) return;
    order.splice(ti, 0, fromKey);
    state.order = order;
    persist();
    render();
  }

  // Tap-based one-slot move, the fallback for touch users who cannot drag.
  function moveStep(key, dir){
    if (isLocked(key)) return;
    var order = state.order.slice();
    var idx = order.indexOf(key);
    var t = idx + dir;
    if (idx < 0 || t < 0 || t >= order.length) return;
    if (isLocked(order[t])) return; // never hop across a locked column
    order.splice(idx, 1);
    order.splice(t, 0, key);
    state.order = order;
    persist();
    render();
  }

  function toggleVisible(key, visible){
    if (isLocked(key)) return;
    var hidden = {};
    for (var k in state.hidden) hidden[k] = true;
    if (visible) delete hidden[key]; else hidden[key] = true;
    state.hidden = hidden;
    persist();
    render();
  }

  function buildMenu(){
    if (!menuList.isConnected) return;
    menuList.innerHTML = state.order.map(function(key, i){
      var col = COLS_BY_KEY[key];
      if (!col) return '';
      if (isLocked(key)){
        return '<div class="col-menu-item col-menu-item-locked"><span>'+esc(col.label)+'</span><span class="col-menu-fixed">Fixed</span></div>';
      }
      var hidden = !!state.hidden[key];
      var upDisabled = i === 0 || isLocked(state.order[i-1]);
      var downDisabled = i === state.order.length - 1 || isLocked(state.order[i+1]);
      return '<div class="col-menu-item">' +
        '<label class="col-menu-check"><input type="checkbox" data-key="'+key+'"'+(hidden?'':' checked')+'><span>'+esc(col.label)+'</span></label>' +
        '<span class="col-menu-move">' +
        '<button type="button" class="col-move-btn" data-move="up" data-key="'+key+'"'+(upDisabled?' disabled':'')+' aria-label="Move '+esc(col.label)+' up">&uarr;</button>' +
        '<button type="button" class="col-move-btn" data-move="down" data-key="'+key+'"'+(downDisabled?' disabled':'')+' aria-label="Move '+esc(col.label)+' down">&darr;</button>' +
        '</span></div>';
    }).join('');
  }

  function render(){
    if (!tbody.isConnected) return;
    var visibleKeys = state.order.filter(function(k){ return !state.hidden[k]; });
    headRow.innerHTML = '';
    visibleKeys.forEach(function(key){
      var col = COLS_BY_KEY[key];
      var th = document.createElement('th');
      th.dataset.colKey = key;
      th.textContent = col.label;
      if (isLocked(key)) th.classList.add('col-th-locked');
      else wireHeaderDrag(th, key);
      headRow.appendChild(th);
    });
    tbody.innerHTML = ROWS.map(function(row){
      return '<tr>' + visibleKeys.map(function(key){
        if (key === 'actions') return '<td><button type="button" class="col-action-btn" disabled title="Demo action, not wired">View</button></td>';
        // Wrap in an inner div rather than putting max-width on the td itself:
        // table auto-layout does not reliably honour max-width on a cell, an
        // inner block element constrains and wraps predictably instead.
        if (key === 'supplier') return '<td><div class="col-td-wrap">'+esc(row[key])+'</div></td>';
        return '<td>'+esc(row[key])+'</td>';
      }).join('') + '</tr>';
    }).join('');
    buildMenu();
  }

  menuBtn.addEventListener('click', function(){
    var opening = !menuWrap.classList.contains('open');
    menuWrap.classList.toggle('open', opening);
    menuBtn.setAttribute('aria-expanded', String(opening));
  });
  menuWrap.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){
      menuWrap.classList.remove('open');
      menuBtn.setAttribute('aria-expanded', 'false');
      menuBtn.focus();
    }
  });
  menuList.addEventListener('change', function(e){
    var cb = e.target.closest('input[type=checkbox]');
    if (!cb) return;
    toggleVisible(cb.dataset.key, cb.checked);
  });
  menuList.addEventListener('click', function(e){
    var btn = e.target.closest('.col-move-btn');
    if (!btn || btn.disabled) return;
    moveStep(btn.dataset.key, btn.dataset.move === 'up' ? -1 : 1);
  });

  // Outside click closes the menu. Document-level listener, so it must not
  // outlive this instance: filter cycling in the gallery clones a fresh copy
  // of this template on every render, this guard makes the old listener a
  // no-op and removes itself the first time it fires after root disconnects.
  function onDocPointerDown(e){
    if (!root.isConnected){ document.removeEventListener('pointerdown', onDocPointerDown, true); return; }
    if (!menuWrap.classList.contains('open') || menuWrap.contains(e.target)) return;
    menuWrap.classList.remove('open');
    menuBtn.setAttribute('aria-expanded', 'false');
  }
  document.addEventListener('pointerdown', onDocPointerDown, true);

  render();
})();
</script>
</template>


<template class="pattern" data-title="Filter Search" data-category="Components" data-source="Kujira Collectibles v3.31 (features.js, kjrMatchUniversal/_matchOneToken/kjrMatchNumFilter/kjrMatchDateFilter, lines 372-540)" data-note="Multi-token AND search across every field (try a phrase like in stock, or two tokens like electronics low), plus a per-column filter row: numeric columns take a bare number (matches within a dollar of it), an over-100 style comparator, a 100 to 200 range, and a leading dollar sign is stripped automatically, and the date column takes a month name, a month plus year, a day number, or a bare year, matched against a normalised day-month-year form. The starter's own Table Plumbing card ships a simple substring search (applyFilter). This is the full parser, for when a table's search box needs numeric and date reasoning, not just contains matching. Related: Table Plumbing covers sort, basic search and pagination, this is the deeper filter syntax parser.">
<style>
.flt-wrap{width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px;text-align:left}
.flt-search-row{display:flex;gap:8px}
.flt-search{flex:1;font-family:inherit;font-size:12px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius);padding:7px 10px;outline:none;min-width:0;box-sizing:border-box}
.flt-search:focus{border-color:var(--accent)}
.flt-clear{padding:7px 13px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg4);color:var(--text);cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap}
.flt-clear:hover{background:var(--bg3)}

.flt-col-f:focus{border-color:var(--accent)}

</style>
<div class="flt-wrap">
  <div class="flt-search-row">
    <input type="text" class="flt-search" placeholder='Search all columns, try "electronics low"' aria-label="Search all columns">
    <button type="button" class="flt-clear">Clear</button>
  </div>
  <div class="flt-table-wrap">
    <table>
      <thead>
        <tr class="flt-head">
          <th>Name</th><th>Category</th><th>Status</th><th>Price</th><th>Restocked</th>
        </tr>
        <tr class="flt-filter-row">
          <th><input type="text" class="flt-col-f" data-col="name" placeholder="filter" aria-label="Filter Name"></th>
          <th><input type="text" class="flt-col-f" data-col="category" placeholder="filter" aria-label="Filter Category"></th>
          <th><input type="text" class="flt-col-f" data-col="status" placeholder="filter" aria-label="Filter Status"></th>
          <th><input type="text" class="flt-col-f" data-col="price" placeholder="100, >100, 100-200, $100" aria-label="Filter Price"></th>
          <th><input type="text" class="flt-col-f" data-col="restocked" placeholder="may, 2026, 5/2026" aria-label="Filter Restocked"></th>
        </tr>
      </thead>
      <tbody class="flt-rows"></tbody>
    </table>
  </div>
  <div class="flt-count" aria-live="polite"></div>
</div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var wrap = root.querySelector('.flt-wrap');
  var searchInput = root.querySelector('.flt-search');
  var clearBtn = root.querySelector('.flt-clear');
  var colInputs = root.querySelectorAll('.flt-col-f');
  var rowsEl = root.querySelector('.flt-rows');
  var countEl = root.querySelector('.flt-count');
  if (!wrap || !searchInput || !rowsEl || !countEl) return;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Generic demo rows (a small stock table), not Collectibles fields. One
  // long name proves overflow handling. Prices/dates are picked so ">100",
  // "100-200" and a date filter each visibly change the result set.
  var ROWS = [
    { name:'Wireless Mouse', category:'Electronics', status:'In Stock', price:25, restocked:'3 May 2025' },
    { name:'Standing Desk Converter', category:'Furniture', status:'In Stock', price:179, restocked:'14 Jun 2025' },
    { name:'Desk Lamp LED', category:'Home', status:'In Stock', price:100, restocked:'5 Feb 2026' },
    { name:'Ergonomic Office Chair with Adjustable Lumbar Support and Headrest, Mesh Back Premium Edition', category:'Furniture', status:'In Stock', price:189, restocked:'20 Jan 2026' },
    { name:'USB-C Charging Cable', category:'Electronics', status:'Out of Stock', price:8, restocked:'11 Mar 2025' },
    { name:'Ceramic Plant Pot', category:'Home', status:'In Stock', price:14, restocked:'30 Apr 2026' },
    { name:'4K Monitor 27-inch', category:'Electronics', status:'Low Stock', price:310, restocked:'9 Jun 2026' },
    { name:'Cotton Throw Blanket', category:'Home', status:'Low Stock', price:32, restocked:'17 Dec 2025' }
  ];

  var TEXT_FIELDS = ['name','category','status'];
  var NUM_FIELDS = ['price'];
  var DATE_FIELDS = ['restocked'];
  var MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  var FULL_MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];

  function monthIdx(word){
    var w = String(word || '').toLowerCase();
    if (!w) return -1;
    var byFull = FULL_MONTHS.indexOf(w);
    if (byFull >= 0) return byFull;
    var by3 = MONTHS.indexOf(w.slice(0, 3));
    if (by3 >= 0 && FULL_MONTHS[by3].indexOf(w) === 0) return by3;
    return -1;
  }

  // Date-aware match: checks a normalised "d mmm yyyy" string (already the
  // canonical form our demo rows store) against a month name, month+year,
  // m/yyyy, a bare day/month number, or a bare year.
  function matchDateFilter(token, canonLower){
    var t = String(token || '').trim().toLowerCase();
    if (!t) return true;
    if (canonLower.indexOf(t) >= 0) return true;
    var mi = monthIdx(t);
    if (mi >= 0 && canonLower.indexOf(MONTHS[mi]) >= 0) return true;
    var m = t.match(/^([a-z]+)[\s-]+(\d{4})$/);
    if (m){
      var mi2 = monthIdx(m[1]);
      if (mi2 >= 0 && canonLower.indexOf(MONTHS[mi2] + ' ' + m[2]) >= 0) return true;
    }
    m = t.match(/^(\d{1,2})[\/-](\d{4})$/);
    if (m){
      var mi3 = parseInt(m[1], 10) - 1;
      if (mi3 >= 0 && mi3 < 12) return canonLower.indexOf(MONTHS[mi3] + ' ' + m[2]) >= 0;
    }
    m = t.match(/^(\d{1,2})$/);
    if (m){
      var n = parseInt(m[1], 10);
      if (n >= 1 && n <= 12 && canonLower.indexOf(MONTHS[n - 1]) >= 0) return true;
      if (canonLower.indexOf(n + ' ') === 0) return true;
    }
    if (/^\d{4}$/.test(t)) return canonLower.slice(-4) === t;
    return false;
  }

  // Per-column numeric filter: "", "100" (+/- 1), ">100"/"<100"/">=100"/"<=100",
  // "100-200" inclusive range, a leading "$" is stripped first.
  function matchNumFilter(filter, val){
    var f = String(filter == null ? '' : filter).trim().replace(/^\$+/, '');
    if (!f) return true;
    var x = parseFloat(val);
    if (isNaN(x)) return false;
    var r = f.match(/^(-?\d+(?:\.\d+)?)\s*-\s*(-?\d+(?:\.\d+)?)$/);
    if (r){
      var a = parseFloat(r[1]), b = parseFloat(r[2]);
      return x >= Math.min(a, b) && x <= Math.max(a, b);
    }
    var c = f.match(/^(>=|<=|>|<)\s*(-?\d+(?:\.\d+)?)$/);
    if (c){
      var op = c[1], v = parseFloat(c[2]);
      if (op === '>') return x > v;
      if (op === '<') return x < v;
      if (op === '>=') return x >= v;
      if (op === '<=') return x <= v;
    }
    var v2 = parseFloat(f);
    if (isNaN(v2)) return false;
    return Math.abs(x - v2) < 1.0;
  }

  function matchTextFilter(filter, val){
    if (!filter) return true;
    return String(val || '').toLowerCase().indexOf(String(filter).trim().toLowerCase()) >= 0;
  }

  // One AND'd token against a row: numeric comparator, bare number (price
  // tolerance or date day-of-month), date-ish word, else a text substring
  // across every text field.
  function matchOneToken(t, row){
    if (!t) return true;
    var cmp = t.match(/^(>=|<=|>|<)\s*(-?\d+(?:\.\d+)?)$/);
    if (cmp){
      var op = cmp[1], v = parseFloat(cmp[2]);
      return NUM_FIELDS.some(function(k){
        var x = parseFloat(row[k]);
        if (isNaN(x)) return false;
        if (op === '>') return x > v;
        if (op === '<') return x < v;
        if (op === '>=') return x >= v;
        return x <= v;
      });
    }
    if (/^-?\d+(?:\.\d+)?$/.test(t)){
      var v2 = parseFloat(t);
      if (NUM_FIELDS.some(function(k){ var x = parseFloat(row[k]); return !isNaN(x) && Math.abs(x - v2) < 1.0; })) return true;
      if (DATE_FIELDS.some(function(k){ return matchDateFilter(t, String(row[k]).toLowerCase()); })) return true;
      return false;
    }
    var looksDate = /^([a-z]{3,9}|\d{4}|\d{1,2}[\/-]\d{1,2}([\/-]\d{2,4})?)$|^([a-z]{3,9}\s+\d{4})$/i.test(t);
    if (looksDate){
      if (DATE_FIELDS.some(function(k){ return matchDateFilter(t, String(row[k]).toLowerCase()); })) return true;
      // fall through, still allow a plain text match (e.g. "may" in a name)
    }
    return TEXT_FIELDS.some(function(k){ return String(row[k] || '').toLowerCase().indexOf(t) >= 0; });
  }

  function matchUniversal(query, row){
    if (!query) return true;
    var q = String(query).trim().toLowerCase();
    if (!q) return true;
    if (matchOneToken(q, row)) return true; // whole phrase first, e.g. "in stock"
    var tokens = q.split(/\s+/).filter(Boolean);
    return tokens.every(function(tok){ return matchOneToken(tok, row); });
  }

  var colFilters = { name:'', category:'', status:'', price:'', restocked:'' };

  function colPasses(col, filterVal, row){
    if (!filterVal) return true;
    if (col === 'price') return matchNumFilter(filterVal, row.price);
    if (col === 'restocked') return matchDateFilter(filterVal, String(row.restocked).toLowerCase());
    return matchTextFilter(filterVal, row[col]);
  }

  function passes(row){
    if (!matchUniversal(searchInput.value, row)) return false;
    for (var k in colFilters){ if (!colPasses(k, colFilters[k], row)) return false; }
    return true;
  }

  function render(){
    if (!rowsEl.isConnected) return;
    var visible = ROWS.filter(passes);
    if (!visible.length){
      rowsEl.innerHTML = '<tr><td class="flt-empty" colspan="5">No rows match your filters. Try clearing the search or a column filter.</td></tr>';
    } else {
      rowsEl.innerHTML = visible.map(function(r){
        return '<tr>' +
          '<td class="flt-name-cell" title="' + esc(r.name) + '">' + esc(r.name) + '</td>' +
          '<td>' + esc(r.category) + '</td>' +
          '<td>' + esc(r.status) + '</td>' +
          '<td>$' + esc(String(r.price)) + '</td>' +
          '<td>' + esc(r.restocked) + '</td>' +
          '</tr>';
      }).join('');
    }
    countEl.textContent = 'Showing ' + visible.length + ' of ' + ROWS.length + ' rows';
  }

  searchInput.addEventListener('input', render);
  colInputs.forEach(function(inp){
    inp.addEventListener('input', function(){ colFilters[inp.getAttribute('data-col')] = inp.value; render(); });
  });
  clearBtn.addEventListener('click', function(){
    searchInput.value = '';

<template class="pattern" data-title="Paste Import" data-category="Flows" data-source="Kujira Collectibles v3.31 (features.js, parsePastedTable/mapFields/importNewType, lines 139-275)" data-note="Paste rows straight from a spreadsheet, tab-separated as browsers give on copy, or comma-separated, auto-map each header to a target schema (name, qty, price, date) by an exact alias match, clean the Qty and Price cells to plain numbers (strips a leading dollar sign and commas), then preview the mapped result before a separate Confirm step commits it. A row without the required Name value is never silently dropped, it is counted and reported. Editing the textarea after a preview invalidates it, so Confirm can never commit against stale rows. Unmapped columns such as Notes are flagged ignored in the mapping row and left out of the import. A separate CSV Import card in this library covers the quote-aware full parser for one uploaded file, this one is the paste-and-map flow for ad hoc spreadsheet rows using an exact alias match rather than substring matching. Related: CSV Import parses uploaded files, this card covers the paste-from-clipboard path with a preview step.">

<div class="pst-wrap">
  <div class="pst-label">Paste spreadsheet rows (header row first)</div>

<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var wrap = root.querySelector('.pst-wrap');
  var ta = root.querySelector('.pst-textarea');
  var sampleBtn = root.querySelector('.pst-btn-sample');
  var parseBtn = root.querySelector('.pst-btn-parse');
  var confirmBtn = root.querySelector('.pst-btn-confirm');
  var errEl = root.querySelector('.pst-err');
  var mapEl = root.querySelector('.pst-map');
  var tableWrap = root.querySelector('.pst-table-wrap');
  var skipEl = root.querySelector('.pst-skip');
  var resultEl = root.querySelector('.pst-result');
  var importedHead = root.querySelector('.pst-imported-head');
  var importedEl = root.querySelector('.pst-imported');
  if (!wrap || !ta || !sampleBtn || !parseBtn || !confirmBtn) return;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Generic demo schema, not Collectibles' fields. Exact alias match (not
  // substring), mirroring the source's mapFields() behaviour.
  var SCHEMA = [
    { out:'name',  label:'Name',  aliases:['product','productname','name','item','itemname'] },
    { out:'qty',   label:'Qty',   aliases:['qty','quantity','count'], numeric:true },
    { out:'price', label:'Price', aliases:['price','unitprice','cost','amount'], numeric:true },
    { out:'date',  label:'Date',  aliases:['date','datepurchased','purchasedate'] }
  ];

  function normH(h){ return String(h||'').trim().toLowerCase().replace(/[^a-z0-9]/g,''); }
  function cleanNum(v){
    if (v == null || String(v).trim() === '') return '';
    var x = parseFloat(String(v).replace(/[^0-9.\-]/g,''));
    return isNaN(x) ? '' : x;
  }
  function splitLine(line, delim){
    return line.split(delim).map(function(v){ return v.trim().replace(/^"|"$/g,''); });
  }
  // TSV (what a browser gives on copy from Sheets/Excel) or comma-separated.
  // Delimiter is auto-detected from the header line.
  function parsePasted(raw){
    var lines = raw.split(/\r\n|\n/).filter(function(l){ return l.trim() !== ''; });
    if (lines.length < 2) return null;
    var delim = lines[0].indexOf('\t') >= 0 ? '\t' : ',';
    var rawHeaders = splitLine(lines[0], delim);
    var headers = rawHeaders.map(normH);
    var rows = lines.slice(1).map(function(l){ return splitLine(l, delim); });
    return { headers: headers, rawHeaders: rawHeaders, rows: rows };
  }
  function mapFields(headers){
    return SCHEMA.map(function(f){
      var idx = headers.findIndex(function(h){ return f.aliases.indexOf(h) >= 0; });
      return { field: f, idx: idx };
    });
  }

  // Not written into the textarea until "Paste sample data" is clicked, so
  // the demo genuinely starts empty (placeholder visible) and the button has
  // a real job, simulating a clipboard paste with no clipboard involved.
  var SAMPLE = 'Product\tQuantity\tPrice\tDate Purchased\tNotes\n' +
    'Stainless Steel Water Bottle 32oz\t24\t$12.50\t2 Jul 2026\tRestock\n' +
    'Bluetooth Wireless Earbuds\t10\t45.99\t3 Jul 2026\t\n' +
    'Organic Cotton Tote Bag\t50\t3.20\t4 Jul 2026\tBulk order\n' +
    'Premium Hand-Stitched Leather Messenger Bag With Adjustable Strap And Brass Buckles, Limited Edition Autumn Collection\t5\t89.00\t5 Jul 2026\t\n' +
    '\t8\t15.00\t6 Jul 2026\tNo product name given\n' +
    'Ceramic Coffee Mug Set\t100\t22.00\t7 Jul 2026\t\n' +
    'Compact Travel Umbrella\t30\t9.75\t8 Jul 2026\tNew colour';

  var pendingRows = null;
  var imported = [];

  function invalidate(){
    if (!pendingRows) return;
    pendingRows = null;
    confirmBtn.disabled = true;
    if (resultEl){ resultEl.textContent = 'Input changed, click Parse & preview again before confirming.'; resultEl.className = 'pst-result pst-result-stale'; }
  }

  function run(){
    if (!wrap.isConnected) return;
    errEl.textContent = '';
    mapEl.innerHTML = '';
    skipEl.textContent = '';
    resultEl.textContent = '';
    resultEl.className = 'pst-result';
    confirmBtn.disabled = true;
    pendingRows = null;

    var raw = ta.value.trim();
    if (!raw){ errEl.textContent = 'Paste some rows first.'; tableWrap.innerHTML = '<div class="pst-empty">Nothing parsed yet. Paste rows above (or use the sample), then Parse &amp; preview.</div>'; return; }
    var parsed = parsePasted(raw);
    if (!parsed){ errEl.textContent = 'Need a header row plus at least one data row.'; return; }

    var mapping = mapFields(parsed.headers);
    var nameMap = mapping.filter(function(m){ return m.field.out === 'name'; })[0];
    if (nameMap.idx < 0){ errEl.textContent = 'Could not find a Name column in the header row.'; return; }

    var usedIdx = {};
    mapping.forEach(function(m){ if (m.idx >= 0) usedIdx[m.idx] = m.field.label; });
    mapEl.innerHTML = parsed.rawHeaders.map(function(h, i){
      var to = usedIdx[i];
      return '<span class="pst-tag' + (to ? ' pst-tag-hit' : '') + '">' + esc(h || '(blank)') + ' &rarr; ' + (to ? esc(to) : 'ignored') + '</span>';
    }).join('');

    var skipped = 0;
    var out = [];
    parsed.rows.forEach(function(r){
      var nameVal = (nameMap.idx >= 0 ? r[nameMap.idx] : '') || '';
      if (!nameVal.trim()){ skipped++; return; }
      var rec = {};
      mapping.forEach(function(m){
        var v = m.idx >= 0 ? (r[m.idx] || '') : '';
        rec[m.field.out] = m.field.numeric ? cleanNum(v) : v;
      });
      out.push(rec);
    });

    if (!out.length){
      errEl.textContent = 'Nothing to import: no rows had a Name value.';
      tableWrap.innerHTML = '<div class="pst-empty">No valid rows to preview.</div>';
      if (skipped) skipEl.textContent = skipped + ' row' + (skipped > 1 ? 's' : '') + ' skipped (missing Name).';
      return;
    }

    tableWrap.innerHTML =
      '<table><thead><tr>' + SCHEMA.map(function(f){ return '<th>' + esc(f.label) + '</th>'; }).join('') + '</tr></thead>' +
      '<tbody>' + out.map(function(r){
        return '<tr>' + SCHEMA.map(function(f){
          var v = r[f.out];
          var disp = (v === '' || v == null) ? '-' : String(v);
          return '<td title="' + esc(disp) + '">' + esc(disp) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table>';

    skipEl.textContent = skipped ? (skipped + ' row' + (skipped > 1 ? 's' : '') + ' skipped (missing Name).') : '';
    pendingRows = out;
    confirmBtn.disabled = false;
  }

  function renderImported(){
    if (!importedEl || !importedEl.isConnected) return;
    if (!imported.length){ importedHead.textContent = ''; importedEl.innerHTML = ''; return; }
    importedHead.textContent = 'Imported (' + imported.length + ')';
    importedEl.innerHTML = imported.map(function(r){
      var priceDisp = (r.price === '' || r.price == null) ? '-' : ('$' + r.price);
      var qtyDisp = (r.qty === '' || r.qty == null) ? '-' : String(r.qty);
      return '<div class="pst-imp-row"><span class="pst-imp-name" title="' + esc(r.name) + '">' + esc(r.name) + '</span>' +
        '<span class="pst-imp-meta">' + esc(qtyDisp) + ' &times; ' + esc(priceDisp) + ' &middot; ' + esc(r.date || '-') + '</span></div>';
    }).join('');
  }

  function confirmImport(){
    if (!pendingRows || !pendingRows.length) return;
    imported = imported.concat(pendingRows);
    renderImported();
    resultEl.textContent = 'Imported ' + pendingRows.length + ' row' + (pendingRows.length > 1 ? 's' : '') + ' into the list below.';
    resultEl.className = 'pst-result pst-result-ok';
    confirmBtn.disabled = true;
    pendingRows = null;
  }

  sampleBtn.addEventListener('click', function(){ ta.value = SAMPLE; run(); });
  parseBtn.addEventListener('click', run);
  confirmBtn.addEventListener('click', confirmImport);
  ta.addEventListener('input', invalidate);
})();
</script>
</template>


<template class="pattern" data-title="Undo Stack" data-category="Flows" data-source="Kujira Collectibles v3.31 (app.js, snapshotForUndo()/undoLast()/redoLast())" data-note="Snapshot-based multi-level undo/redo: every mutating action pushes a full state snapshot onto the undo stack BEFORE it changes anything, and starting a new action clears the redo branch, exactly like a text editor. Undo pushes the current state onto redo before popping and applying the previous one, redo is the mirror image. Ctrl/Cmd+Z undoes, Shift+Ctrl/Cmd+Z redoes, both ignored while typing in a field so native field-undo still works, and the two buttons double as a live depth counter for each stack. Add, edit and delete entries below, then undo and redo through them. Related: Undo Snapshot is the single-slot doctrine card, this is the full multi-step history stack with redo.">
<style>
.und-wrap{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;position:relative}
.und-toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.und-btn{padding:6px 12px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg3);color:var(--text);cursor:pointer;font-size:11.5px;font-weight:600;font-family:inherit;display:flex;align-items:center;gap:6px;transition:background var(--dur) ease-out}
.und-btn:hover{background:var(--bg4)}
.und-btn:active{transform:scale(.96)}
.und-btn:disabled{opacity:.4;cursor:not-allowed}
.und-depth{font-size:10px;background:var(--bg4);border-radius:999px;padding:1px 6px;color:var(--text2);font-variant-numeric:tabular-nums}
.und-hint{font-size:10px;color:var(--text3);margin-left:auto;white-space:nowrap}
.und-add-row{display:flex;gap:6px}
.und-input{flex:1;min-width:0;font-family:inherit;font-size:12.5px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius);padding:7px 10px;outline:none}
.und-input:focus{border-color:var(--accent)}
.und-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.und-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border)}
.und-row:last-child{border-bottom:none}
.und-text{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.und-text-input{flex:1;min-width:0;font-family:inherit;font-size:12.5px;background:var(--bg4);border:1px solid var(--accent);color:var(--text);border-radius:var(--radius);padding:5px 8px;outline:none}
.und-icon-btn{width:24px;height:24px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;transition:background var(--dur) ease-out,color var(--dur) ease-out}
.und-icon-btn:hover{background:var(--bg4);color:var(--text)}
.und-empty{padding:22px 14px;text-align:center;color:var(--text2);font-size:12px}
.und-empty strong{display:block;color:var(--text);font-size:13px;margin-bottom:4px;font-weight:640}
.und-toast-stack{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:5}
.und-toast{background:var(--bg4);border:1px solid var(--border2);color:var(--text);padding:7px 12px;border-radius:var(--radius);font-size:11.5px;box-shadow:var(--shadow-2);animation:und-pop var(--dur) var(--spring);white-space:nowrap}
@keyframes und-pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){ .und-toast{animation:none} }
</style>
<div class="und-wrap">
  <div class="und-toolbar">
    <button type="button" class="und-btn und-undo-btn" title="Undo (Ctrl/Cmd+Z)">&#8634; Undo <span class="und-depth">0</span></button>
    <button type="button" class="und-btn und-redo-btn" title="Redo (Shift+Ctrl/Cmd+Z)">&#8635; Redo <span class="und-depth">0</span></button>
    <span class="und-hint">^Z &middot; ^&#8679;Z</span>
  </div>
  <div class="und-add-row">
    <input type="text" class="und-input" placeholder="Add an entry..." maxlength="200" aria-label="New entry text">
    <button type="button" class="und-btn und-add-btn">Add</button>
  </div>
  <div class="und-list"></div>
  <div class="und-toast-stack"></div>
</div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var wrap = root.querySelector('.und-wrap');
  var undoBtn = root.querySelector('.und-undo-btn'), redoBtn = root.querySelector('.und-redo-btn');
  var input = root.querySelector('.und-input'), addBtn = root.querySelector('.und-add-btn');
  var listEl = root.querySelector('.und-list'), toasts = root.querySelector('.und-toast-stack');
  if (!wrap || !undoBtn || !redoBtn || !input || !addBtn || !listEl || !toasts) return;

  var STACK_LIMIT = 30;
  var seq = 0;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Invented generic demo entries, no app-specific data. One long entry
  // exercises the truncate-with-title-tooltip handling below.
  var state = [
    { id: ++seq, text: 'Draft the quarterly newsletter' },
    { id: ++seq, text: 'Confirm venue for the offsite' },
    { id: ++seq, text: 'Chase invoice #4471 from the printer' },
    { id: ++seq, text: 'Review the updated brand guidelines and circulate feedback to the design team by end of week' },
    { id: ++seq, text: 'Renew the team software licences' },
    { id: ++seq, text: 'Book flights for the conference' }
  ];
  var undoStack = [], redoStack = [];
  var editingId = null;

  // Doctrine: snapshot BEFORE the mutation, never after, and never derive
  // the "before" picture by reversing the "after" state.
  function snapshot(){
    undoStack.push(JSON.stringify(state));
    if (undoStack.length > STACK_LIMIT) undoStack.shift();
    redoStack.length = 0; // a fresh action invalidates the redo branch
  }

  function fireToast(msg){
    if (!toasts.isConnected) return;
    var el = document.createElement('div');
    el.className = 'und-toast';
    el.textContent = msg;
    toasts.appendChild(el);
    setTimeout(function(){ if (el.isConnected) el.remove(); }, 1800);
  }

  function render(){
    if (!wrap.isConnected) return;
    undoBtn.disabled = undoStack.length === 0;
    redoBtn.disabled = redoStack.length === 0;
    undoBtn.querySelector('.und-depth').textContent = undoStack.length;
    redoBtn.querySelector('.und-depth').textContent = redoStack.length;

    if (!state.length){
      listEl.innerHTML = '<div class="und-empty"><strong>No entries</strong>Add one above to get started.</div>';
      return;
    }
    listEl.innerHTML = state.map(function(item){
      if (item.id === editingId){
        return '<div class="und-row" data-id="' + item.id + '">' +
          '<input type="text" class="und-text-input" value="' + esc(item.text) + '" maxlength="200">' +
          '<button type="button" class="und-icon-btn und-save-btn" data-id="' + item.id + '" title="Save edit">&#10003;</button>' +
          '</div>';
      }
      return '<div class="und-row" data-id="' + item.id + '">' +
        '<span class="und-text" title="' + esc(item.text) + '">' + esc(item.text) + '</span>' +
        '<button type="button" class="und-icon-btn und-edit-btn" data-id="' + item.id + '" title="Edit entry">&#9998;</button>' +
        '<button type="button" class="und-icon-btn und-del-btn" data-id="' + item.id + '" title="Delete entry">&#10005;</button>' +
        '</div>';
    }).join('');
    if (editingId != null){
      var inp = listEl.querySelector('.und-text-input');
      if (inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    }
  }

  function doAdd(){
    var text = input.value.trim();
    if (!text) return; // never add a blank entry
    snapshot();
    state.push({ id: ++seq, text: text });
    input.value = '';
    render();
    fireToast('Entry added');
  }

  function doDelete(id){
    var idx = state.findIndex(function(it){ return it.id === id; });
    if (idx < 0) return;
    snapshot();
    state.splice(idx, 1);
    render();
    fireToast('Entry deleted');
  }

  function startEdit(id){ editingId = id; render(); }

  function commitEdit(id, text){
    var idx = state.findIndex(function(it){ return it.id === id; });
    editingId = null;
    if (idx < 0) return;
    var trimmed = text.trim();
    if (!trimmed || trimmed === state[idx].text){ render(); return; } // no real change, nothing to snapshot
    snapshot();
    state[idx] = { id: state[idx].id, text: trimmed };
    render();
    fireToast('Entry updated');
  }

  function undo(){
    if (!undoStack.length){ fireToast('Nothing to undo'); return; }
    redoStack.push(JSON.stringify(state));
    state = JSON.parse(undoStack.pop());
    editingId = null;
    render();
    fireToast('Undone');
  }
  function redo(){
    if (!redoStack.length){ fireToast('Nothing to redo'); return; }
    undoStack.push(JSON.stringify(state));
    state = JSON.parse(redoStack.pop());
    editingId = null;
    render();
    fireToast('Redone');
  }

  addBtn.addEventListener('click', doAdd);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); doAdd(); } });
  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);

  listEl.addEventListener('click', function(e){
    var editBtn = e.target.closest('.und-edit-btn');
    if (editBtn){ startEdit(Number(editBtn.getAttribute('data-id'))); return; }
    var delBtn = e.target.closest('.und-del-btn');
    if (delBtn){ doDelete(Number(delBtn.getAttribute('data-id'))); return; }
    var saveBtn = e.target.closest('.und-save-btn');
    if (saveBtn){
      var row = saveBtn.closest('.und-row');
      var inp = row && row.querySelector('.und-text-input');
      commitEdit(Number(saveBtn.getAttribute('data-id')), inp ? inp.value : '');
      return;
    }
  });
  listEl.addEventListener('keydown', function(e){
    var inp = e.target.closest('.und-text-input');
    if (!inp) return;
    var row = inp.closest('.und-row');
    if (e.key === 'Enter'){ e.preventDefault(); commitEdit(Number(row.getAttribute('data-id')), inp.value); }
    if (e.key === 'Escape'){ e.preventDefault(); editingId = null; render(); }
  });

  function onKeydown(e){
    if (!wrap.isConnected){ document.removeEventListener('keydown', onKeydown); return; }
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return; // never hijack native field editing/undo
    var mod = e.ctrlKey || e.metaKey;
    if (!mod || e.key.toLowerCase() !== 'z') return;
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
  }
  document.addEventListener('keydown', onKeydown);

  // Self-terminating: this listener sits on the shared document target (so
  // Ctrl/Cmd+Z works without first clicking into the card), so it cannot
  // rely on the card's own removal to clean it up. The moment this card's
  // root leaves the DOM (a filter cycle re-renders the whole gallery), stop
  // listening instead of leaking one dead listener per past instance.
  var mo = new MutationObserver(function(){
    if (!wrap.isConnected){
      document.removeEventListener('keydown', onKeydown);
      mo.disconnect();
    }
  });
  mo.observe(document.body, { childList: true, subtree: true });

  render();
})();
</script>
</template>


<template class="pattern" data-title="Trash Flow" data-category="Systems" data-source="Kujira Collectibles v3.31 (app.js, sendToTrash()/restoreFromTrash()/emptyTrash()/purgeExpiredTrash())" data-note="Soft delete: a delete moves the row into a separate Trash store instead of removing it, with a 30-day restore window shown as a per-row countdown. Restore re-inserts it, Empty Trash is the only true hard delete and always asks for confirmation first. This demo runs on an in-memory store only (Active/Trash tabs, delete, restore, empty-trash with confirm). The full architecture, the offline pending-write recovery queue that stops an offline delete losing its restore snapshot, the 30-day prune job, and how restore interacts with background sync, is in Soft Delete.md in this folder, too large for a single card.">
