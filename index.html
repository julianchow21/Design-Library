</style>
<div class="ic-wrap">
  <div class="ic-doc">
    <div class="ic-section" data-ic-id="s1">
      <div class="ic-section-head"><span class="ic-section-title">1. Scope</span><button type="button" class="ic-cbtn" data-ic-toggle="s1">+ Comment</button></div>
      <p class="ic-section-body">This change covers the intake flow and the confirmation screen. Everything after the record is created is out of scope for this round.</p>
      <div class="ic-cbox" data-ic-box="s1"><textarea data-ic-input="s1" placeholder="Your comment on this section..."></textarea></div>
    </div>
    <div class="ic-section" data-ic-id="s2">
      <div class="ic-section-head"><span class="ic-section-title">2. Risks</span><button type="button" class="ic-cbtn" data-ic-toggle="s2">+ Comment</button></div>
      <p class="ic-section-body">The main risk is the retry path on a timed-out submission. It must not create a duplicate record.</p>

    </div>

      <div class="ic-section-head"><span class="ic-section-title">3. Rollout</span><button type="button" class="ic-cbtn" data-ic-toggle="s3">+ Comment</button></div>
      <p class="ic-section-body">Ships behind a flag to a small slice of traffic first, full rollout once error rates hold steady.</p>

    </div>
  </div>
  <button type="button" class="ic-fab">Copy comments <span class="ic-fab-badge">0</span></button>
</div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var wrap = root.querySelector('.ic-wrap');
  var docEl = root.querySelector('.ic-doc');
  var fab = root.querySelector('.ic-fab');
  var fabBadge = root.querySelector('.ic-fab-badge');
  if (!wrap || !docEl || !fab || !fabBadge) return;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // In-memory only for this demo card. A real implementation persists this
  // object under its own namespaced localStorage key, JSON-stringified
  // inside a try/catch, the same doctrine as the Undo Snapshot card, so a
  // full or blocked store degrades to in-memory instead of throwing.
  var comments = {}; // { sectionId: { title, text } }

  function titleFor(id){
    var head = docEl.querySelector('[data-ic-id="' + id + '"] .ic-section-title');
    return head ? head.textContent : id;
  }

  function updateBadge(){
    if (!fabBadge.isConnected) return;
    fabBadge.textContent = String(Object.keys(comments).length);
  }

  function markButton(id, has){
    var btn = docEl.querySelector('[data-ic-toggle="' + id + '"]');
    if (!btn) return;
    btn.classList.toggle('ic-has', has);
    var box = docEl.querySelector('[data-ic-box="' + id + '"]');
    var open = box && box.classList.contains('ic-open');
    btn.textContent = has ? 'Comment ✓' : (open ? 'Close' : '+ Comment');
  }

  docEl.addEventListener('click', function(e){
    var btn = e.target.closest('[data-ic-toggle]');
    if (!btn) return;
    var id = btn.getAttribute('data-ic-toggle');
    var box = docEl.querySelector('[data-ic-box="' + id + '"]');
    if (!box) return;
    var open = box.classList.toggle('ic-open');
    markButton(id, !!(comments[id] && comments[id].text));
    if (open){ var ta = box.querySelector('textarea'); if (ta) ta.focus(); }
  });

  docEl.addEventListener('input', function(e){
    var ta = e.target.closest('[data-ic-input]');
    if (!ta) return;
    var id = ta.getAttribute('data-ic-input');
    var v = ta.value.trim();
    if (v) comments[id] = { title:titleFor(id), text:ta.value };
    else delete comments[id];
    markButton(id, !!v);
    updateBadge();
  });

  function assembleMarkdown(){
    var ids = Object.keys(comments);
    if (!ids.length) return '';
    return ids.map(function(id){ return '## ' + comments[id].title + '\n' + comments[id].text.trim(); }).join('\n\n');
  }

  function closePanel(){
    var ov = wrap.querySelector('.ic-overlay');
    if (ov) ov.remove();
  }

  function fallbackCopy(mdEl, statusEl){
    // Clipboard API can be blocked on file:// or outside a secure context.
    // The markdown is already visible and selectable in the box above, so
    // even a failed copy attempt leaves a usable fallback in view.
    try {
      if (mdEl){
        mdEl.removeAttribute('readonly');
        mdEl.select();
        var ok = document.execCommand && document.execCommand('copy');
        mdEl.setAttribute('readonly', '');
        if (statusEl) statusEl.textContent = ok ? 'Copied to clipboard.' : 'Could not copy automatically, select the text above and copy manually.';
        return;
      }
    } catch (e){}
    if (statusEl) statusEl.textContent = 'Could not copy automatically, select the text above and copy manually.';
  }

  function openPanel(){
    closePanel();
    var md = assembleMarkdown();
    var ov = document.createElement('div');
    ov.className = 'ic-overlay';
    var bodyHtml = md
      ? '<textarea class="ic-md" readonly></textarea>'
      : '<p class="ic-empty">No comments yet. Add one on any section, then come back here.</p>';
    ov.innerHTML =
      '<div class="ic-panel" role="dialog" aria-modal="true">' +
        '<div class="ic-panel-head"><h4>Comments, assembled</h4><button type="button" class="ic-x" aria-label="Close">&#10005;</button></div>' +
        '<div class="ic-panel-body">' + bodyHtml + '</div>' +
        '<div class="ic-panel-foot"><span class="ic-status" data-ic-status></span><button type="button" class="ic-btn ic-btn-primary" data-ic-copy>Copy</button></div>' +
      '</div>';
    ov.addEventListener('click', function(e){ if (e.target === ov) closePanel(); });
    ov.querySelector('.ic-x').addEventListener('click', closePanel);
    var mdEl = ov.querySelector('.ic-md');
    if (mdEl) mdEl.value = md;
    var statusEl = ov.querySelector('[data-ic-status]');
    ov.querySelector('[data-ic-copy]').addEventListener('click', function(){
      if (!md){ if (statusEl) statusEl.textContent = 'Nothing to copy.'; return; }
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(md).then(function(){
          if (statusEl) statusEl.textContent = 'Copied to clipboard.';
        }).catch(function(){ fallbackCopy(mdEl, statusEl); });
      } else {
        fallbackCopy(mdEl, statusEl);
      }
    });
    wrap.appendChild(ov);
  }

  fab.addEventListener('click', openPanel);

  updateBadge();
})();
</script>
</template>

<template class="pattern" data-title="Sync Pill" data-category="Components" data-source="Kujira Journal (index.html, renderSaveState()/handleSaveStateClick() plus .save-state CSS at 52-59) merged with investment-tracker.html (renderSyncBadge()/relTime() at 943-974, syncPrices() banner plus one-shot auto-fallback at 1071-1158)" data-note="Two sync-status patterns merged into one pill. Journal's saved/saving/offline/error states carry icon plus text always (never colour alone), clickable (or Enter/Space) to retry only in the error state, harmless the rest of the time. investment-tracker adds a stale flag on top of 'saved', a relative-time label that swaps to a clock icon and amber colour once the last sync crosses an age threshold, plus a plain-language banner on failure. The banner's auto-fallback doctrine is one-shot only: it tries exactly one alternate source automatically and always reports plainly what happened, it never loops silently. Demo buttons cycle every state, Simulate sync failure shows the banner and its single automatic fallback attempt.">
<style>
.sp-demo{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:320px}
.sp-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:12px;font-family:inherit;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:default}
.sp-pill[data-state="saving"]{color:var(--blue);border-color:var(--blue)}
.sp-pill[data-state="offline"]{color:var(--amber);border-color:var(--amber)}
.sp-pill[data-state="stale"]{color:var(--amber);border-color:var(--amber)}
.sp-pill[data-state="error"]{color:var(--red);border-color:var(--red);cursor:pointer}
.sp-pill[data-state="error"]:hover{background:var(--red-soft)}
.sp-icon{font-size:11px;line-height:1}
.sp-banner{width:100%;font-size:12px;padding:8px 11px;border-radius:var(--radius);background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber)}
.sp-banner.sp-err{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.sp-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sp-btn{padding:6px 11px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg4);color:var(--text);cursor:pointer;font-size:11px;font-weight:500;font-family:inherit;transition:background var(--dur) ease-out}
.sp-btn:hover{background:var(--bg3)}
.sp-btn-danger{border-color:var(--red);color:var(--red)}
.sp-btn-danger:hover{background:var(--red-soft)}
</style>
<div class="sp-demo">
  <button type="button" class="sp-pill" data-state="saved" aria-live="polite">
    <span class="sp-icon" aria-hidden="true">&#10003;</span>
    <span class="sp-text">Synced just now</span>
  </button>
  <div class="sp-banner" hidden></div>
  <div class="sp-btns">
    <button type="button" class="sp-btn" data-sp-state="saved">Saved</button>
    <button type="button" class="sp-btn" data-sp-state="saving">Saving</button>
    <button type="button" class="sp-btn" data-sp-state="offline">Offline</button>
    <button type="button" class="sp-btn" data-sp-state="stale">Stale</button>
    <button type="button" class="sp-btn" data-sp-state="error">Error</button>
    <button type="button" class="sp-btn sp-btn-danger" data-sp-fail="1">Simulate sync failure</button>
  </div>
</div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var pill = root.querySelector('.sp-pill');
  var icon = root.querySelector('.sp-icon');
  var text = root.querySelector('.sp-text');
  var banner = root.querySelector('.sp-banner');
  var btns = root.querySelectorAll('[data-sp-state]');
  var failBtn = root.querySelector('[data-sp-fail]');
  if (!pill || !icon || !text || !banner || !btns.length) return;

  var MAP = {
    saved:   { icon: '✓', label: 'Synced' },
    stale:   { icon: '⏱', label: 'Synced' },
    saving:  { icon: '⟳', label: 'Saving…' },
    offline: { icon: '⚠', label: 'Offline' },
    error:   { icon: '✕', label: 'Sync error, click to retry' }
  };

  // Demo-only clock: a fixed "last synced" instant that ages in real time,
  // so relTime()/the stale threshold below have something real to compute
  // from. No timestamps are fabricated as real data, this is a UI demo.
  var lastSyncAt = Date.now() - 45000;
  var STALE_MS = 5 * 60 * 1000; // demo threshold (source used 3 days)

  function relTime(ms){
    var s = Math.max(0, Math.floor((Date.now() - ms) / 1000));
    if (s < 5) return 'just now';
    if (s < 60) return s + 's ago';
    var m = Math.floor(s / 60);
    if (m < 60) return m + 'm ago';
    return Math.floor(m / 60) + 'h ago';
  }

  function setState(state){
    var m = MAP[state] || MAP.saved;
    pill.dataset.state = state;
    icon.textContent = m.icon;
    text.textContent = (state === 'saved' || state === 'stale') ? ('Synced ' + relTime(lastSyncAt)) : m.label;
    pill.title = state === 'error' ? 'Could not save, click to retry' : text.textContent;
  }

  function showBanner(msg, isErr){
    banner.hidden = false;
    banner.textContent = msg;
    banner.classList.toggle('sp-err', !!isErr);
  }
  function hideBanner(){ banner.hidden = true; banner.textContent = ''; }

  btns.forEach(function(b){
    b.addEventListener('click', function(){
      hideBanner();
      var st = b.getAttribute('data-sp-state');
      lastSyncAt = st === 'stale' ? (Date.now() - (STALE_MS + 60000)) : Date.now();
      setState(st);
    });
  });

  // Click-to-retry: Journal's doctrine, only wired live in the error state,
  // a no-op the rest of the time so the pill can stay clickable at all times.
  pill.addEventListener('click', function(){
    if (pill.dataset.state !== 'error') return;
    hideBanner();
    setState('saving');
    setTimeout(function(){
      if (!pill.isConnected) return;
      lastSyncAt = Date.now();
      setState('saved');
    }, 900);
  });

  // One-shot auto-fallback doctrine: a failed sync tries exactly one
  // alternate source automatically, then always reports plainly, never
  // loops or retries silently a second time.
  if (failBtn){
    failBtn.addEventListener('click', function(){
      hideBanner();
      setState('error');
      showBanner('Sync blocked (network). Switching to backup source once…', true);
      setTimeout(function(){
        if (!pill.isConnected) return;
        lastSyncAt = Date.now();
        setState('saved');
        showBanner('Synced via backup source.', false);
        setTimeout(function(){ if (banner.isConnected) hideBanner(); }, 2600);
      }, 1300);
    });
  }

  // Relative-time ticker, self-terminating the moment the pill leaves the
  // DOM (a filter re-render can discard this exact instance at any time).
  var timer = setInterval(function(){
    if (!pill.isConnected){ clearInterval(timer); return; }
    if (pill.dataset.state === 'saved' || pill.dataset.state === 'stale') setState(pill.dataset.state);
  }, 5000);

  setState('saved');
})();
</script>
</template>

<style>
.cf-wrap{width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px}
.cf-chart{display:flex;align-items:flex-end;gap:8px;height:130px;padding:0 2px}

</style>
<div class="cf-wrap">
  <div class="cf-chart" aria-label="Monthly spend, click or press Enter on a bar to filter"></div>
  <div class="cf-scope">

    </div>
  </div>
</div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var chart = root.querySelector('.cf-chart');
  var scopeLabel = root.querySelector('.cf-scope-label');
  var clearBtn = root.querySelector('.cf-clear');
  var barsEl = root.querySelector('.cf-bars');
  var tbody = root.querySelector('.cf-tbody');
  if (!chart || !scopeLabel || !clearBtn || !barsEl || !tbody) return;

  // Invented demo data only: [merchant, category, amount]. No real transactions.
  var DATA = {
    Jan: [['Corner Grocer','Groceries',82],['Metro Transit','Transport',40],['Riverside Cafe','Dining',24],['Northside Utilities','Utilities',58]],
    Feb: [['Corner Grocer','Groceries',76],['Downtown Cinema','Entertainment',30],['Riverside Cafe','Dining',33]],
    Mar: [['Harbor Market','Groceries',94],['Metro Transit','Transport',44],['Lakeside Diner','Dining',52],['Northside Utilities','Utilities',61]],
    Apr: [['Corner Grocer','Groceries',88],['Metro Transit','Transport',38]],
    May: [['Harbor Market','Groceries',101],['Riverside Cafe','Dining',29],['Downtown Cinema','Entertainment',22],['Northside Utilities','Utilities',64]],
    Jun: [['Corner Grocer','Groceries',79],['Lakeside Diner','Dining',47],['Metro Transit','Transport',41]]
  };
  var MONTHS = Object.keys(DATA);
  var selMonth = null;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function money(n){ return '$' + n.toFixed(0); }
  function monthTotal(m){ return DATA[m].reduce(function(s, r){ return s + r[2]; }, 0); }
  function scopedMonths(){ return selMonth ? [selMonth] : MONTHS; }
  function scopedRows(){
    var rows = [];
    scopedMonths().forEach(function(m){
      DATA[m].forEach(function(r, i){ rows.push({ m: m, day: (i * 6 + 3), merchant: r[0], cat: r[1], amt: r[2] }); });
    });
    return rows;
  }

  function renderChart(){
    var max = Math.max.apply(null, MONTHS.map(monthTotal)) || 1;
    chart.innerHTML = MONTHS.map(function(m){
      var v = monthTotal(m), h = Math.max(3, v / max * 90), on = m === selMonth;
      return '<div class="cf-bar' + (on ? ' on' : '') + '" data-m="' + m + '" role="button" tabindex="0" aria-pressed="' + on + '" aria-label="' + m + ' ' + money(v) + '">' +
        '<span class="cf-amt">' + money(v) + '</span>' +
        '<div class="cf-fill" style="height:' + h + 'px"></div>' +
        '<span class="cf-lb">' + m + '</span>' +
      '</div>';
    }).join('');
    chart.querySelectorAll('.cf-bar').forEach(function(b){
      var act = function(){ selMonth = (selMonth === b.dataset.m) ? null : b.dataset.m; renderAll(); };
      b.addEventListener('click', act);
      b.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); act(); } });
    });
  }

  function renderPanels(){
    var rows = scopedRows();
    scopeLabel.textContent = 'Showing: ' + (selMonth || 'All months');
    clearBtn.hidden = !selMonth;

    var byCat = {};
    rows.forEach(function(r){ byCat[r.cat] = (byCat[r.cat] || 0) + r.amt; });
    var cats = Object.keys(byCat).map(function(c){ return [c, byCat[c]]; }).sort(function(a, b){ return b[1] - a[1]; });
    var maxCat = Math.max.apply(null, cats.map(function(c){ return c[1]; })) || 1;
    barsEl.innerHTML = cats.length ? cats.map(function(c){
      var w = (c[1] / maxCat * 100).toFixed(1);
      return '<div class="cf-brow"><div class="cf-blab">' + esc(c[0]) + '</div><div class="cf-btrack"><div class="cf-bfill" style="width:' + w + '%"></div></div><div class="cf-bval">' + money(c[1]) + '</div></div>';
    }).join('') : '<p class="cf-empty">No transactions in this scope.</p>';

    tbody.innerHTML = rows.length ? rows.map(function(r){
      return '<tr><td>' + r.m + ' ' + r.day + '</td><td>' + esc(r.merchant) + '</td><td><span class="cf-chip">' + esc(r.cat) + '</span></td><td class="cf-num">' + money(r.amt) + '</td></tr>';
    }).join('') : '<tr><td colspan="4" class="cf-empty">No transactions in this scope.</td></tr>';
  }

  function renderAll(){ renderChart(); renderPanels(); }

  clearBtn.addEventListener('click', function(){ selMonth = null; renderAll(); });

  renderAll();
})();
</script>
</template>

<template class="pattern" data-title="Market Hours" data-category="Utilities" data-source="investment-tracker.html (nyParts()/marketState()/renderMarketPill() at 976-1001, .mkt-pill CSS at 169-189, price flashUp/flashDown keyframes at 183-186)" data-note="Market state (pre-market / live / after-hours / closed) is derived from Intl.DateTimeFormat's timeZone option converting the current instant straight into the market's local weekday/hour/minute, no manual UTC offset maths, so it stays correct across daylight saving automatically. The open-state dot pulses via a shared box-shadow keyframe (colour from currentColor, no hardcoded rgba); reduced motion is honoured both by the library's shared kill-switch in tokens.css and an explicit override here that removes the pulse and the price flash outright. The recheck interval self-terminates the moment the pill leaves the DOM. Second demo button flashes a sample price green or red on change, icon-independent so it never relies on colour alone (the numeral itself also updates).">
<style>
.mh-demo{display:flex;flex-direction:column;gap:16px;width:100%;max-width:320px;align-items:center}
.mh-pillrow{display:flex;align-items:center;gap:10px}
.mh-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
.mh-dot{width:7px;height:7px;border-radius:50%;background:currentColor}

.mh-pill[data-state="pre"],.mh-pill[data-state="post"]{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.mh-pill[data-state="closed"]{background:var(--bg4);color:var(--text3)}
@keyframes mh-pulse{
  0%{box-shadow:0 0 0 0 color-mix(in srgb, currentColor 55%, transparent);opacity:1}
  70%{box-shadow:0 0 0 6px color-mix(in srgb, currentColor 0%, transparent);opacity:.55}
  100%{box-shadow:0 0 0 0 color-mix(in srgb, currentColor 0%, transparent);opacity:1}
}
.mh-tz{font-size:11px;color:var(--text3)}
.mh-pricebox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.mh-symbol{font-size:12px;font-weight:600;color:var(--text2)}
.mh-price{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 6px;border-radius:var(--radius)}
.mh-price.mh-flash-up{animation:mh-flash-up 1s ease}
.mh-price.mh-flash-down{animation:mh-flash-down 1s ease}
@keyframes mh-flash-up{0%{background:var(--green-soft)}100%{background:transparent}}
@keyframes mh-flash-down{0%{background:var(--red-soft)}100%{background:transparent}}
.mh-btn{padding:6px 11px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg4);color:var(--text);cursor:pointer;font-size:11px;font-family:inherit}
.mh-btn:hover{background:var(--bg3)}
@media(prefers-reduced-motion:reduce){
  .mh-pill .mh-dot{animation:none}
  .mh-price.mh-flash-up,.mh-price.mh-flash-down{animation:none}
}
</style>
<div class="mh-demo">
  <div class="mh-pillrow">
    <span class="mh-pill" data-state="closed">
      <span class="mh-dot" aria-hidden="true"></span>
      <span class="mh-label">Closed</span>
    </span>
    <span class="mh-tz">New York market time</span>
  </div>
  <div class="mh-pricebox">
    <span class="mh-symbol">DEMO</span>
    <span class="mh-price">$142.10</span>
    <button type="button" class="mh-btn" data-mh-move="up">Simulate price up</button>
    <button type="button" class="mh-btn" data-mh-move="down">Simulate price down</button>
  </div>
</div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var pill = root.querySelector('.mh-pill');
  var label = root.querySelector('.mh-label');
  var priceEl = root.querySelector('.mh-price');
  var upBtn = root.querySelector('[data-mh-move="up"]');
  var downBtn = root.querySelector('[data-mh-move="down"]');
  if (!pill || !label || !priceEl) return;

  function mhNyParts(d){
    d = d || new Date();
    var fmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
    var parts = {};
    fmt.formatToParts(d).forEach(function(p){ parts[p.type] = p.value; });
    return { weekday: parts.weekday, hour: parseInt(parts.hour, 10), minute: parseInt(parts.minute, 10) };
  }
  function mhMarketState(){
    var p = mhNyParts();
    if (p.weekday === 'Sat' || p.weekday === 'Sun') return { state: 'closed', label: 'Closed (weekend)' };
    var mins = p.hour * 60 + p.minute;
    if (mins >= 4 * 60 && mins < 9 * 60 + 30) return { state: 'pre', label: 'Pre-market' };
    if (mins >= 9 * 60 + 30 && mins < 16 * 60) return { state: 'open', label: 'Live' };
    if (mins >= 16 * 60 && mins < 20 * 60) return { state: 'post', label: 'After-hours' };
    return { state: 'closed', label: 'Closed' };
  }
  function renderPill(){
    if (!pill.isConnected) return;
    var m = mhMarketState();
    pill.dataset.state = m.state;
    label.textContent = m.label;
  }
  renderPill();

  // Self-terminating: re-checks every 30s while this instance stays in the
  // DOM, stops and clears itself the moment a filter cycle removes it.
  var timer = setInterval(function(){
    if (!pill.isConnected){ clearInterval(timer); return; }
    renderPill();
  }, 30000);

  var price = 142.10;
  function flash(dir){
    if (!priceEl.isConnected) return;
    price = dir === 'up' ? price + 1.35 : Math.max(1, price - 1.35);
    priceEl.textContent = '$' + price.toFixed(2);
    priceEl.classList.remove('mh-flash-up', 'mh-flash-down');
    void priceEl.offsetWidth; // restart the keyframe on repeated same-direction clicks
    priceEl.classList.add(dir === 'up' ? 'mh-flash-up' : 'mh-flash-down');
  }
  if (upBtn) upBtn.addEventListener('click', function(){ flash('up'); });
  if (downBtn) downBtn.addEventListener('click', function(){ flash('down'); });
})();
</script>

<template class="pattern" data-title="Settings Drawer" data-category="Components" data-source="Kujira Portfolio Trading (index.html, .scrim/.drawer CSS at 199-210, markup at 471-474, openDrawer()/closeDrawer() at 1942-1943)" data-note="Right-side slide-in drawer, distinct from this library's centred Modal Shell: transform:translateX(100%) to .sd-show's translateX(0) instead of a fade-and-scale overlay, so it reads as a persistent settings panel rather than a one-off dialog. A backdrop scrim closes it on click, same as the X button. This demo scopes the scrim and drawer to the card's own bounds instead of the full viewport (same reasoning as Modal Shell: it cannot leak past a filter re-render). The scrim's rgba(0,0,0,.5) is the same deliberate tokens exception Modal Shell documents, a scrim needs to darken whatever is behind it the same way in both themes. The transform transition is neutralised under prefers-reduced-motion by the library's shared kill-switch in tokens.css.">
<style>
.sd-wrap{position:relative;width:100%;min-height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--bg3)}

<template class="pattern" data-title="Tree Finder" data-category="Components" data-source="clean-room build from a text description of a file-browser panel screenshot Julian admires (no source code or image was available)" data-note="Filterable file tree: typing narrows every node by name live, a kept node drags its whole ancestor chain open with it, everything else drops out. A leading ? switches to a content search over each file's short embedded body instead of its name (invented sample text, no real file reads), a matching file shows a highlighted snippet of where the hit landed. One roving-tabindex row is always the current selection: Up/Down move it among visible rows, Right opens a closed folder or steps into an already-open one, Left closes an open folder or steps up to its parent, Enter marks the row Opened, a highlighted no-op since there is no file viewer to open into. Folder state reads from chevron rotation plus indentation, never colour alone, the accent tint on a folder icon is only a secondary cue on top of that. Deliberately a flat aria-level/aria-expanded treeitem list rather than nested role=group subtrees, the same pragmatic accessible-tree approach as this library's Month Calendar roving tabindex, not a full WAI-ARIA treegrid. Try 'test' to see a folder and a nested file match together, or '?currency' to search file contents.">
<style>
.tf-panel{width:100%;max-width:340px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);display:flex;flex-direction:column;overflow:hidden;font-size:12.5px;color:var(--text)}
.tf-head{padding:12px 14px 0}
.tf-title{font-size:11px;font-weight:640;letter-spacing:.3px;color:var(--text3);text-transform:uppercase}
.tf-filter-row{display:flex;align-items:center;gap:7px;margin:9px 12px 10px;padding:6px 10px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg3);transition:border-color var(--dur) ease-out}
.tf-filter-row:focus-within{border-color:var(--accent)}
.tf-filter-icon{color:var(--text3);font-size:12px;flex-shrink:0;line-height:1}
.tf-filter{flex:1;border:none;background:none;outline:none;color:var(--text);font-family:inherit;font-size:12px;min-width:0}
.tf-filter::placeholder{color:var(--text3)}
.tf-tree-wrap{position:relative;overflow-y:auto;max-height:270px;padding:2px 6px 6px;border-top:1px solid var(--border)}
.tf-tree{list-style:none}
.tf-row{display:flex;flex-direction:column;gap:2px;padding:5px 8px 5px 0;border-radius:7px;cursor:pointer;color:var(--text2);min-width:0}
.tf-row:hover{background:var(--bg3)}
.tf-row.tf-active{background:var(--bg4);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.tf-row.tf-active .tf-name{font-weight:640}
.tf-row-main{display:flex;align-items:center;gap:6px;min-width:0}
.tf-toggle{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text3)}
button.tf-toggle{border:none;background:none;padding:0;cursor:pointer}
.tf-row[aria-expanded="true"] .tf-toggle{transform:rotate(90deg)}
.tf-icon{flex-shrink:0;color:var(--text3)}
.tf-row[data-type="folder"] .tf-icon{color:var(--accent)}
.tf-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.tf-mark{background:var(--accent-soft);color:var(--accent);font-weight:640;border-radius:3px;padding:0 1px}
.tf-opened-badge{margin-left:6px;font-size:9px;font-weight:640;text-transform:uppercase;letter-spacing:.3px;color:var(--green);background:var(--green-soft);padding:1px 6px;border-radius:999px;vertical-align:middle;flex-shrink:0}
.tf-snippet{margin-left:34px;font-size:10.5px;color:var(--text3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tf-empty{padding:26px 16px;text-align:center;color:var(--text2)}
.tf-empty-icon{margin:0 auto 10px;display:block}
.tf-ee-a{fill:var(--bg4)}
.tf-ee-b{stroke:var(--border2)}
.tf-ee-c{fill:var(--accent-soft)}
.tf-empty h4{font-size:13px;color:var(--text);font-weight:640;margin-bottom:4px}
.tf-empty p{font-size:11.5px;max-width:230px;margin:0 auto 12px}
.tf-clear{padding:6px 13px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg3);color:var(--text);cursor:pointer;font-size:11.5px;font-weight:500}
.tf-clear:hover{background:var(--bg4)}
.tf-status{padding:7px 14px;border-top:1px solid var(--border);font-size:10.5px;color:var(--text3);margin:0}
</style>
<div class="tf-panel">
  <div class="tf-head"><h3 class="tf-title">Files</h3></div>
  <div class="tf-filter-row">
    <span class="tf-filter-icon" aria-hidden="true">&#9013;</span>
    <input type="text" class="tf-filter" placeholder="Filter files... (?text to search contents)" aria-label="Filter files by name, or type ? followed by text to search file contents" autocomplete="off" spellcheck="false">
  </div>
  <div class="tf-tree-wrap">
    <ul class="tf-tree" role="tree" aria-label="Files"></ul>
    <div class="tf-empty hidden">
      <svg class="tf-empty-icon" viewBox="0 0 64 46" width="48" aria-hidden="true">
        <rect class="tf-ee-a" x="6" y="12" width="38" height="28" rx="4"/>
        <path class="tf-ee-b" d="M6 18 L6 11 Q6 7 10 7 L20 7 L24 12 L40 12 Q44 12 44 16" fill="none" stroke-width="2"/>
        <circle class="tf-ee-c" cx="48" cy="32" r="12"/>
        <path d="M44 28 L52 36 M52 28 L44 36" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h4 class="tf-empty-title">No files match</h4>
      <p class="tf-empty-sub"></p>
      <button type="button" class="tf-clear">Clear filter</button>
    </div>
  </div>
  <p class="tf-status" aria-live="polite"></p>
</div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var input = root.querySelector('.tf-filter');
  var treeEl = root.querySelector('.tf-tree');
  var emptyEl = root.querySelector('.tf-empty');
  var statusEl = root.querySelector('.tf-status');
  if (!input || !treeEl || !emptyEl || !statusEl) return;
  var emptyTitleEl = emptyEl.querySelector('.tf-empty-title');
  var emptySubEl = emptyEl.querySelector('.tf-empty-sub');
  var clearBtn = emptyEl.querySelector('.tf-clear');

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Invented sample workspace, a short content body per file so a leading
  // "?" query can search file contents, not just names.
  var DATA = [
    { name:'src', type:'folder', children:[
      { name:'components', type:'folder', children:[
        { name:'Button.tsx', type:'file', content:'export function Button({ label, onClick }) { return <button onClick={onClick}>{label}</button>; }' },
        { name:'Modal.tsx', type:'file', content:'export function Modal({ open, children }) { if (!open) return null; return <div className="modal">{children}</div>; }' },
        { name:'index.ts', type:'file', content:"export * from './Button'; export * from './Modal';" }
      ]},
      { name:'hooks', type:'folder', children:[
        { name:'useDebounce.ts', type:'file', content:'export function useDebounce(value, delay) { const [state, setState] = useState(value); return state; }' }
      ]},
      { name:'utils', type:'folder', children:[
        { name:'format.ts', type:'file', content:"export function formatCurrency(value) { return new Intl.NumberFormat('en-SG', { style: 'currency', currency: 'SGD' }).format(value); }" },
        { name:'date.ts', type:'file', content:'export function relativeTime(iso) { return Math.round((Date.now() - new Date(iso)) / 86400000) + "d ago"; }' }
      ]},
      { name:'App.tsx', type:'file', content:"import { Button } from './components'; export default function App() { return <Button label=\"Save\" onClick={save} />; }" }
    ]},
    { name:'docs', type:'folder', children:[
      { name:'quarterly-financial-summary-and-projections-for-stakeholder-review.md', type:'file', content:'Q3 revenue grew 12 percent quarter over quarter, driven mainly by the enterprise tier renewal cohort.' },
      { name:'onboarding.md', type:'file', content:'New team members should read the architecture overview before their first pull request.' }
    ]},
    { name:'tests', type:'folder', children:[
      { name:'Button.test.tsx', type:'file', content:"describe('Button', function(){ it('calls onClick when clicked', function(){}); });" }
    ]},
    { name:'package.json', type:'file', content:'{ "name": "tree-finder-demo", "version": "1.0.0", "dependencies": { "react": "^18.2.0" } }' },
    { name:'README.md', type:'file', content:'Tree Finder demo workspace. Run npm install then npm run dev to start the local server.' }
  ];

  (function assignIds(nodes, prefix){
    nodes.forEach(function(n){
      n.id = prefix + n.name;
      if (n.children) assignIds(n.children, n.id + '/');
    });
  })(DATA, '');

  var byId = {};
  (function indexNodes(nodes){
    nodes.forEach(function(n){ byId[n.id] = n; if (n.children) indexNodes(n.children); });
  })(DATA);

  var totalCounts = (function(){
    var files = 0, folders = 0;
    (function walk(nodes){
      nodes.forEach(function(n){
        if (n.type === 'folder'){ folders++; walk(n.children || []); }
        else files++;
      });
    })(DATA);
    return { files: files, folders: folders };
  })();

  // Per-instance state, closured, never global, so cycling the gallery's
  // filter never lets one card instance leak into another's.
  var state = { query: '', expanded: {}, activeId: null, openedId: null };
  DATA.forEach(function(n){ if (n.type === 'folder') state.expanded[n.id] = true; });

  var lastRows = [];

  function matchesName(n, needle){ return n.name.toLowerCase().indexOf(needle) !== -1; }
  function matchesContent(n, needle){ return n.type === 'file' && !!n.content && n.content.toLowerCase().indexOf(needle) !== -1; }

  function highlightName(name, needle){
    var lower = name.toLowerCase();
    var idx = lower.indexOf(needle);
    if (idx === -1) return esc(name);
    return esc(name.slice(0, idx)) + '<mark class="tf-mark">' + esc(name.slice(idx, idx + needle.length)) + '</mark>' + esc(name.slice(idx + needle.length));
  }

  function snippetFor(content, needle){
    var lower = content.toLowerCase();
    var idx = lower.indexOf(needle);
    if (idx === -1) return esc(content.slice(0, 70)) + (content.length > 70 ? '…' : '');
    var start = Math.max(0, idx - 18);
    var end = Math.min(content.length, idx + needle.length + 30);
    return (start > 0 ? '…' : '') + esc(content.slice(start, idx)) +
      '<mark class="tf-mark">' + esc(content.slice(idx, idx + needle.length)) + '</mark>' +
      esc(content.slice(idx + needle.length, end)) + (end < content.length ? '…' : '');
  }

  // Walks the whole tree once, working out which nodes match the current
  // query (own match) and which subtrees contain a match (any), then
  // flattens only the kept nodes into a display-ordered row list, forcing
  // open any folder that owes its visibility to a matching descendant.
  function buildVisible(){
    var trimmed = state.query.trim();
    var contentMode = trimmed.charAt(0) === '?';
    var needle = (contentMode ? trimmed.slice(1) : trimmed).trim().toLowerCase();
    var filtering = needle.length > 0;

    var matchInfo = {};
    function scan(n){
      var own = filtering && (contentMode ? matchesContent(n, needle) : matchesName(n, needle));
      var hit = own;
      if (n.children) n.children.forEach(function(c){ if (scan(c)) hit = true; });
      matchInfo[n.id] = { own: own, hit: hit };
      return hit;
    }
    DATA.forEach(scan);

    var rows = [];
    function walk(n, depth){
      if (filtering && !matchInfo[n.id].hit) return;
      var hasKids = n.type === 'folder' && !!n.children && n.children.length > 0;
      var open = false;
      if (hasKids){
        var childrenHit = filtering && n.children.some(function(c){ return matchInfo[c.id] && matchInfo[c.id].hit; });
        open = filtering ? (childrenHit || !!state.expanded[n.id]) : !!state.expanded[n.id];
      }
      rows.push({ node: n, depth: depth, own: matchInfo[n.id] ? matchInfo[n.id].own : false, open: open, hasKids: hasKids });
      if (hasKids && open) n.children.forEach(function(c){ walk(c, depth + 1); });
    }
    DATA.forEach(function(n){ walk(n, 0); });

    return { rows: rows, filtering: filtering, contentMode: contentMode, needle: needle };
  }

  function rowHtml(r, result){
    var n = r.node, depth = r.depth;
    var isActive = n.id === state.activeId;
    var isOpened = n.id === state.openedId;
    var showNameMark = result.filtering && !result.contentMode && r.own;
    var nameHtml = showNameMark ? highlightName(n.name, result.needle) : esc(n.name);
    var toggle = r.hasKids
      ? '<button type="button" class="tf-toggle" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M5 3 L11 8 L5 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'
      : '<span class="tf-toggle" aria-hidden="true"></span>';
    var icon = n.type === 'folder'
      ? '<svg class="tf-icon" viewBox="0 0 20 16" width="13" height="13" aria-hidden="true"><path d="M1 3.5C1 2.67 1.67 2 2.5 2H7L8.6 3.6H17.5C18.33 3.6 19 4.27 19 5.1V12.5C19 13.33 18.33 14 17.5 14H2.5C1.67 14 1 13.33 1 12.5Z" fill="currentColor"/></svg>'
      : '<svg class="tf-icon" viewBox="0 0 16 20" width="11" height="13" aria-hidden="true"><path d="M2 1H10L14 5V19H2Z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10 1V5H14" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>';
    var snippet = '';
    if (result.filtering && result.contentMode && r.own && n.content){
      snippet = '<span class="tf-snippet">' + snippetFor(n.content, result.needle) + '</span>';
    }
    return '<li class="tf-row' + (isActive ? ' tf-active' : '') + '" role="treeitem" data-id="' + esc(n.id) + '" data-type="' + n.type + '" aria-level="' + (depth + 1) + '"' +
      (r.hasKids ? ' aria-expanded="' + (r.open ? 'true' : 'false') + '"' : '') +
      ' aria-selected="' + (isActive ? 'true' : 'false') + '" tabindex="' + (isActive ? '0' : '-1') + '" style="padding-left:' + (6 + depth * 18) + 'px" title="' + esc(n.name) + '">' +
      '<span class="tf-row-main">' + toggle + icon + '<span class="tf-name">' + nameHtml + '</span>' +
      (isOpened ? '<span class="tf-opened-badge">Opened</span>' : '') + '</span>' +
      snippet +
    '</li>';
  }

  function findRowEl(id){
    if (!id) return null;
    for (var i = 0; i < treeEl.children.length; i++){
      if (treeEl.children[i].getAttribute('data-id') === id) return treeEl.children[i];
    }
    return null;
  }

  function render(){
    var result = buildVisible();
    lastRows = result.rows;

    if (result.filtering && result.rows.length === 0){
      treeEl.classList.add('hidden');
      emptyEl.classList.remove('hidden');
      emptySubEl.textContent = result.contentMode
        ? (result.needle ? 'Nothing in this workspace contains "' + result.needle + '".' : 'Type after the ? to search file contents.')
        : 'No file or folder name contains "' + result.needle + '".';
      state.activeId = null;
      statusEl.textContent = '0 results';
      return;
    }

    emptyEl.classList.add('hidden');
    treeEl.classList.remove('hidden');

    if (!result.rows.some(function(r){ return r.node.id === state.activeId; })){
      state.activeId = result.rows.length ? result.rows[0].node.id : null;
    }

    var focusWasInside = document.activeElement && root.contains(document.activeElement) && document.activeElement !== input;

    treeEl.innerHTML = result.rows.map(function(r){ return rowHtml(r, result); }).join('');

    if (focusWasInside){
      var focusEl = findRowEl(state.activeId);
      if (focusEl) focusEl.focus();
    }
    var activeEl = findRowEl(state.activeId);
    if (activeEl && activeEl.scrollIntoView) activeEl.scrollIntoView({ block: 'nearest' });

    statusEl.textContent = result.filtering
      ? (result.rows.length + ' result' + (result.rows.length === 1 ? '' : 's') + (result.contentMode ? ' in file contents' : ' by name'))
      : (state.openedId && byId[state.openedId] ? 'Opened ' + byId[state.openedId].name : totalCounts.files + ' files in ' + totalCounts.folders + ' folders');
  }

  function toggleExpand(id){
    var r = null;
    for (var i = 0; i < lastRows.length; i++){ if (lastRows[i].node.id === id){ r = lastRows[i]; break; } }
    var currentlyOpen = r ? r.open : !!state.expanded[id];
    state.expanded[id] = !currentlyOpen;
  }

  function openNode(id){ state.openedId = id; }

  input.addEventListener('input', function(){ state.query = input.value; render(); });
  input.addEventListener('keydown', function(e){
    if (e.key === 'ArrowDown' && lastRows.length){
      e.preventDefault();
      state.activeId = lastRows[0].node.id;
      render();
      var el = findRowEl(state.activeId);
      if (el) el.focus();
    }
  });

  treeEl.addEventListener('click', function(e){
    var row = e.target.closest ? e.target.closest('.tf-row') : null;
    if (!row) return;
    var id = row.getAttribute('data-id');
    var n = byId[id];
    if (!n) return;
    state.activeId = id;
    if (n.type === 'folder') toggleExpand(id); else openNode(id);
    render();
    var el = findRowEl(id);
    if (el) el.focus();
  });

  treeEl.addEventListener('keydown', function(e){
    var row = e.target.closest ? e.target.closest('.tf-row') : null;
    if (!row) return;
    var id = row.getAttribute('data-id');
    var idx = -1;
    for (var i = 0; i < lastRows.length; i++){ if (lastRows[i].node.id === id){ idx = i; break; } }
    if (idx === -1) return;
    var r = lastRows[idx];

    if (e.key === 'ArrowDown'){
      if (idx < lastRows.length - 1){ e.preventDefault(); state.activeId = lastRows[idx + 1].node.id; render(); }
    } else if (e.key === 'ArrowUp'){
      if (idx > 0){ e.preventDefault(); state.activeId = lastRows[idx - 1].node.id; render(); }
      else { e.preventDefault(); input.focus(); }
    } else if (e.key === 'ArrowRight'){
      e.preventDefault();
      if (r.hasKids){
        if (!r.open){ state.expanded[r.node.id] = true; render(); }
        else if (idx < lastRows.length - 1 && lastRows[idx + 1].depth === r.depth + 1){ state.activeId = lastRows[idx + 1].node.id; render(); }
      }
    } else if (e.key === 'ArrowLeft'){
      e.preventDefault();
      if (r.hasKids && r.open){ state.expanded[r.node.id] = false; render(); }
      else if (r.depth > 0){
        for (var j = idx - 1; j >= 0; j--){ if (lastRows[j].depth === r.depth - 1){ state.activeId = lastRows[j].node.id; break; } }
        render();
      }
    } else if (e.key === 'Enter'){
      e.preventDefault();
      openNode(id);
      render();
    }
  });

  if (clearBtn) clearBtn.addEventListener('click', function(){ input.value = ''; state.query = ''; input.focus(); render(); });

  render();
})();
</script>
</template>

<template class="pattern" data-title="Selection Bar" data-category="Components" data-source="Journal v8.1 (index.html, edSelToolbar* functions)" data-note="Floating action bar on text selection, Notion-style. Highlight text and a small bar appears above it with contextual actions, here Maps (Google Maps directions to the selected text, origin left blank so Maps fills the user's location) and Copy. Key implementation rules: the bar's own mousedown must preventDefault or the click collapses the selection first, defer the show until after mouseup with setTimeout 0 (never requestAnimationFrame, it starves in hidden documents), and hide on Escape, click-away, scroll and page switch. Desktop pointer only, gate with matchMedia hover and pointer fine so it never fights the native touch callout.">
<style>
.selbar-demo{
  position:relative;
  border:1px solid var(--border2);
  border-radius:var(--radius);
  background:var(--bg3);
  padding:16px;
}
.selbar-caption{
  font-size:11px;
  color:var(--text3);
  text-transform:uppercase;
  letter-spacing:.4px;
  margin-bottom:8px;
}
.selbar-text{
  font-size:13px;
  line-height:1.6;
  color:var(--text);
}
.selbar-bar{
  position:absolute;
  display:none;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:6px;
  box-shadow:var(--shadow-2);
  z-index:1000;
  gap:2px;
}
.selbar-bar.show{
  display:flex;
}
.selbar-btn{
  padding:6px 10px;
  border-radius:var(--radius);
  border:1px solid var(--border2);
  background:var(--bg3);
  color:var(--text);
  cursor:pointer;
  font-size:12px;
  font-weight:500;
  font-family:inherit;
  transition:background var(--dur) ease-out,border-color var(--dur) ease-out;
  white-space:nowrap;
}
.selbar-btn:hover{
  background:var(--bg4);
  border-color:var(--border);
}
.selbar-btn:active{
  transform:scale(.95);
}
</style>
<div class="selbar-demo">
  <div class="selbar-caption">Highlight some text below</div>
  <p class="selbar-text">Try selecting text in this paragraph. When you highlight something, a small floating bar will appear with options to open the location in Google Maps or copy the text. This works great for place names like Marina Bay Sands Singapore, addresses, or any searchable text.</p>
  <div class="selbar-bar">
    <button class="selbar-btn selbar-maps">Maps</button>
    <button class="selbar-btn selbar-copy">Copy</button>
  </div>
</div>
<script>
(function(){
  const root = document.currentScript.parentElement.querySelector('.selbar-demo');
  if (!root) return;

  const bar = root.querySelector('.selbar-bar');
  const mapsBtn = root.querySelector('.selbar-maps');
  const copyBtn = root.querySelector('.selbar-copy');

  const state = { active: false };

  function show() {
    const sel = window.getSelection();
    if (!sel.rangeCount || sel.toString().length === 0) {
      hide();
      return;
    }

    const range = sel.getRangeAt(0);
    if (!root.contains(range.commonAncestorContainer)) {
      hide();
      return;
    }

    const rect = range.getBoundingClientRect();
    const rootRect = root.getBoundingClientRect();

    const top = rect.top - rootRect.top - bar.offsetHeight - 8;
    const left = Math.max(0, Math.min(rect.left - rootRect.left + rect.width / 2 - bar.offsetWidth / 2, root.offsetWidth - bar.offsetWidth));

    bar.style.top = top + 'px';
    bar.style.left = left + 'px';

    bar.classList.add('show');
    state.active = true;
  }

  function hide() {
    bar.classList.remove('show');
    state.active = false;
  }

  function handleMouseUp(e) {
    if (!root.isConnected) {
      removeListeners();
      return;
    }
    setTimeout(show, 0);
  }

  function handleMouseDown(e) {
    if (!root.isConnected) {
      removeListeners();
      return;
    }
    if (e.target === mapsBtn || e.target === copyBtn || bar.contains(e.target)) {
      e.preventDefault();
      return;
    }
    hide();
  }

  function handleKeyDown(e) {
    if (!root.isConnected) {
      removeListeners();
      return;
    }
    if (e.key === 'Escape') {
      hide();
    }
  }

  function removeListeners() {
    document.removeEventListener('mouseup', handleMouseUp);
    document.removeEventListener('mousedown', handleMouseDown);
    document.removeEventListener('keydown', handleKeyDown);
  }

  mapsBtn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    const q = String(window.getSelection()).replace(/\s+/g, ' ').trim().slice(0, 200);
    if (q) {
      window.open('https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(q), '_blank', 'noopener');
    }
  });

  copyBtn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    const text = String(window.getSelection());
    if (text) {
      navigator.clipboard.writeText(text).catch(function() {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
      });
    }
  });

  bar.addEventListener('mousedown', function(e) {
    e.preventDefault();
  });

  document.addEventListener('mouseup', handleMouseUp);
  document.addEventListener('mousedown', handleMouseDown);
  document.addEventListener('keydown', handleKeyDown);
})();
</script>
</template>

<div class="vix-root">
  <div class="vix-top">
    <div>
      <p class="vix-eyebrow">Portable data flow</p>
      <h3 class="vix-title">Validate before anything changes</h3>
      <p class="vix-copy">Review every row first. Export always creates a new file.</p>
    </div>
    <label>
      <span class="vix-caption">Demo state</span>
      <select class="vix-fixture" aria-label="Choose import demo state">
        <option value="normal">Normal</option>
        <option value="empty">Empty</option>
        <option value="many">Many rows</option>
        <option value="long">Long text</option>
        <option value="error">File error</option>
      </select>
    </label>
  </div>
  <div class="vix-grid">
    <section class="vix-panel" aria-label="File selection and validation preview">
      <p class="vix-caption">1. Select and validate</p>
      <div class="vix-pick">
        <input class="vix-file" type="file" accept=".csv,.json" tabindex="-1">
        <div class="vix-file-copy">
          <span class="vix-file-name"></span>
          <span class="vix-file-hint">CSV or JSON, demo does not read or upload the file</span>
        </div>
        <button class="vix-btn vix-choose" type="button">Choose file</button>
      </div>
      <div class="vix-stats" aria-label="Validation counts">
        <div class="vix-stat"><span class="vix-stat-label"><span class="vix-stat-mark" data-kind="accepted" aria-hidden="true">&#10003;</span>Accepted</span><strong class="vix-accepted">0</strong></div>
        <div class="vix-stat"><span class="vix-stat-label"><span class="vix-stat-mark" data-kind="rejected" aria-hidden="true">!</span>Rejected</span><strong class="vix-rejected">0</strong></div>
      </div>
      <div class="vix-progress-wrap">
        <div class="vix-progress-head"><span class="vix-progress-label">Waiting for a file</span><span class="vix-progress-value">0%</span></div>
        <div class="vix-progress" role="progressbar" aria-label="Validation progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="vix-progress-bar"></div></div>
      </div>

        <table class="vix-table">

<script>
(function(){
  var script=document.currentScript;
  var root=script&&script.parentElement;
  if(!root)return;
  var app=root.querySelector('.vix-root');
  if(!app||app.dataset.ready==='true')return;
  app.dataset.ready='true';
  var fixture=app.querySelector('.vix-fixture');
  var input=app.querySelector('.vix-file');
  var choose=app.querySelector('.vix-choose');
  var exportBtn=app.querySelector('.vix-export');
  var rowsEl=app.querySelector('.vix-rows');
  var empty=app.querySelector('.vix-empty');
  var error=app.querySelector('.vix-error');
  var errorCopy=app.querySelector('.vix-error-copy');
  var accepted=app.querySelector('.vix-accepted');
  var rejected=app.querySelector('.vix-rejected');
  var fileName=app.querySelector('.vix-file-name');
  var progress=app.querySelector('.vix-progress');
  var progressBar=app.querySelector('.vix-progress-bar');
  var progressLabel=app.querySelector('.vix-progress-label');
  var progressValue=app.querySelector('.vix-progress-value');
  var status=app.querySelector('.vix-status');
  var DATA={
    normal:{file:'workspace-contacts.csv',progress:100,accepted:3,rejected:1,rows:[
      ['Avery Tan','accepted','Ready'],['Morgan Lee','accepted','Ready'],['Riley Chen','rejected','Email is missing'],['Sam Idris','accepted','Ready']
    ]},
    empty:{file:'empty-export.csv',progress:100,accepted:0,rejected:0,rows:[]},
    many:{file:'team-directory-24-rows.csv',progress:68,accepted:19,rejected:5,rows:[
      ['Avery Tan','accepted','Ready'],['Morgan Lee','accepted','Ready'],['Riley Chen','rejected','Email is missing'],['Sam Idris','accepted','Ready'],['Jordan Lim','rejected','Duplicate reference'],['Taylor Noor','accepted','Ready'],['Casey Ong','accepted','Ready'],['Robin Koh','rejected','Invalid date format']
    ]},
    long:{file:'quarterly-contact-directory-for-regional-partner-review-and-safe-transfer.csv',progress:100,accepted:2,rejected:1,rows:[
      ['Alexandria-Josephine Montgomery-Watanabe','accepted','Ready'],['Operations liaison for the regional partnership and continuity programme','rejected','Required reference exceeds the configured limit'],['Kai Ramanathan','accepted','Ready']
    ]},
    error:{file:'unreadable-archive.json',progress:24,accepted:0,rejected:0,rows:[],error:'The demo file ends before its JSON object closes. Nothing was imported or changed.'}
  };
  function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(char){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];});}
  function render(){
    var data=DATA[fixture.value]||DATA.normal;
    fileName.textContent=data.file;
    fileName.title=data.file;
    accepted.textContent=String(data.accepted);
    rejected.textContent=String(data.rejected);
    progress.setAttribute('aria-valuenow',String(data.progress));
    progressBar.style.width=data.progress+'%';
    progressValue.textContent=data.progress+'%';
    progressLabel.textContent=data.progress===100?'Validation complete':(data.progress===0?'Waiting for a file':'Validating safely');
    error.dataset.show=data.error?'true':'false';
    errorCopy.textContent=data.error||'';
    rowsEl.innerHTML=data.rows.map(function(row){
      var mark=row[1]==='accepted'?'&#10003;':'!';
      return '<tr><td><span class="vix-cell-main" title="'+esc(row[0])+'">'+esc(row[0])+'</span><span class="vix-cell-sub">Synthetic record</span></td><td><span class="vix-pill" data-state="'+row[1]+'"><span aria-hidden="true">'+mark+'</span>'+esc(row[1])+'</span></td><td>'+esc(row[2])+'</td></tr>';
    }).join('');
    empty.dataset.show=data.rows.length?'false':'true';
    exportBtn.disabled=data.accepted===0||!!data.error;
    status.textContent=data.error?'Resolve the file error before exporting.':(data.accepted?data.accepted+' accepted row'+(data.accepted===1?' is':'s are')+' ready for a new export.':'Nothing is ready to export.');
  }
  fixture.addEventListener('change',render);
  choose.addEventListener('click',function(){input.click();});
  input.addEventListener('change',function(){
    if(!input.files||!input.files.length)return;
    fileName.textContent=input.files[0].name;
    fileName.title=input.files[0].name;
    status.textContent='Selected locally for this preview. The demo did not read or upload it.';
  });
  exportBtn.addEventListener('click',function(){
    var count=(DATA[fixture.value]||DATA.normal).accepted;
    progress.setAttribute('aria-valuenow','100');
    progressBar.style.width='100%';
    progressValue.textContent='100%';
    progressLabel.textContent='New export prepared';
    status.textContent='Prepared a separate synthetic export with '+count+' accepted row'+(count===1?'':'s')+'. No existing file was changed.';
  });
  render();
})();
</script>
</template>

    {id:'home',name:'Home',parent:null,folder:true},{id:'projects',name:'Projects',parent:null,folder:true},{id:'launch',name:'Launch plan',parent:'projects',folder:false},{id:'research',name:'Research',parent:'projects',folder:true},{id:'interviews',name:'Interview notes',parent:'research',folder:false},{id:'archive',name:'Archive',parent:null,folder:true},{id:'decisions',name:'Decision log',parent:null,folder:false}
  ];
  var MANY=[
    {id:'roadmap',name:'Roadmap',parent:'projects',folder:false},{id:'weekly',name:'Weekly reviews',parent:'projects',folder:true},{id:'w1',name:'Week one',parent:'weekly',folder:false},{id:'w2',name:'Week two',parent:'weekly',folder:false},{id:'assets',name:'Assets',parent:null,folder:true},{id:'copy',name:'Copy drafts',parent:'assets',folder:false},{id:'visuals',name:'Visual notes',parent:'assets',folder:false},{id:'handoff',name:'Handoff checklist',parent:null,folder:false}
  ];
  var selected='launch',nodes=[],parents={},expanded={projects:true,research:true,archive:false};
  function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(char){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];});}
  function load(){
    nodes=fixture.value==='empty'?[]:CORE.map(function(node){return Object.assign({},node);});
    if(fixture.value==='many')nodes=nodes.concat(MANY.map(function(node){return Object.assign({},node);}));
    if(fixture.value==='long')nodes=nodes.map(function(node){return node.id==='launch'?Object.assign({},node,{name:'Regional partnership launch plan with dependency review and continuity handover notes'}):node;});
    parents={};nodes.forEach(function(node){parents[node.id]=node.parent;});
    selected=nodes.some(function(node){return node.id==='launch';})?'launch':(nodes[0]?nodes[0].id:'');

  }
  function byId(id){for(var i=0;i<nodes.length;i++)if(nodes[i].id===id)return nodes[i];return null;}
  function childrenOf(id){return nodes.filter(function(node){return parents[node.id]===id;});}

    function walk(parent,depth){childrenOf(parent).forEach(function(node){if(term&&!keep[node.id])return;rows.push({node:node,depth:depth});if(node.folder&&expanded[node.id])walk(node.id,depth+1);});}

  }
  function updateTargets(){

    tree.innerHTML=rows.map(function(row){var node=row.node;var hasChildren=childrenOf(node.id).length>0;var toggle=node.folder?'<button type="button" class="ptm-toggle" data-toggle="'+esc(node.id)+'" data-open="'+(expanded[node.id]?'true':'false')+'" aria-expanded="'+(expanded[node.id]?'true':'false')+'" aria-label="'+(expanded[node.id]?'Collapse ':'Expand ')+esc(node.name)+'"><span class="ptm-chevron" aria-hidden="true">&#8250;</span></button>':'<span class="ptm-toggle-spacer" aria-hidden="true"></span>';return '<div class="ptm-row" role="treeitem" aria-level="'+(row.depth+1)+'"'+(node.folder&&hasChildren?' aria-expanded="'+(expanded[node.id]?'true':'false')+'"':'')+' style="padding-left:'+(row.depth*16)+'px">'+toggle+'<button type="button" class="ptm-page" data-page="'+esc(node.id)+'" aria-pressed="'+(node.id===selected?'true':'false')+'" title="'+esc(node.name)+'"><span class="ptm-page-icon" aria-hidden="true">'+(node.folder?'&#9638;':'&#9649;')+'</span><span class="ptm-page-name">'+esc(node.name)+'</span></button></div>';}).join('');
    empty.dataset.show=rows.length?'false':'true';
    emptyCopy.textContent=fixture.value==='empty'?'This synthetic workspace has no pages yet. Choose another demo state to continue.':'No page matches "'+search.value.trim()+'".';
    clear.hidden=fixture.value==='empty';
    count.textContent=nodes.length+' page'+(nodes.length===1?'':'s');
    var active=byId(selected);

    updateTargets();

  }
  tree.addEventListener('click',function(event){
    var toggle=event.target.closest('.ptm-toggle');
    if(toggle){expanded[toggle.dataset.toggle]=!expanded[toggle.dataset.toggle];render();return;}

  load();render();
})();
</script>

      <span class="hrc-chip-label">Demo workspace folder with an extremely long name that cannot fit</span>
      <svg class="hrc-ico hrc-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>

<script>
(function(){
  // The mode switch is the only scripted part. No timers, observers or document
  // listeners, so there is nothing to tear down when the card leaves the DOM.
  // Colour comes from CSS variables only, so the theme toggle recolours it live.
  var script = document.currentScript;
  var wrap = script && script.previousElementSibling;
  if (!wrap || !wrap.classList.contains('hrc-wrap')){
    wrap = script && script.parentElement ? script.parentElement.querySelector('.hrc-wrap') : null;
  }
  if (!wrap || wrap.getAttribute('data-hrc-ready')) return;
  var input = wrap.querySelector('.hrc-input');
  var segs = wrap.querySelectorAll('.hrc-seg');
  if (!input || !segs.length) return;
  wrap.setAttribute('data-hrc-ready', '1');

  Array.prototype.forEach.call(segs, function(seg){
    seg.addEventListener('click', function(){
      if (!wrap.isConnected) return;
      Array.prototype.forEach.call(segs, function(other){
        other.setAttribute('aria-pressed', other === seg ? 'true' : 'false');
      });
      // Only the hint changes. Whatever the person has typed stays in the box.
      input.setAttribute('placeholder', seg.getAttribute('data-placeholder') || '');
    });
  });
})();
</script>

<template class="pattern" data-title="Session Card" data-category="Components" data-source="Odysseus Home v1.0.50, static/home.css and static/js/home.js" data-note="Clickable summary card for a recent session or chat, built as a real button so Enter and Space work with no script. A title and a one-line preview each cut with an ellipsis (the full text sits in the title attribute), then a meta row. The Needs approval pill is words on a tinted amber fill with a matching edge, so it never relies on colour alone, and it only appears when something is waiting. Meta reads mode then age, for example Agent, 2m ago. The demo shows a card with the pill and a long title and preview, a card without it, and a loading skeleton card that keeps the real card's height and stops pulsing under reduced motion. Pair a list of these with the Designed Empty State pattern when there are no sessions.">
<style>
/* Session Card, class prefix ssn-. Tokens only. Cards are already taller than 44px, so no touch override is needed. */
.ssn-list{width:100%;max-width:640px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px;text-align:left}
.ssn-card{box-sizing:border-box;display:flex;flex-direction:column;gap:8px;width:100%;min-width:0;margin:0;padding:14px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg2);color:var(--text);font:inherit;text-align:left;cursor:pointer;transition:background var(--dur) ease-out,border-color var(--dur) ease-out}
/* Hover lifts to bg3, not bg4, so the text3 meta line keeps 4.5:1 on the hover fill in both themes. */
.ssn-card:hover{background:var(--bg3);border-color:var(--border2);box-shadow:var(--shadow-1)}
.ssn-card:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.ssn-title{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:600;line-height:1.35}
.ssn-preview{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;line-height:1.45;color:var(--text2)}
.ssn-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;min-width:0;min-height:24px;margin-top:2px}
.ssn-pill{padding:2px 8px;border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);border-radius:var(--radius-lg);background:var(--amber-soft);color:var(--amber);font-size:12px;font-weight:600;white-space:nowrap}
.ssn-meta{min-width:0;font-size:12px;color:var(--text3);overflow-wrap:anywhere}
/* Loading skeleton. Same box as a real card so nothing jumps when the data lands. */
.ssn-card-skel{position:relative;gap:10px;min-height:110px;cursor:default;pointer-events:none}
.ssn-skel{display:block;height:12px;border-radius:var(--radius);background:var(--border2);animation:ssn-pulse calc(var(--dur) * 8) ease-in-out infinite}
.ssn-skel-title{width:55%;height:14px}
.ssn-skel-line{width:90%}

@keyframes ssn-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.ssn-skel{animation:none}}
</style>

<div id="toasts" aria-live="polite"></div>

<script>
/* ============================================================================
   GALLERY, reads every <template class="pattern"> in the document and renders
   one card per template. No fetch(): everything lives inline so this file
   works opened straight from file://.
   ========================================================================== */
let _filter = 'All';
const CATEGORIES = ['All', 'Components', 'Flows', 'Systems', 'Utilities'];

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function patterns(){
  return [...document.querySelectorAll('template.pattern')];
}

function renderFilters(){
  const el = document.getElementById('filters');
  el.innerHTML = CATEGORIES.map(c =>
    `<button class="chip ${c===_filter?'active':''}" role="tab" aria-selected="${c===_filter}" onclick="setFilter('${c}')">${c}</button>`
  ).join('');
}
function setFilter(c){ _filter = c; render(); }

function render(){
  renderFilters();
  const grid = document.getElementById('grid');
  const all = patterns();
  const visible = _filter === 'All' ? all : all.filter(t => t.dataset.category === _filter);

  if (visible.length === 0){
    const scope = all.length === 0 ? 'library' : 'category';
    grid.innerHTML = `
      <div class="state">
        <svg class="state-scene" viewBox="0 0 120 90" width="100" aria-hidden="true"><circle class="ss-a" cx="30" cy="60" r="22"/><rect class="ss-b" x="55" y="18" width="46" height="46" rx="14"/><circle class="ss-c" cx="94" cy="66" r="10"/></svg>
        <h3>${scope === 'library' ? 'No patterns yet' : 'No patterns in ' + esc(_filter)}</h3>
        <p>${scope === 'library' ? 'Paste inspected code from a site you admire and re-implement it clean on house tokens, then append a new pattern template (see CLAUDE.md).' : 'Nothing filed under this category yet. Try another filter or add one.'}</p>
      </div>`;
    return;
  }

  grid.innerHTML = '';
  visible.forEach((tpl, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    const cat = tpl.dataset.category || 'Components';
    card.innerHTML = `
      <div class="card-demo" id="demo-${i}"></div>
      <div class="card-body">
        <div class="card-title-row">
          <div class="card-title">${esc(tpl.dataset.title || 'Untitled pattern')}</div>
          <span class="category-chip ${cat.toLowerCase()}">${esc(cat)}</span>
        </div>
        <div class="card-note">${esc(tpl.dataset.note || '')}</div>
        <div class="card-foot">
          <span class="card-source" title="${esc(tpl.dataset.source || '')}">Source: ${esc(tpl.dataset.source || 'unknown')}</span>
          <button class="btn" onclick="copyPattern(this, ${JSON.stringify(i)})">Copy code</button>
        </div>
      </div>`;
    grid.appendChild(card);
    // Clone the template's live content into the demo area, scoped by the
    // template's own inline <style>, so each card renders a working preview.
    insertLiveContent(card.querySelector(`#demo-${i}`), tpl.content.cloneNode(true));
  });
}

// A cloned <script> keeps its "already started" flag, so appending a clone
// as-is leaves the script inert (it never runs). Extract the scripts first,
// append everything else (so the container is connected to the document),
// then create and append FRESH <script> elements onto that connected
// container: an inline script created and appended via the DOM API (not
// via innerHTML) executes synchronously on insertion. See CLAUDE.md.
function insertLiveContent(container, fragment){
  const scripts = [...fragment.querySelectorAll('script')];
  scripts.forEach(s => s.remove());
  container.appendChild(fragment);
  scripts.forEach(old => {
    const fresh = document.createElement('script');
    for (const attr of old.attributes) fresh.setAttribute(attr.name, attr.value);
    fresh.textContent = old.textContent;
    container.appendChild(fresh);
  });
}

function copyPattern(btn, idx){
  const visible = _filter === 'All' ? patterns() : patterns().filter(t => t.dataset.category === _filter);
  const tpl = visible[idx];
  if (!tpl) return;
  const code = tpl.innerHTML.trim();
  const done = () => {
    const original = btn.textContent;
    btn.textContent = 'Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done).catch(() => fallbackCopy(code, done));
  } else {
    fallbackCopy(code, done);
  }
}
// Clipboard API needs a secure context; file:// and some older browsers do
// not have one, so fall back to a hidden textarea + execCommand.
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); done(); }
  catch(e){ toast('Could not copy, select and copy manually', true); }
  document.body.removeChild(ta);
}

function toast(msg, isErr){
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:'+(isErr?'var(--red-soft)':'var(--bg4)')+';color:'+(isErr?'var(--red)':'var(--text)')+';border:1px solid '+(isErr?'var(--red)':'var(--border2)')+';padding:10px 16px;border-radius:var(--radius);font-size:13px;box-shadow:var(--shadow-2);z-index:300';
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

/* ============================================================================
   THEME, default to system preference, then remember the user's choice.
   ========================================================================== */
function applyTheme(t){
  document.documentElement.classList.toggle('light', t === 'light');
  document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'light' ? '#f5f4f9' : '#0f0f17');
}
function toggleTheme(){
  const next = document.documentElement.classList.contains('light') ? 'dark' : 'light';
  localStorage.setItem('kjr_pattern_library_theme', next);
  applyTheme(next);
}
(function initTheme(){
  const saved = localStorage.getItem('kjr_pattern_library_theme');
  applyTheme(saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
})();

render();
</script>
