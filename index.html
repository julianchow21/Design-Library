<div class="trs-wrap">
  <div class="trs-tabs" role="tablist" aria-label="Trash flow demo view">
    <button type="button" class="trs-tab trs-active" data-trs-view="live">Active</button>
    <button type="button" class="trs-tab" data-trs-view="trash">Trash</button>
  </div>
  <div class="trs-panel" data-trs-panel="live">
    <div class="trs-list trs-live-list"></div>
  </div>
  <div class="trs-panel trs-hide" data-trs-panel="trash">
    <div class="trs-head">
      <span class="trs-stats"></span>
      <button type="button" class="trs-btn trs-danger trs-emptybtn">Empty trash</button>
    </div>
    <div class="trs-list trs-trash-list"></div>
  </div>
  <div class="trs-toast-stack"></div>
</div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var wrap = root.querySelector('.trs-wrap');
  var tabs = root.querySelectorAll('[data-trs-view]');
  var livePanel = root.querySelector('[data-trs-panel="live"]');
  var trashPanel = root.querySelector('[data-trs-panel="trash"]');
  var liveList = root.querySelector('.trs-live-list');
  var trashList = root.querySelector('.trs-trash-list');
  var statsEl = root.querySelector('.trs-stats');
  var headEl = root.querySelector('.trs-head');
  var toasts = root.querySelector('.trs-toast-stack');
  if (!wrap || !liveList || !trashList || !statsEl || !headEl || !toasts) return;

  var DAY_MS = 86400000;
  var seq = 0;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Invented generic demo data, no Collectibles fields. One deliberately
  // long title exercises the truncate-with-title-tooltip handling below.
  var items = [
    { id: ++seq, name: 'Q3 Budget Report' },
    { id: ++seq, name: 'Client Onboarding Checklist' },
    { id: ++seq, name: 'Team Offsite Notes' },
    { id: ++seq, name: 'Product Roadmap Draft' },
    { id: ++seq, name: 'Meeting Minutes, 12 Jul' },
    { id: ++seq, name: 'Expense Claim, Marketing Conference Travel, Accommodation and Client Dinner Receipts Bundle' },
    { id: ++seq, name: 'Vendor Contract Draft' },
    { id: ++seq, name: 'Onboarding Survey Results' }
  ];
  // Seeded with one already-aged trash entry so the 30-day countdown has
  // something other than "just now" to show without waiting a real month.
  var trash = [
    { id: ++seq, name: 'Draft Press Release', deletedAt: Date.now() - 22 * DAY_MS }
  ];
  var confirmingEmpty = false;
  var view = 'live';

  function daysAgo(ts){
    var days = Math.floor((Date.now() - ts) / DAY_MS);
    if (days <= 0) return 'Today';
    if (days === 1) return 'Yesterday';
    return days + 'd ago';
  }
  function daysLeft(ts){ return Math.max(0, 30 - Math.floor((Date.now() - ts) / DAY_MS)); }

  function fireToast(msg){
    if (!toasts.isConnected) return;
    var el = document.createElement('div');
    el.className = 'trs-toast';
    el.textContent = msg;
    toasts.appendChild(el);
    setTimeout(function(){ if (el.isConnected) el.remove(); }, 2200);
  }

  function render(){
    if (!wrap.isConnected) return;

    tabs.forEach(function(t){ t.classList.toggle('trs-active', t.getAttribute('data-trs-view') === view); });
    livePanel.classList.toggle('trs-hide', view !== 'live');
    trashPanel.classList.toggle('trs-hide', view !== 'trash');

    // ── Active list ──
    if (!items.length){
      liveList.innerHTML = '<div class="trs-empty"><strong>All caught up</strong>Every item has been moved to trash.</div>';
    } else {
      liveList.innerHTML = items.map(function(it){
        return '<div class="trs-row"><span class="trs-name" title="' + esc(it.name) + '">' + esc(it.name) + '</span>' +
          '<button type="button" class="trs-btn trs-del-btn" data-id="' + it.id + '">Delete</button></div>';
      }).join('');
    }

    // ── Trash list + head ──
    statsEl.textContent = trash.length
      ? trash.length + ' deleted item' + (trash.length === 1 ? '' : 's') + ', auto-purged after 30 days'
      : '';
    var emptyBtn = headEl.querySelector('.trs-emptybtn');
    if (emptyBtn) emptyBtn.disabled = trash.length === 0;

    if (!trash.length){
      trashList.innerHTML = '<div class="trs-empty"><strong>Trash is empty</strong>Deleted items appear here for 30 days before being permanently removed.</div>';
    } else {
      trashList.innerHTML = trash.map(function(e){
        return '<div class="trs-row"><span class="trs-name" title="' + esc(e.name) + '">' + esc(e.name) + '</span>' +
          '<span class="trs-meta">' + daysAgo(e.deletedAt) + '<br>' + daysLeft(e.deletedAt) + 'd left</span>' +
          '<button type="button" class="trs-btn trs-restore-btn" data-id="' + e.id + '">Restore</button></div>';
      }).join('');
    }

    // Confirm strip replaces the Empty trash button in place, never a
    // silent bulk wipe.
    var existingConfirm = root.querySelector('.trs-confirm');
    if (existingConfirm) existingConfirm.remove();
    if (confirmingEmpty && trash.length){
      if (emptyBtn) emptyBtn.classList.add('trs-hide');
      var strip = document.createElement('div');
      strip.className = 'trs-confirm';
      strip.innerHTML = '<span>Permanently delete ' + trash.length + ' item' + (trash.length === 1 ? '' : 's') + '? This cannot be undone.</span>' +
        '<span class="trs-confirm-actions">' +
        '<button type="button" class="trs-btn trs-danger trs-confirm-yes">Delete forever</button>' +
        '<button type="button" class="trs-btn trs-confirm-no">Cancel</button></span>';
      headEl.appendChild(strip);
    } else if (emptyBtn){
      emptyBtn.classList.remove('trs-hide');
    }
  }

  function softDelete(id){
    var idx = items.findIndex(function(it){ return it.id === id; });
    if (idx < 0) return;
    // Snapshot BEFORE the destructive removal: the full row is captured into
    // the trash store first, the active-list mutation happens only after
    // that copy safely exists.
    var copy = JSON.parse(JSON.stringify(items[idx]));
    copy.deletedAt = Date.now();
    trash.unshift(copy);
    items.splice(idx, 1);
    render();
    fireToast('Moved to trash');
  }

  function restore(id){
    var idx = trash.findIndex(function(e){ return e.id === id; });
    if (idx < 0) return;
    var entry = trash[idx];
    items.push({ id: entry.id, name: entry.name }); // appended, matches source's restore-to-end behaviour
    trash.splice(idx, 1);
    render();
    fireToast('Restored');
  }

  function emptyTrash(){
    trash = [];
    confirmingEmpty = false;
    render();
    fireToast('Trash emptied');
  }

  tabs.forEach(function(t){
    t.addEventListener('click', function(){ view = t.getAttribute('data-trs-view'); confirmingEmpty = false; render(); });
  });

  liveList.addEventListener('click', function(e){
    var btn = e.target.closest('.trs-del-btn');
    if (!btn) return;
    softDelete(Number(btn.getAttribute('data-id')));
  });
  trashList.addEventListener('click', function(e){
    var btn = e.target.closest('.trs-restore-btn');
    if (!btn) return;
    restore(Number(btn.getAttribute('data-id')));
  });
  headEl.addEventListener('click', function(e){
    if (e.target.closest('.trs-emptybtn')){
      if (!trash.length) return;
      confirmingEmpty = true;
      render();
      return;
    }
    if (e.target.closest('.trs-confirm-yes')){ emptyTrash(); return; }
    if (e.target.closest('.trs-confirm-no')){ confirmingEmpty = false; render(); return; }
  });

  render();
})();
</script>
</template>


<template class="pattern" data-title="Version History" data-category="Systems" data-source="Kujira Collectibles v3.31 (app.js, lines 2817-3152: saveVersion/restoreVersion, daily auto-snapshot, cloud prune)" data-note="Named or auto-daily snapshots of the whole record store, restorable at any point. Every restore snapshots the CURRENT state as a backup first, before applying the older one, so restoring itself can never be a silent loss. Manual saves and the daily auto-snapshot both prune the oldest entry once the list passes its cap. Full architecture, the storage-agnostic seam and verification gotchas are in Version History.md in this folder. This card is a self-contained in-memory demo, no real backend.">

<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var wrap = root.querySelector('.ver-wrap');
  if (!wrap) return;
  var titleInput   = root.querySelector('.ver-title-input');
  var itemsCountEl = root.querySelector('.ver-items-count');
  var notesCountEl = root.querySelector('.ver-notes-count');
  var nameInput    = root.querySelector('.ver-name-input');
  var hintEl       = root.querySelector('.ver-hint');
  var listEl       = root.querySelector('.ver-list');
  var capEl        = root.querySelector('.ver-cap');
  var addItemBtn   = root.querySelector('[data-act="add-item"]');
  var addNoteBtn   = root.querySelector('[data-act="add-note"]');
  var simDayBtn    = root.querySelector('[data-act="sim-day"]');
  var saveBtn      = root.querySelector('[data-act="save"]');
  if (!titleInput || !itemsCountEl || !notesCountEl || !nameInput || !hintEl || !listEl || !capEl || !addItemBtn || !addNoteBtn || !simDayBtn || !saveBtn) return;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  var CAP = 8; // prune oldest beyond this once either save path pushes past it
  var NOW = Date.now();
  var DAY = 24*60*60*1000;
  var seq = 0;
  function nextId(){ seq += 1; return 'demo_' + seq; }
  function dateStr(ms){ return new Date(ms).toISOString().slice(0,10); } // YYYY-MM-DD, also the auto-snapshot de-dupe key

  // The "document" this demo can save/restore. A real app's snapshot would
  // be its whole store; this is a generic stand-in with the same shape
  // (a title plus a couple of counters that visibly drift as you edit).
  var current = { title: 'Q3 roadmap', items: 6, notes: 9 };

  // Seeded history, newest first, a plausible run of earlier saves. One
  // deliberately long name shows the row wraps rather than overflowing or
  // pushing its Restore/Delete buttons off the card.
  var versions = [
    { id: nextId(), name: 'Pre-launch backup before the big catalogue rework and pricing cleanup attempt that never quite finished', ts: NOW - 3*60*60*1000,        auto:false, data:{ title:'Q3 roadmap',       items:6, notes:8 } },
    { id: nextId(), name: 'Auto · ' + dateStr(NOW - 2*DAY),                                                                        ts: NOW - 2*DAY - 3*60*60*1000, auto:true,  data:{ title:'Q3 roadmap draft', items:5, notes:7 } },
    { id: nextId(), name: 'Before bulk tag rename',                                                                                     ts: NOW - 2*DAY - 6*60*60*1000, auto:false, data:{ title:'Q3 roadmap draft', items:5, notes:6 } },
    { id: nextId(), name: 'Auto · ' + dateStr(NOW - 3*DAY),                                                                        ts: NOW - 3*DAY,                auto:true,  data:{ title:'Q3 draft',         items:4, notes:5 } },
    { id: nextId(), name: 'First working draft',                                                                                        ts: NOW - 4*DAY,                auto:false, data:{ title:'Q3 draft',         items:2, notes:2 } },
    { id: nextId(), name: 'Auto · ' + dateStr(NOW - 5*DAY),                                                                        ts: NOW - 5*DAY,                auto:true,  data:{ title:'Untitled draft',   items:1, notes:0 } }
  ];
  var lastAutoDate = dateStr(NOW - 2*DAY); // matches the newest seeded auto entry
  var simNow = NOW - DAY; // first "simulate next day" click lands on real today
  // Which row (by id) is showing an inline confirm strip in place of its
  // normal actions, and for which action. Only one row at a time, no
  // native dialog anywhere in this pattern: { id, action:'restore'|'delete' } or null.
  var pendingConfirm = null;

  function renderCurrent(){
    if (!wrap.isConnected) return;
    titleInput.value = current.title;
    itemsCountEl.textContent = current.items;
    notesCountEl.textContent = current.notes;
  }

  function renderList(){
    if (!listEl.isConnected) return;
    capEl.textContent = versions.length + ' / ' + CAP;
    if (!versions.length){ listEl.innerHTML = '<div class="ver-empty">No saved versions yet. Save one before a big change so you can always roll back.</div>'; return; }
    listEl.innerHTML = versions.map(function(v){
      var when = new Date(v.ts).toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
      var title = (v.data && v.data.title) ? esc(v.data.title) : '(untitled)';
      var items = v.data ? v.data.items : 0, notes = v.data ? v.data.notes : 0;
      // Inline confirm strip replaces this row's normal actions in place,
      // never a native dialog. Only the one row currently pending shows it.
      if (pendingConfirm && pendingConfirm.id === v.id){
        var isRestore = pendingConfirm.action === 'restore';
        var msg = isRestore
          ? 'Restore "' + esc(v.name) + '"? Current state will be overwritten (a backup will be saved first).'
          : 'Delete "' + esc(v.name) + '"? This cannot be undone.';
        var label = isRestore ? 'Restore now' : 'Delete forever';
        return '<div class="ver-item">' +
            '<div class="ver-confirm">' +
              '<span>' + msg + '</span>' +
              '<span class="ver-confirm-actions">' +
                '<button type="button" class="ver-item-btn ver-danger" data-confirm-yes>' + label + '</button>' +
                '<button type="button" class="ver-item-btn" data-confirm-no>Cancel</button>' +
              '</span>' +
            '</div>' +
          '</div>';
      }
      return '<div class="ver-item">' +
          '<div class="ver-item-info">' +
            '<div class="ver-item-name' + (v.auto ? ' ver-auto' : '') + '">' + esc(v.name) + '</div>' +
            '<div class="ver-item-meta">' + when + ' · ' + title + ' · ' + items + ' items · ' + notes + ' notes</div>' +
          '</div>' +

  function hint(msg){
    if (!hintEl.isConnected) return;

    hintTimer = setTimeout(function(){ if (hintEl.isConnected) hintEl.textContent = ''; }, 2400);
  }

  // past the cap. Oldest simply means "off the end" of this ordering.
  function pruneIfNeeded(){
    if (versions.length > CAP) versions.splice(CAP);
  }

  function doSave(){
    var name = nameInput.value.trim() || ('Version ' + new Date().toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }));
    versions.unshift({ id: nextId(), name: name, ts: Date.now(), auto:false, data: { title: current.title, items: current.items, notes: current.notes } });

  }

    simNow += DAY;

    lastAutoDate = ds;

    renderList();
    hint('Auto-snapshot for ' + ds);

  function doRestore(id){
    var v = versions.find(function(x){ return x.id === id; });
    if (!v) return;

    // renderList above and the click handler below), never a native dialog.
    // House rule: snapshot the CURRENT state as its own version BEFORE
    // applying the restore, every time, so restoring can never itself be
    // a silent loss of whatever was live a moment ago.
    versions.unshift({ id: nextId(), name: 'Auto-backup before restore', ts: Date.now(), auto:true, data: { title: current.title, items: current.items, notes: current.notes } });
    pruneIfNeeded();
    current = { title: v.data.title, items: v.data.items, notes: v.data.notes };
    renderCurrent();
    renderList();
    hint('Restored "' + v.name + '"');
  }

  function doDelete(id){
    var v = versions.find(function(x){ return x.id === id; });
    if (!v) return;
    // Confirmation already happened via the inline ver-confirm strip (see
    // renderList above and the click handler below), never a native dialog.
    versions = versions.filter(function(x){ return x.id !== id; });
    renderList();
    hint('Deleted "' + v.name + '"');
  }

  addItemBtn.addEventListener('click', function(){ current.items++; renderCurrent(); });
  addNoteBtn.addEventListener('click', function(){ current.notes++; renderCurrent(); });
  titleInput.addEventListener('change', function(){ current.title = titleInput.value.trim(); });
  simDayBtn.addEventListener('click', doSimDay);
  saveBtn.addEventListener('click', doSave);
  listEl.addEventListener('click', function(e){
    var rBtn = e.target.closest('[data-restore]');
    var dBtn = e.target.closest('[data-del]');
    var yesBtn = e.target.closest('[data-confirm-yes]');
    var noBtn = e.target.closest('[data-confirm-no]');
    if (rBtn){ pendingConfirm = { id: rBtn.getAttribute('data-restore'), action: 'restore' }; renderList(); return; }
    if (dBtn){ pendingConfirm = { id: dBtn.getAttribute('data-del'), action: 'delete' }; renderList(); return; }
    if (yesBtn){
      var pc = pendingConfirm; pendingConfirm = null;
      if (pc){ if (pc.action === 'restore') doRestore(pc.id); else doDelete(pc.id); }
      return;
    }
    if (noBtn){ pendingConfirm = null; renderList(); return; } // Cancel: this row reverts, nothing else changes
  });

  renderCurrent();
  renderList();
})();
</script>

  var elNotes  = root.querySelector('.chg-f-notes');

    { key:'name',   label:'Name' },
    { key:'status', label:'Status' },
    { key:'price',  label:'Price' },
    { key:'tag',    label:'Tag' },
    { key:'notes',  label:'Notes' }
  ];

  // Formats one value for display: over 60 characters truncates with an
  // ellipsis so a long note can never blow out a row (mirrors _clFmtVal).
  function fmtVal(v){

  // null and undefined all read as "unset", so a cleared field and a
  // never-set field log identically. One entry per changed field, so
  // each lands as its own row, never bundled into one joined line.

    var out = [];

      var a = before ? before[f.key] : undefined;
      var b = after  ? after[f.key]  : undefined;
      var aN = (a === '' || a == null) ? '' : String(a);
      var bN = (b === '' || b == null) ? '' : String(b);

      else if (aN !== '' && bN === '') out.push({ kind:'removed', text: f.label + ' removed' });

  // truncation rule in fmtVal above lands on a real row, not just the code.

    countEl.textContent = log.length + (log.length === 1 ? ' entry' : ' entries');

    { orderId:'ORD-9999', amount:30.00 }
  ];

  var IGNORE_KEY = 'kjr_pattern_library_health_demo_ignored'; // demo-only, namespaced
  function loadIgnored(){ try{ return new Set(JSON.parse(localStorage.getItem(IGNORE_KEY)||'[]')); }catch(e){ return new Set(); } }
  function saveIgnored(set){ try{ localStorage.setItem(IGNORE_KEY, JSON.stringify(Array.from(set))); }catch(e){} }

  // Stable fingerprint: severity + area + a stemmed message (leading count
  // stripped, remaining numbers collapsed to #, first sentence only). A
  // finding that goes from "2 order(s)..." to "1 order(s)..." still matches.
  function fingerprint(f){
    var stem = String(f.message||'').toLowerCase()
      .replace(/^\d+\s*/, '')
      .replace(/\b\d+\b/g, '#')
      .split('.')[0]
      .trim()
      .slice(0, 80);
    return f.sev + '|' + f.area + '|' + stem;
  }

  function pushFinding(list, sev, area, message, fix, details){
    list.push({ sev:sev, area:area, message:message, fix:fix||'', details:details||[] });
  }

  // Check registry: each entry reads the shared ctx (both mock tables) and
  // pushes zero or more findings. Add a check by adding a function here,
  // nothing else needs to change.
  var CHECKS = [
    function(ctx, out){
      var seen = {}, dups = [];
      ctx.orders.forEach(function(o){
        if (seen[o.id]) dups.push({ label:o.id+' - '+o.customer, key:o.key });
        seen[o.id] = true;
      });
      if (dups.length) pushFinding(out, 'fail', 'Orders', dups.length+' order id(s) appear more than once (id collision).', 'Check the changelog for the timestamp, then delete or renumber one duplicate.', dups);
    },
    function(ctx, out){
      var bad = [];
      ctx.payments.forEach(function(p){
        var o = ctx.orders.filter(function(x){ return x.id === p.orderId; }).pop();
        if (o && o.status !== 'Paid') bad.push({ label:o.id+' - '+o.customer+' ('+o.status+')', key:o.key });
      });
      if (bad.length) pushFinding(out, 'fail', 'Payments', bad.length+' order(s) have a payment recorded but are not marked Paid, revenue may be under-counted.', 'Open the order and set its status to Paid.', bad);
    },
    function(ctx, out){
      var orphans = [];
      ctx.payments.forEach(function(p){
        var exists = ctx.orders.some(function(o){ return o.id === p.orderId; });
        if (!exists) orphans.push({ label:p.orderId+' (no matching order) - S$'+p.amount.toFixed(2), key:null });
      });
      if (orphans.length) pushFinding(out, 'warn', 'Payments', orphans.length+' payment(s) reference an order that does not exist.', 'Confirm the order was not deleted in error, or delete the orphaned payment.', orphans);
    },
    function(ctx, out){
      var bad = ctx.orders.filter(function(o){ return o.total < 0; }).map(function(o){ return { label:o.id+' - '+o.customer+' - S$'+o.total.toFixed(2), key:o.key }; });
      if (bad.length) pushFinding(out, 'fail', 'Pricing', bad.length+' order(s) have a negative total.', 'Edit the order and correct the total.', bad);
    },
    function(ctx, out){
      var bad = ctx.orders.filter(function(o){ return (o.note||'').length > 140; }).map(function(o){ return { label:o.id+' - '+o.customer, key:o.key }; });
      if (bad.length) pushFinding(out, 'warn', 'Orders', bad.length+' order note(s) are unusually long.', 'Trim the note to the key fact, the full history stays in the changelog.', bad);
    },
    function(ctx, out){
      var sum = ctx.orders.filter(function(o){ return o.status === 'Pending'; }).reduce(function(s,o){ return s+o.total; }, 0);
      pushFinding(out, 'info', 'Dashboard', 'Outstanding total across Pending orders: S$'+sum.toFixed(2)+'.', '', []);
    }
  ];

  function runChecks(){
    var out = [];
    CHECKS.forEach(function(fn){ fn({ orders:orders, payments:payments }, out); });
    return out;
  }

  function renderRows(){
    if (!rowsEl.isConnected) return;
    rowsEl.innerHTML = orders.map(function(o){
      var stCls = o.status === 'Paid' ? 'hlt-st-paid' : o.status === 'Pending' ? 'hlt-st-pending' : 'hlt-st-refunded';
      var totalTxt = (o.total < 0 ? '-S$' + Math.abs(o.total).toFixed(2) : 'S$' + o.total.toFixed(2));
      return '<div class="hlt-row" data-hlt-key="'+esc(o.key)+'">' +
        '<span class="hlt-rowid">'+esc(o.id)+'</span>' +
        '<span class="hlt-rowcust" title="'+esc(o.customer)+'">'+esc(o.customer)+'</span>' +
        '<span class="hlt-pill '+stCls+'">'+esc(o.status)+'</span>' +
        '<span class="hlt-rowtotal">'+esc(totalTxt)+'</span>' +
        (o.note ? '<span class="hlt-rownote" title="'+esc(o.note)+'">'+esc(o.note)+'</span>' : '') +
      '</div>';
    }).join('');
  }

  function renderDetails(details, idx){
    return '<div class="hlt-details" data-hlt-detail="'+idx+'" style="display:none">' +
      details.map(function(d){
        return '<div class="hlt-detail-row">' +
          '<span class="hlt-detail-label">'+esc(d.label)+'</span>' +
          (d.key ? '<button type="button" class="hlt-view" data-hlt-view="'+esc(d.key)+'">View</button>' : '<span class="hlt-detail-missing">no matching row</span>') +
        '</div>';
      }).join('') +
    '</div>';
  }

  function render(){
    if (!wrap.isConnected) return;
    renderRows();
    var all = runChecks();
    var ignored = loadIgnored();
    var visible = all.filter(function(f){ return !ignored.has(fingerprint(f)); });
    var fails = visible.filter(function(f){ return f.sev === 'fail'; });
    var warns = visible.filter(function(f){ return f.sev === 'warn'; });
    var infos = visible.filter(function(f){ return f.sev === 'info'; });
    var ignoredCount = all.length - visible.length;
    var ok = fails.length === 0;

    summaryEl.className = 'hlt-summary ' + (ok ? 'hlt-ok' : 'hlt-issues');
    summaryEl.innerHTML =
      '<span class="hlt-summary-dot"></span>' +
      '<span class="hlt-summary-text">' + (ok ? 'All checks passed.' : esc(fails.length + ' check(s) need attention.')) + '</span>' +
      '<span class="hlt-summary-meta">' + visible.length + ' shown' + (ignoredCount ? ', ' + ignoredCount + ' ignored' : '') + '</span>';

    restoreBtn.style.display = ignoredCount ? '' : 'none';

    var idx = 0;
    function group(list, label, sev){
      if (!list.length) return '';
      var body = list.map(function(f){
        var myIdx = idx++;
        var fp = fingerprint(f);
        var hasDetails = f.details && f.details.length > 0;
        return '<div class="hlt-finding hlt-finding-'+sev+'">' +
          '<div class="hlt-finding-top"><span class="hlt-tag hlt-tag-'+sev+'">'+sev.toUpperCase()+'</span><span class="hlt-finding-area">'+esc(f.area)+'</span></div>' +
          '<div class="hlt-finding-msg">'+esc(f.message)+'</div>' +
          (f.fix ? '<div class="hlt-finding-fix"><strong>Fix:</strong> '+esc(f.fix)+'</div>' : '') +
          '<div class="hlt-finding-actions">' +
            (hasDetails ? '<button type="button" class="hlt-ghost hlt-toggle" data-hlt-toggle="'+myIdx+'">'+f.details.length+' row'+(f.details.length===1?'':'s')+'</button>' : '<span></span>') +
            '<button type="button" class="hlt-ghost" data-hlt-ignore="'+esc(fp)+'">Ignore</button>' +
          '</div>' +
          (hasDetails ? renderDetails(f.details, myIdx) : '') +
        '</div>';
      }).join('');
      return '<div class="hlt-group"><div class="hlt-group-label hlt-tag-'+sev+'">'+label+' ('+list.length+')</div>'+body+'</div>';
    }

    if (!visible.length){
      findingsEl.innerHTML = '<div class="hlt-clean">Nothing to act on right now' + (ignoredCount ? ' (' + ignoredCount + ' ignored).' : '.') + '</div>';
    } else {
      findingsEl.innerHTML = group(fails, 'Fail', 'fail') + group(warns, 'Warn', 'warn') + group(infos, 'Info', 'info');
    }
  }

  var hlTimer = null;
  function gotoRow(key){
    if (!key || !rowsEl.isConnected) return;
    var row = rowsEl.querySelector('[data-hlt-key="'+key+'"]');
    if (!row) return;
    row.scrollIntoView({ behavior:'smooth', block:'center' });
    row.classList.add('hlt-hit');
    if (hlTimer) clearTimeout(hlTimer);
    hlTimer = setTimeout(function(){ if (row.isConnected) row.classList.remove('hlt-hit'); }, 1800);
  }

  findingsEl.addEventListener('click', function(e){
    var ignoreBtn = e.target.closest('[data-hlt-ignore]');
    if (ignoreBtn){
      var set = loadIgnored();
      set.add(ignoreBtn.getAttribute('data-hlt-ignore'));
      saveIgnored(set);
      render();
      return;
    }
    var toggleBtn = e.target.closest('[data-hlt-toggle]');
    if (toggleBtn){
      var open = toggleBtn.classList.toggle('hlt-open');
      var det = findingsEl.querySelector('[data-hlt-detail="'+toggleBtn.getAttribute('data-hlt-toggle')+'"]');
      if (det) det.style.display = open ? 'block' : 'none';
      return;
    }
    var viewBtn = e.target.closest('[data-hlt-view]');
    if (viewBtn){ gotoRow(viewBtn.getAttribute('data-hlt-view')); return; }
  });

  runBtn.addEventListener('click', render);
  restoreBtn.addEventListener('click', function(){
    try{ localStorage.removeItem(IGNORE_KEY); }catch(e){}
    render();
  });

  render();
})();
</script>
</template>

<template class="pattern" data-title="Update Pill" data-category="Systems" data-source="Kujira Collectibles v3.31 (features.js, shell-version poll)" data-note="Background poll compares the page's own ETag or Last-Modified header against a baseline captured on first load, only showing the pill on a genuine change, never on that first check. The real fetch-based check ships in this card's script (wired to load and visibilitychange) but stays inert here since file:// cannot HEAD a resource, use Simulate new deploy to drive the pill. Scoped to the card rather than a page-fixed corner for this gallery demo, production pins it to a screen corner. Full architecture, service worker pairing and integration steps are in App Updates.md alongside this file. Related: Offline Shell documents the service worker this pill pairs with.">
<style>
.upd-demo{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:300px}
.upd-sim{padding:8px 14px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg4);color:var(--text);cursor:pointer;font-size:12px;font-weight:500;font-family:inherit;transition:background var(--dur) ease-out}
.upd-sim:hover{background:var(--bg3)}
.upd-status{font-size:11.5px;color:var(--text2);text-align:center;min-height:15px}
.upd-pill{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border2);color:var(--text);padding:8px 8px 8px 14px;border-radius:999px;font-size:12px;box-shadow:var(--shadow-2);cursor:pointer;animation:upd-in var(--dur) var(--spring)}
.upd-pill[hidden]{display:none}
.upd-pill-close{border:none;background:var(--bg4);color:var(--text2);cursor:pointer;font-size:11px;width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0}
.upd-pill-close:hover{background:var(--bg3);color:var(--text)}
@keyframes upd-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
<div class="upd-demo">
  <button type="button" class="upd-sim">Simulate new deploy</button>
  <p class="upd-status" aria-live="polite">No update detected yet.</p>
  <div class="upd-pill" role="status" hidden>
    <span>Update ready, tap to reload</span>
    <button type="button" class="upd-pill-close" aria-label="Dismiss">&#10005;</button>
  </div>
</div>
<script>
(function(){
  // Finds its own elements relative to itself, never a global id, so several
  // instances (or repeated re-renders from the filter cycle) never collide.
  var script = document.currentScript;
  var root = script.parentElement;
  var simBtn = root.querySelector('.upd-sim');
  var statusEl = root.querySelector('.upd-status');
  var pill = root.querySelector('.upd-pill');
  var closeBtn = root.querySelector('.upd-pill-close');
  if (!simBtn || !statusEl || !pill || !closeBtn) return;

  function showPill(){
    if (!root.isConnected) return;
    pill.hidden = false;
    statusEl.textContent = 'Update ready. The pill below is now showing.';
  }

  simBtn.addEventListener('click', showPill);

  // Whole pill is clickable (mirrors the source), the close button carves
  // itself out of that with stopPropagation so dismissing never also fires
  // the reload path.
  pill.addEventListener('click', function(e){
    if (e.target === closeBtn){
      e.stopPropagation();
      pill.hidden = true;
      statusEl.textContent = 'Dismissed. The real update stays pending until the page is next reloaded.';
      return;
    }
    pill.hidden = true;
    statusEl.textContent = 'Reloaded (simulated). In production this calls location.reload().';
  });

  // ── The real check, ships as reference but stays inert in this demo ──
  // Same technique as the source: HEAD the page's own URL, compare its
  // ETag/Last-Modified to a baseline captured on the first probe, show the
  // pill only on a genuine change (never on that first probe). Wrapped so
  // any failure, offline or file:// (fetch cannot run over that scheme at
  // all), is a silent no-op, never an error: this is a background probe the
  // user never asked for.
  var baseline = null;
  function checkForUpdate(){
    if (!root.isConnected) return;
    fetch(location.href, { method: 'HEAD', cache: 'no-store' }).then(function(res){
      if (!root.isConnected || !res.ok) return;
      var stamp = res.headers.get('ETag') || res.headers.get('Last-Modified');
      if (!stamp) return; // server exposes neither header, nothing to compare against
      if (baseline === null){ baseline = stamp; return; } // first probe just sets the baseline
      if (stamp !== baseline) showPill();
    }).catch(function(){ /* offline, blocked, or file:// - silent no-op, background probe */ });
  }

  window.addEventListener('load', function(){ if (root.isConnected) checkForUpdate(); }, { once: true });

  // Self-terminating: the gallery fully re-renders the grid on every filter
  // click (grid.innerHTML=''), so a stale instance's visibilitychange
  // listener must not keep firing forever, one leaked listener per past
  // render. React the moment this card leaves the DOM rather than waiting
  // for a stray event.
  function onVisible(){
    if (!root.isConnected){ document.removeEventListener('visibilitychange', onVisible); return; }
    if (document.visibilityState === 'visible') checkForUpdate();
  }
  document.addEventListener('visibilitychange', onVisible);

  var lifecycleObserver = new MutationObserver(function(){
    if (!root.isConnected){
      document.removeEventListener('visibilitychange', onVisible);
      lifecycleObserver.disconnect();
    }
  });
  lifecycleObserver.observe(document.body, { childList: true, subtree: true });
})();
</script>
</template>

  var LABELS = { reports:'Reports', archive:'Archive', settings:'Settings', help:'Help' };
  var REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function onKeydown(e){

<style>

  </div>

<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var wrap = root.querySelector('.seg-wrap');
  if (!wrap) return;
  var select = wrap.querySelector('.seg-source');
  var tableView = wrap.querySelector('.seg-view-table');
  var cardsView = wrap.querySelector('.seg-view-cards');
  var tableBody = wrap.querySelector('.seg-table-body');
  var cardsGrid = wrap.querySelector('.seg-cards-grid');
  if (!select || !tableView || !cardsView || !tableBody || !cardsGrid) return;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Invented sample data, no Collectibles fields.
  var ITEMS = [
    { name:'Dragon Fruit', origin:'Vietnam, Mekong Delta smallholder farms, hand-picked each dry season for export', price:'$4.20', stock:'34'  },
    { name:'Mango',        origin:'Philippines', price:'$2.80', stock:'120' },
    { name:'Rambutan',     origin:'Malaysia',    price:'$3.10', stock:'58'  },
    { name:'Kiwi',         origin:'New Zealand', price:'$1.90', stock:'200' },
    { name:'Lychee',       origin:'China',       price:'$5.00', stock:'15'  },
    { name:'Papaya',       origin:'Thailand',    price:'$2.20', stock:'0'   }
  ];

  function renderList(){
    if (!tableBody.isConnected) return;
    tableBody.innerHTML = ITEMS.map(function(it){
      return '<tr><td>'+esc(it.name)+'</td><td><div class="seg-td-wrap">'+esc(it.origin)+'</div></td><td>'+esc(it.price)+'</td><td>'+esc(it.stock)+'</td></tr>';
    }).join('');
    cardsGrid.innerHTML = ITEMS.map(function(it){
      return '<div class="seg-card">' +
        '<div class="seg-card-name">'+esc(it.name)+'</div>' +
        '<div class="seg-card-origin">'+esc(it.origin)+'</div>' +
        '<div class="seg-card-meta"><span>'+esc(it.price)+'</span><span>Stock '+esc(it.stock)+'</span></div>' +
      '</div>';
    }).join('');
  }

  // Turn the select into a segmented control non-destructively: the select
  // stays the value holder (hidden via CSS), buttons proxy clicks onto it and
  // fire its existing change event, so no downstream logic changes.
  function segmentize(sel){
    if (!sel || sel._segmentized) return;
    var seg = document.createElement('div');
    seg.className = 'seg';
    seg.setAttribute('role', 'tablist');
    function build(){
      seg.innerHTML = '';
      Array.prototype.forEach.call(sel.options, function(opt){
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'seg-btn' + (opt.value === sel.value ? ' active' : '');
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-selected', opt.value === sel.value ? 'true' : 'false');
        b.textContent = opt.textContent;
        b.addEventListener('click', function(){
          if (sel.value === opt.value) return;
          sel.value = opt.value;
          sel.dispatchEvent(new Event('change', { bubbles: true }));
        });
        seg.appendChild(b);
      });
    }
    build();
    sel.insertAdjacentElement('afterend', seg);
    sel.addEventListener('change', build); // keep the active button in sync
    sel._segmentized = true;
  }

  function syncView(){
    if (!root.isConnected) return;
    var mode = select.value;
    tableView.hidden = mode !== 'table';
    cardsView.hidden = mode !== 'cards';
  }
  select.addEventListener('change', syncView);

  segmentize(select);
  renderList();
  syncView();
})();
</script>

<template class="pattern" data-title="Long Press" data-category="Components" data-source="Kujira Collectibles v3.31 (app.js, kjrInitTouchTips)" data-note="Touch long-press reveals an element's title attribute as a tooltip near the press point, useful on mobile where hover never fires. This gallery demo also answers a mouse hold, since a desktop visitor testing the pattern has no touchscreen, real touch devices still behave the same way.">
<style>
.ltp-wrap{width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.ltp-hint{font-size:12px;color:var(--text2);max-width:320px;margin:0}
.ltp-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:360px}
.ltp-chip{padding:7px 13px;border-radius:999px;border:1px solid var(--border2);background:var(--bg4);color:var(--text);font-size:12px;font-weight:500;cursor:help;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.ltp-chip:hover{background:var(--bg3)}
.ltp-tip{position:fixed;z-index:9000;max-width:min(78vw,280px);background:var(--bg4);border:1px solid var(--border2);border-radius:var(--radius);padding:7px 11px;font-size:12px;line-height:1.4;color:var(--text);box-shadow:var(--shadow-2);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity var(--dur) ease-out,transform var(--dur) ease-out;overflow-wrap:anywhere}
.ltp-tip.show{opacity:1;transform:translateY(0)}
</style>
<div class="ltp-wrap">
  <p class="ltp-hint">Press and hold (mouse or touch) any chip below to reveal its hint.</p>
  <div class="ltp-row">
    <span class="ltp-chip" title="Ships within 2 business days">Standard</span>
    <span class="ltp-chip" title="Arrives next day, cut-off 3pm">Express</span>
    <span class="ltp-chip" title="Collect in person, no delivery fee">Pickup</span>
    <span class="ltp-chip" title="Signature required on delivery, insured up to full value">Signature</span>
    <span class="ltp-chip" title="This is a deliberately long hint to prove the bubble clamps to the viewport and wraps onto multiple lines instead of overflowing past the edge of the screen or the card that contains it">Long hint</span>
  </div>
</div>
<script>
(function(){
  // Finds its own root relative to itself, never a global id, so several
  // instances (or repeated re-renders from the filter cycle) never collide.
  var script = document.currentScript;
  var root = script.parentElement;
  var wrap = root.querySelector('.ltp-wrap');
  if (!wrap) return;

  var HOLD_MS = 450;
  var SHOW_MS = 3000;
  var bubble = null, timer = null, hideTimer = null, startX = 0, startY = 0, swallow = false;

  function hideBubble(){
    if (hideTimer){ clearTimeout(hideTimer); hideTimer = null; }
    if (bubble) bubble.classList.remove('show');
  }
  function showBubble(el, x, y){
    var text = el.getAttribute('title');
    if (!text) return;
    if (!bubble){ bubble = document.createElement('div'); bubble.className = 'ltp-tip'; document.body.appendChild(bubble); }
    bubble.textContent = text;
    bubble.classList.add('show');
    // Position above the press point, clamped to the viewport.
    var r = bubble.getBoundingClientRect();
    var left = Math.min(Math.max(8, x - r.width / 2), window.innerWidth - r.width - 8);
    var top = y - r.height - 14;
    if (top < 8) top = y + 18; // not enough room above, drop below instead
    bubble.style.left = left + 'px';
    bubble.style.top = top + 'px';
    swallow = true;
    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(hideBubble, SHOW_MS);
  }

  // Deviation from source: the app-only version bails out on
  // e.pointerType === 'mouse' (touch devices only, desktop already has
  // native hover). This gallery demo removes that check so a mouse hold
  // works too, since a desktop visitor testing the pattern has no
  // touchscreen to try it with. Real touch devices behave identically
  // either way.
  function onPointerDown(e){
    var el = e.target.closest && e.target.closest('[title]');
    if (!el || !wrap.contains(el)) return;
    startX = e.clientX; startY = e.clientY; swallow = false;
    if (timer) clearTimeout(timer);
    timer = setTimeout(function(){ showBubble(el, startX, startY); }, HOLD_MS);
  }
  function onPointerMove(e){
    if (timer && (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10)){
      clearTimeout(timer); timer = null;
    }
  }
  function onPointerUp(){ if (timer){ clearTimeout(timer); timer = null; } }
  function onPointerCancel(){ onPointerUp(); hideBubble(); }
  // After a long-press, swallow the click the browser fires so the element's
  // own action does not also run (the user meant "peek", not "activate").
  function onClick(e){
    if (swallow){ swallow = false; e.preventDefault(); e.stopPropagation(); }
  }
  function onScroll(){ hideBubble(); }

  document.addEventListener('pointerdown', onPointerDown, true);
  document.addEventListener('pointermove', onPointerMove, true);
  document.addEventListener('pointerup', onPointerUp, true);
  document.addEventListener('pointercancel', onPointerCancel, true);
  document.addEventListener('click', onClick, true);
  document.addEventListener('scroll', onScroll, true);

  // Self-terminating: these are document-level listeners, so they must stop
  // themselves once this pattern's root leaves the DOM (cycling the gallery
  // filter would otherwise stack a new set on every re-render).
  function teardown(){
    document.removeEventListener('pointerdown', onPointerDown, true);
    document.removeEventListener('pointermove', onPointerMove, true);
    document.removeEventListener('pointerup', onPointerUp, true);
    document.removeEventListener('pointercancel', onPointerCancel, true);
    document.removeEventListener('click', onClick, true);
    document.removeEventListener('scroll', onScroll, true);
    if (timer) clearTimeout(timer);
    if (hideTimer) clearTimeout(hideTimer);
    if (bubble){ bubble.remove(); bubble = null; }
    mo.disconnect();
  }
  var mo = new MutationObserver(function(){
    if (!root.isConnected) teardown();
  });
  mo.observe(document.body, { childList: true, subtree: true });
})();
</script>
</template>

  var sendBtn = root.querySelector('.air-send');
  if (!wrap || !logEl || !resultEl || !sendBtn) return;

  // Invented demo chain, no real keys anywhere, no network. Gemini has no
  // key configured (skipped). Groq is the one provider that mock-fails,
  // classified as a transport error. OpenRouter then succeeds and the walk
  // stops there, Anthropic is never reached.
  var PROVIDERS = [
    { id:'gemini', name:'Gemini', hasKey:false },
    { id:'groq', name:'Groq', hasKey:true, fail:{ kind:'timeout' } },
    { id:'openrouter', name:'OpenRouter', hasKey:true },
    { id:'anthropic', name:'Anthropic', hasKey:true }
  ];

  function classify(fail){
    if (!fail) return null;
    if (fail.kind === 'timeout') return { text:'Failed, transport error (request timed out)' };
    if (fail.kind === 'http'){
      if (fail.status === 401 || fail.status === 403 || fail.status === 429) return { text:'Failed, quota or auth error (HTTP ' + fail.status + ')' };
      return { text:'Failed, transport error (HTTP ' + fail.status + ')' };
    }
    return { text:'Failed, transport error' };
  }

  function nodeEl(i){ return root.querySelector('[data-air-node="' + i + '"]'); }
  function setNode(i, state, text){
    var node = nodeEl(i);
    if (!node || !node.isConnected) return;
    node.className = 'air-node air-' + state;
    var statusEl = node.querySelector('.air-node-status');
    if (statusEl) statusEl.textContent = text;
  }
  function log(msg){
    if (!logEl.isConnected) return;
    logEl.hidden = false;
    var line = document.createElement('div');
    line.textContent = msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  var timers = [];
  function clearTimers(){ timers.forEach(function(id){ clearTimeout(id); }); timers.length = 0; }

  function resetAll(){
    PROVIDERS.forEach(function(p, i){ setNode(i, 'idle', 'Idle'); });
    logEl.innerHTML = '';
    logEl.hidden = true;
    resultEl.className = 'air-result';
    resultEl.innerHTML = '';
  }

  function step(i){
    if (!wrap.isConnected) return;
    if (i >= PROVIDERS.length){
      resultEl.className = 'air-result air-result-err';
      resultEl.textContent = 'No provider responded. Add a key for at least one provider in Settings, or try again.';
      sendBtn.disabled = false;
      return;
    }
    var p = PROVIDERS[i];
    if (!p.hasKey){
      setNode(i, 'skipped', 'Skipped, no key');
      log(p.name + ': skipped, no key configured.');
      timers.push(setTimeout(function(){ step(i + 1); }, 280));
      return;
    }
    setNode(i, 'trying', 'Trying...');
    log(p.name + ': request sent.');
    timers.push(setTimeout(function(){
      if (!wrap.isConnected) return;
      var cls = classify(p.fail);
      if (!cls){
        setNode(i, 'success', 'Responded');
        log(p.name + ': responded.');
        resultEl.className = 'air-result air-result-ok';
        resultEl.innerHTML = '<span class="air-result-tag">Response via ' + p.name + ':</span> "Here is a quick summary of what you asked for, based on this week\'s figures."';
        sendBtn.disabled = false;
        return;
      }
      setNode(i, 'failed', cls.text);
      log(p.name + ': ' + cls.text + ', falling back to the next provider.');
      timers.push(setTimeout(function(){ step(i + 1); }, 280));
    }, 700));
  }

  function walk(){
    if (!wrap.isConnected) return;
    clearTimers();
    resetAll();
    sendBtn.disabled = true;
    log('Sending prompt...');
    timers.push(setTimeout(function(){ step(0); }, 200));
  }

  sendBtn.addEventListener('click', walk);
  resetAll();
})();
</script>
</template>

<template class="pattern" data-title="Cross-app Topbar" data-category="Components" data-source="Portfolio repo (Portfolio, Trading, Journal topbars, unified rebuild)" data-note="Each app in the Portfolio repo hand-built its own topbar, a different structure and tab style in every one. This unifies them into one component: a brand mark on the left, app-switch tabs with a clear active state, and a right-side slot for a status pill or a settings action. A container query watches the bar's own rendered width rather than the viewport, so the same rules apply whether the card sits in a wide or narrow grid column. The status label gives way first as the bar narrows, then the brand wordmark, keeping the tab strip itself wide enough that the active tab stays visible, it shrinks and scrolls horizontally rather than ever wrapping onto a second line. Click a tab to preview the active state, real navigation is intercepted in this demo.">

<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var wrap = root.querySelector('.ics-wrap');
  if (!wrap) return;

  // Re-implementation of Journal's ICONS map: inner-SVG markup only, never
  // the outer svg tag, safe for multi-primitive icons (more than one path,
  // or a path/circle mix). Path data is Lucide (MIT licence, lucide.dev),
  // the same source Journal itself credits.
  var ICONS = {
    menu: '<path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/>',
    search: '<path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/>',
    edit: '<path d="M13 21h8"/><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>',
    'more-horizontal': '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
    'chevron-right': '<path d="m9 18 6-6-6-6"/>',
    check: '<path d="M20 6 9 17l-5-5"/>'
  };

  function icon(name, opts){
    opts = opts || {};
    var size = opts.size || 16, cls = opts.cls || '';
    var inner = ICONS[name];
    if (!inner) return '';
    return '<svg class="ico' + (cls ? ' ' + cls : '') + '" width="' + size + '" height="' + size +
      '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
  }

  // Every [data-icon] renders once immediately, exactly like a normal icon()
  // call inside JS-templated markup elsewhere in an app.
  Array.prototype.forEach.call(wrap.querySelectorAll('[data-icon]'), function(el){
    el.innerHTML = icon(el.getAttribute('data-icon'), { size: +el.getAttribute('data-size') || 16 });
  });

  // wireStaticIcons() sub-demo: a one-shot pass hydrating icons baked into a
  // static HTML shell at parse time, deliberately kept separate from the
  // [data-icon] pass above. Delayed so the "before" state is visible rather
  // than instant-and-invisible; reduced motion skips the wait entirely.
  var staticEls = wrap.querySelectorAll('[data-static-icon]');
  var stateEl = wrap.querySelector('.ics-static-state');
  var rerunBtn = wrap.querySelector('.ics-rerun');
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hydrateTimer = null;

  function resetStatic(){
    Array.prototype.forEach.call(staticEls, function(el){ el.innerHTML = ''; });
    if (stateEl) stateEl.textContent = 'static shell: unhydrated';
  }
  function wireStaticIconsDemo(){
    if (!wrap.isConnected) return; // card left the DOM mid-timer (filter cycled away)
    Array.prototype.forEach.call(staticEls, function(el){
      el.innerHTML = icon(el.getAttribute('data-static-icon'), { size: +el.getAttribute('data-static-size') || 16 });
    });
    if (stateEl) stateEl.textContent = 'hydrated by wireStaticIcons()';
  }
  function runDemo(){
    clearTimeout(hydrateTimer);
    resetStatic();
    hydrateTimer = setTimeout(wireStaticIconsDemo, reduceMotion ? 0 : 650);
  }

  runDemo();
  if (rerunBtn) rerunBtn.addEventListener('click', runDemo);
})();
</script>

    if (!f) return true;
    var x = parseFloat(val);
    if (isNaN(x)) return false;
    var r = f.match(/^(-?\d+(?:\.\d+)?)\s*-\s*(-?\d+(?:\.\d+)?)$/);
    if (r){
      var a = parseFloat(r[1]), b = parseFloat(r[2]);
      var lo = Math.min(a, b), hi = Math.max(a, b);
      return x >= lo && x <= hi;
    }
    var c = f.match(/^(>=|<=|>|<)\s*(-?\d+(?:\.\d+)?)$/);
    if (c){
      var op = c[1], v = parseFloat(c[2]);
      if (op === '>')  return x >  v;
      if (op === '<')  return x <  v;
      if (op === '>=') return x >= v;
      if (op === '<=') return x <= v;
    }
    var v2 = parseFloat(f);
    if (isNaN(v2)) return false;
    return Math.abs(x - v2) < 1.0;
  }

  function render(){
    if (!tbody.isConnected) return;
    var f = input.value;
    var visible = rows.filter(function(r){ return matchNumFilter(f, r.price); });
    countEl.textContent = visible.length + ' of ' + rows.length + ' row' + (rows.length === 1 ? '' : 's');
    if (!visible.length){
      tbody.innerHTML = '<tr class="nf-empty-row"><td colspan="2">No rows match "' + esc(f) + '".</td></tr>';
      return;
    }
    tbody.innerHTML = visible.map(function(r){
      return '<tr><td>' + esc(r.name) + '</td><td>$' + r.price.toFixed(2) + '</td></tr>';
    }).join('');
  }

  input.addEventListener('input', render);
  render();
})();
</script>
</template>

<template class="pattern" data-title="Form Builder" data-category="Flows" data-source="Quantedge (index.html, SCHEMAS :506, openModal() :927)" data-note="A declarative column config per table (type, required, default, optionsFn for a dynamic select's choices, dep for conditional field visibility, plus a per-table validate() hook) drives both the add/edit modal's markup and its validation, so every table's form comes from one small schema object instead of a bespoke form per entity. Demo: two entities, assets (a simple schema) and checkouts (an asset picker built from optionsFn, a due-date field shown only when dep matches the current mode, and a validate() rule that blocks checking out an asset that is already held elsewhere). Inline field errors render in the same pass that reads the form back on save, cleared and rebuilt fresh on every attempt.">
<style>

</style>
<div class="fb-wrap">
  <div class="fb-section">
    <div class="fb-section-head"><h4>Assets</h4><button type="button" class="fb-add fb-add-asset">+ Add asset</button></div>
    <div class="fb-list fb-assets-list"></div>
  </div>
  <div class="fb-section">
    <div class="fb-section-head"><h4>Checkouts</h4><button type="button" class="fb-add fb-add-checkout">+ Add checkout</button></div>
    <div class="fb-list fb-checkouts-list"></div>
  </div>
</div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var wrap = root.querySelector('.fb-wrap');
  var assetsListEl = root.querySelector('.fb-assets-list');
  var checkoutsListEl = root.querySelector('.fb-checkouts-list');
  var addAssetBtn = root.querySelector('.fb-add-asset');
  var addCheckoutBtn = root.querySelector('.fb-add-checkout');
  if (!wrap || !assetsListEl || !checkoutsListEl || !addAssetBtn || !addCheckoutBtn) return;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  var uidSeed = 100;
  function uid(){ return 'x' + (uidSeed++); }

  // Invented demo data, generic asset/checkout language, no Quantedge data.
  var assets = [
    { id:'a1', name:'Laptop 04', category:'Laptop' },
    { id:'a2', name:'Access card 7', category:'Access card' },
    { id:'a3', name:'Projector', category:'Equipment' }
  ];
  var checkouts = [
    { id:'c1', assetId:'a2', holder:'R. Lim', mode:'Must be returned', dueDate:'2026-07-18', returnedAt:null }
  ];

  function availableAssetOptions(origId){
    var heldElsewhere = {};
    checkouts.forEach(function(c){ if (!c.returnedAt && c.id !== origId) heldElsewhere[c.assetId] = true; });
    return assets.filter(function(a){ return !heldElsewhere[a.id]; }).map(function(a){ return { value:a.id, label:a.name }; });
  }

  var SCHEMAS = {
    assets: {
      singular: 'asset',
      columns: [
        { key:'name', label:'Asset name', type:'text', required:true, placeholder:'e.g. Laptop 04' },
        { key:'category', label:'Category', type:'select', options:['Laptop','Access card','Equipment'], required:true }
      ]
    },
    checkouts: {
      singular: 'checkout',
      columns: [
        { key:'assetId', label:'Asset', type:'select', optionsFn:availableAssetOptions, required:true },
        { key:'holder', label:'Held by', type:'text', required:true, placeholder:'e.g. J. Tan' },
        { key:'mode', label:'Return required?', type:'select', options:['No return needed','Must be returned'], required:true },
        { key:'dueDate', label:'Due back', type:'date', dep:{ key:'mode', val:'Must be returned' } }
      ],
      validate: function(item, origId){
        var clash = checkouts.some(function(c){ return c.assetId === item.assetId && !c.returnedAt && c.id !== origId; });
        if (clash) return { assetId:'That asset is already checked out.' };
        return {};
      }
    }
  };

  var editTable = null, editId = null;

  function fieldValue(c, item){
    if (item && item[c.key] != null) return item[c.key];
    return '';
  }

  function renderField(c, item){
    var v = fieldValue(c, item);
    var input;
    if (c.type === 'select'){
      var opts = c.optionsFn ? c.optionsFn(item ? item.id : null) : (c.options || []).map(function(o){ return { value:o, label:o }; });
      input = '<select data-fb-key="' + c.key + '">' +
        '<option value="">Select...</option>' +
        opts.map(function(o){ return '<option value="' + esc(o.value) + '"' + (String(v) === String(o.value) ? ' selected' : '') + '>' + esc(o.label) + '</option>'; }).join('') +
        '</select>';
    } else {
      var t = c.type === 'date' ? 'date' : 'text';
      input = '<input data-fb-key="' + c.key + '" type="' + t + '" placeholder="' + esc(c.placeholder || '') + '" value="' + esc(v) + '">';
    }
    var hidden = c.dep ? ' fb-hidden' : '';
    return '<div class="fb-field' + hidden + '" data-fb-field="' + c.key + '">' +
      '<label>' + esc(c.label) + (c.required ? ' <span class="fb-req">*</span>' : '') + '</label>' +
      input + '<div class="fb-err" data-fb-err="' + c.key + '"></div></div>';
  }

  function applyDeps(modalEl, schema){
    schema.columns.forEach(function(c){
      if (!c.dep) return;
      var ctrl = modalEl.querySelector('[data-fb-key="' + c.dep.key + '"]');
      var wrapEl = modalEl.querySelector('[data-fb-field="' + c.key + '"]');
      if (ctrl && wrapEl) wrapEl.classList.toggle('fb-hidden', ctrl.value !== c.dep.val);
    });
  }

  function closeModal(){
    var ov = wrap.querySelector('.fb-overlay');
    if (ov) ov.remove();
  }

  function openModal(table, id){
    closeModal();
    editTable = table; editId = id || null;
    var schema = SCHEMAS[table];
    var list = table === 'assets' ? assets : checkouts;
    var item = id ? list.find(function(r){ return r.id === id; }) : null;
    var fieldsHtml = schema.columns.map(function(c){ return renderField(c, item); }).join('');
    var ov = document.createElement('div');
    ov.className = 'fb-overlay';
    ov.innerHTML =
      '<div class="fb-modal" role="dialog" aria-modal="true">' +
        '<div class="fb-modal-head"><h4>' + (item ? 'Edit ' : 'Add ') + esc(schema.singular) + '</h4><button type="button" class="fb-x" aria-label="Close">&#10005;</button></div>' +
        '<div class="fb-modal-body">' + fieldsHtml + '</div>' +
        '<div class="fb-modal-foot"><button type="button" class="fb-btn fb-cancel">Cancel</button><button type="button" class="fb-btn fb-btn-primary fb-save">Save</button></div>' +
      '</div>';
    ov.addEventListener('click', function(e){ if (e.target === ov) closeModal(); });
    ov.querySelector('.fb-x').addEventListener('click', closeModal);
    ov.querySelector('.fb-cancel').addEventListener('click', closeModal);
    ov.querySelector('.fb-save').addEventListener('click', function(){ saveModal(ov, schema, list); });
    schema.columns.forEach(function(c){
      if (c.dep){
        var watchCtrl = ov.querySelector('[data-fb-key="' + c.dep.key + '"]');
        if (watchCtrl) watchCtrl.addEventListener('change', function(){ applyDeps(ov, schema); });
      }
    });
    wrap.appendChild(ov);
    applyDeps(ov, schema);
    var firstField = ov.querySelector('[data-fb-key]');
    if (firstField) firstField.focus();
  }

  function saveModal(modalEl, schema, list){
    var orig = editId ? list.find(function(r){ return r.id === editId; }) : null;
    var item = orig ? JSON.parse(JSON.stringify(orig)) : { id: uid() };
    var ok = true;
    schema.columns.forEach(function(c){
      var el = modalEl.querySelector('[data-fb-key="' + c.key + '"]');
      var errEl = modalEl.querySelector('[data-fb-err="' + c.key + '"]');
      var fieldWrap = modalEl.querySelector('[data-fb-field="' + c.key + '"]');
      if (errEl) errEl.textContent = '';
      fieldWrap.classList.remove('fb-invalid');
      var hidden = fieldWrap.classList.contains('fb-hidden');
      var v = el.value.trim();
      if (!hidden && c.required && !v){
        ok = false; fieldWrap.classList.add('fb-invalid'); if (errEl) errEl.textContent = 'Required';
        return;
      }
      item[c.key] = hidden ? '' : v;
    });
    if (!ok) return;
    if (schema.validate){
      var errs = schema.validate(item, editId);
      var bad = false;
      Object.keys(errs).forEach(function(k){
        var fieldWrap = modalEl.querySelector('[data-fb-field="' + k + '"]');
        var errEl = modalEl.querySelector('[data-fb-err="' + k + '"]');
        if (fieldWrap) fieldWrap.classList.add('fb-invalid');
        if (errEl) errEl.textContent = errs[k];
        bad = true;
      });
      if (bad) return;
    }
    if (editTable === 'checkouts' && !('returnedAt' in item)) item.returnedAt = null;
    if (editId){
      var ix = list.findIndex(function(r){ return r.id === editId; });
      list[ix] = item;
    } else {
      list.push(item);
    }
    closeModal();
    renderAll();
  }

  function markReturned(id){
    var c = checkouts.find(function(r){ return r.id === id; });
    if (c) c.returnedAt = new Date().toISOString().slice(0, 10);
    renderAll();
  }

  function renderAssets(){
    if (!assetsListEl.isConnected) return;
    if (!assets.length){ assetsListEl.innerHTML = '<p class="fb-empty">No assets yet.</p>'; return; }
    assetsListEl.innerHTML = assets.map(function(a){
      return '<div class="fb-row"><div class="fb-row-main"><span class="fb-row-title">' + esc(a.name) + '</span><span class="fb-row-sub">' + esc(a.category) + '</span></div>' +
        '<div class="fb-row-actions"><button type="button" class="fb-btn-sm" data-fb-edit-asset="' + a.id + '">Edit</button></div></div>';
    }).join('');
  }

  function renderCheckouts(){
    if (!checkoutsListEl.isConnected) return;
    if (!checkouts.length){ checkoutsListEl.innerHTML = '<p class="fb-empty">No checkouts yet.</p>'; return; }
    checkoutsListEl.innerHTML = checkouts.map(function(c){
      var asset = assets.find(function(a){ return a.id === c.assetId; });
      var name = asset ? asset.name : 'Unknown asset';
      var chip = c.returnedAt ? '<span class="fb-chip fb-ok">Returned ' + esc(c.returnedAt) + '</span>'
        : c.mode === 'Must be returned' ? '<span class="fb-chip fb-open">Due ' + esc(c.dueDate || '–') + '</span>'
        : '<span class="fb-chip fb-none">No return needed</span>';
      var returnBtn = (!c.returnedAt && c.mode === 'Must be returned') ? '<button type="button" class="fb-btn-sm" data-fb-return="' + c.id + '">Mark returned</button>' : '';
      return '<div class="fb-row"><div class="fb-row-main"><span class="fb-row-title">' + esc(name) + '</span><span class="fb-row-sub">' + esc(c.holder) + '</span></div>' +
        '<div class="fb-row-actions">' + chip + returnBtn + '<button type="button" class="fb-btn-sm" data-fb-edit-checkout="' + c.id + '">Edit</button></div></div>';
    }).join('');
  }

  function renderAll(){ renderAssets(); renderCheckouts(); }

  assetsListEl.addEventListener('click', function(e){
    var btn = e.target.closest('[data-fb-edit-asset]');
    if (btn) openModal('assets', btn.getAttribute('data-fb-edit-asset'));
  });
  checkoutsListEl.addEventListener('click', function(e){
    var editBtn = e.target.closest('[data-fb-edit-checkout]');
    var retBtn = e.target.closest('[data-fb-return]');
    if (editBtn) openModal('checkouts', editBtn.getAttribute('data-fb-edit-checkout'));
    else if (retBtn) markReturned(retBtn.getAttribute('data-fb-return'));
  });
  addAssetBtn.addEventListener('click', function(){ openModal('assets', null); });
  addCheckoutBtn.addEventListener('click', function(){ openModal('checkouts', null); });

  renderAll();
})();
</script>
</template>

<template class="pattern" data-title="KPI Sparkline" data-category="Components" data-source="Send Services, SendFood BMOR &amp; Metrics (index.html, sparkline() :1066, kpigrid :1162)" data-note="A KPI tile pairs a big current number with an inline SVG polyline sparkline (min/max scaled to its viewBox, last point marked with a dot) and a delta line comparing the last two points. sparkline() renders a designed 'not enough data' state under two points instead of guessing a line through nothing. deltaText() colours the delta by whether the metric's own goodDir (up or down) matches the actual movement, so a falling number can be the good outcome (e.g. average resolve time) while a rising one stays bad, without ever swapping which way the arrow points. Colour never carries the result alone, the arrow and the wording (e.g. an explicit &lsquo;no prior period&rsquo;) are always present too. Demo: SLA attainment (up is good), average resolve time (down is good, shown as a green down arrow), and a metric with only one data point (insufficient-data state on both the spark and the delta).">
<style>
.kp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:12px;width:100%;max-width:460px}
.kp-tile{background:var(--bg4);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.kp-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);font-weight:600}
.kp-value{font-size:20px;font-weight:650;color:var(--text);font-variant-numeric:tabular-nums}
.kp-delta{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:4px}
.kp-delta.kp-good{color:var(--green)}
.kp-delta.kp-bad{color:var(--red)}
.kp-delta.kp-flat{color:var(--text3)}
.kp-spark{width:100%;height:28px;display:block;margin-top:2px}
.kp-spark text{font-family:var(--font)}
</style>
<div class="kp-grid"></div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var gridEl = root.querySelector('.kp-grid');
  if (!gridEl) return;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Inline SVG polyline sparkline. Colour is written as a literal var(--x)
  // string into the SVG's own stroke/fill attributes (a CSS presentation
  // attribute), so the browser resolves and repaints it on a theme toggle
  // with no JS involved, same technique as the SVG Charts card.
  function sparkline(values, opts){
    opts = opts || {};
    var w = opts.w || 100, h = opts.h || 28, pad = 3;
    var present = values.filter(function(v){ return v != null; });
    if (present.length < 2){
      return '<svg class="kp-spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Not enough data"><text x="' + (w / 2) + '" y="' + (h / 2 + 4) + '" text-anchor="middle" font-size="10" fill="var(--text3)">not enough data</text></svg>';
    }
    var min = Math.min.apply(null, present), max = Math.max.apply(null, present);
    var span = (max - min) || 1;
    var stepX = (w - pad * 2) / (values.length - 1);
    var pts = values.map(function(v, i){
      if (v == null) return null;
      var x = pad + i * stepX;
      var y = h - pad - ((v - min) / span) * (h - pad * 2);
      return x.toFixed(1) + ',' + y.toFixed(1);
    });
    var color = opts.color || 'var(--accent)';
    var validPts = pts.filter(Boolean).join(' ');
    var lastPt = pts.filter(Boolean).pop();
    return '<svg class="kp-spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Trend">' +
      '<polyline points="' + validPts + '" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
      (lastPt ? '<circle cx="' + lastPt.split(',')[0] + '" cy="' + lastPt.split(',')[1] + '" r="2.2" fill="' + color + '"/>' : '') +
      '</svg>';
  }

  // goodDir: which movement direction is an improvement for this metric
  // ('up' for attainment, 'down' for a time-to-resolve metric). The arrow
  // always shows the ACTUAL direction, only the colour class encodes
  // good vs bad, and the class is 'flat' (no colour claim) when there is
  // no prior point to compare against.
  function deltaText(values, fmt, goodDir){
    var cur = values[values.length - 1];
    var prev = values.length >= 2 ? values[values.length - 2] : null;
    if (prev == null || cur == null) return { cls:'kp-flat', text:'no prior period' };
    var diff = cur - prev;
    var dir = diff > 0.0001 ? 'up' : diff < -0.0001 ? 'down' : 'flat';
    var arrow = dir === 'up' ? '↑' : dir === 'down' ? '↓' : '→';
    var cls = dir === 'flat' ? 'kp-flat' : (dir === (goodDir || 'up') ? 'kp-good' : 'kp-bad');
    return { cls:cls, text:arrow + ' ' + fmt(Math.abs(diff)) + ' vs last period' };
  }

  // Invented demo data, generic metric language, no BMOR data.
  var METRICS = [
    { label:'SLA attainment', values:[88, 89, 91, 90, 92, 92.4], cur:function(v){ return v.toFixed(1) + '%'; }, fmt:function(v){ return v.toFixed(1) + ' pts'; }, goodDir:'up' },
    { label:'Avg resolve time', values:[6.4, 5.9, 5.5, 5.1, 4.6, 4.2], cur:function(v){ return v.toFixed(1) + 'h'; }, fmt:function(v){ return v.toFixed(1) + 'h'; }, goodDir:'down' },
    { label:'New escalations', values:[7], cur:function(v){ return v.toFixed(0); }, fmt:function(v){ return v.toFixed(0); }, goodDir:'down' }
  ];

  function render(){
    if (!gridEl.isConnected) return;
    gridEl.innerHTML = METRICS.map(function(m){
      var cur = m.values[m.values.length - 1];
      var d = deltaText(m.values, m.fmt, m.goodDir);
      return '<div class="kp-tile"><div class="kp-label">' + esc(m.label) + '</div>' +
        '<div class="kp-value">' + m.cur(cur) + '</div>' +
        '<div class="kp-delta ' + d.cls + '">' + d.text + '</div>' +
        sparkline(m.values, { color:'var(--accent)' }) +
        '</div>';
    }).join('');
  }

  render();
})();
</script>
</template>

<template class="pattern" data-title="SLA Countdown" data-category="Flows" data-source="Send Services, SendFood Operations Portal (case-dashboard.html, working-hours SLA engine :748, renderCaseTabs() :828)" data-note="A working-hours-aware countdown (08:00–17:00 by default, every day) walks forward from a case's SLA start time in chunks, only counting the portion of each day inside the working window, so the clock genuinely pauses overnight instead of ticking down through hours nobody is working. Remaining time as a percentage of the case's own limit drives a graded badge (On track, At risk, Critical, Breached), text label plus colour together, never colour alone. A browser-tab-style strip lists every open case with its own live countdown and an unread-message count, clicking a tab switches the detail panel below. Demo uses whole-day offsets for its sample start times because, by the engine's own periodicity, a full day always contributes exactly one working window's worth of elapsed time regardless of what time of day the pattern happens to be viewed, so the three graded states shown here (breached, at risk, on track) are deterministic rather than luck-of-the-clock. The ticking interval checks isConnected every tick and clears itself the moment the card leaves the DOM (cycling the gallery's filter re-renders the card, so an old interval must never keep running against a detached node).">
<style>
.sl-wrap{width:100%;max-width:460px;display:flex;flex-direction:column;gap:10px}
.sl-tabbar{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.sl-tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:7px 10px;border-radius:var(--radius) var(--radius) 0 0;border:1px solid var(--border);border-bottom:2px solid transparent;background:var(--bg4);cursor:pointer;font-family:inherit;text-align:left;min-width:132px}
.sl-tab:hover{background:var(--bg3)}
.sl-tab.sl-active{border-bottom-color:var(--accent);background:var(--bg3)}
.sl-tab-title{font-size:11.5px;color:var(--text);font-weight:500;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.sl-unread{background:var(--accent);color:var(--onacc);font-size:9.5px;font-weight:700;border-radius:999px;padding:1px 6px;flex-shrink:0}
.sl-tab-sla{font-size:10.5px;font-weight:600}
.sl-tab-sla.sl-ok{color:var(--green)}
.sl-tab-sla.sl-warn{color:var(--amber)}
.sl-tab-sla.sl-bad{color:var(--red)}
.sl-panel{background:var(--bg4);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;display:flex;flex-direction:column;gap:8px}
.sl-panel-title{font-size:13px;font-weight:600;color:var(--text)}
.sl-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;width:fit-content}
.sl-badge.sl-ok{background:var(--green-soft);color:var(--green)}
.sl-badge.sl-warn{background:var(--amber-soft);color:var(--amber)}
.sl-badge.sl-bad{background:var(--red-soft);color:var(--red)}
.sl-meta{font-size:11px;color:var(--text3);line-height:1.4}
.sl-empty{padding:14px;text-align:center;color:var(--text2);font-size:12px}
</style>
<div class="sl-wrap">
  <div class="sl-tabbar"></div>
  <div class="sl-panel"></div>
</div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var wrap = root.querySelector('.sl-wrap');
  var tabbarEl = root.querySelector('.sl-tabbar');
  var panelEl = root.querySelector('.sl-panel');
  if (!wrap || !tabbarEl || !panelEl) return;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Working-hours engine: 08:00–17:00 local time, every day (no weekend
  // exclusion, matches the source's same-day working-hours model).
  var WS = 8 * 3600000, WE = 17 * 3600000, DAY = 24 * 3600000;
  function workingElapsed(fromMs, toMs){
    if (toMs <= fromMs) return 0;
    var elapsed = 0, t = fromMs, guard = 0;
    while (t < toMs && guard < 20000){
      guard++;
      var d = new Date(t);
      var tod = d.getHours() * 3600000 + d.getMinutes() * 60000 + d.getSeconds() * 1000 + d.getMilliseconds();
      if (tod < WS){ t += WS - tod; }
      else if (tod >= WE){ t += DAY - tod + WS; }
      else { var chunk = Math.min(WE - tod, toMs - t); elapsed += chunk; t += chunk; }
    }
    return elapsed;
  }

  var SLA_LIMITS = { P1: 4 * 3600000, P2: 8 * 3600000, P3: 24 * 3600000 };

  function fmtRemaining(ms){
    // Below zero, report how far past the limit the case is, rather than
    // repeating the word "Breached" a second time next to its own tier label.
    var over = ms <= 0;
    var abs = Math.abs(ms);
    var h = Math.floor(abs / 3600000), m = Math.floor((abs % 3600000) / 60000);
    return (h > 0 ? h + 'h ' : '') + m + 'm' + (over ? ' over' : ' left');
  }
  function slaTier(remMs, limMs){
    if (remMs <= 0) return { cls:'sl-bad', label:'Breached' };
    var p = remMs / limMs;
    if (p > 0.5) return { cls:'sl-ok', label:'On track' };
    if (p > 0.15) return { cls:'sl-warn', label:'At risk' };
    return { cls:'sl-bad', label:'Critical' };
  }

  // Whole-day offsets so the demo lands in the same graded tier regardless
  // of the real time of day the pattern is viewed at (see data-note).
  var DAY_MS = 86400000;
  var cases = [
    { id:'k1', title:'Order #4821, missing item', priority:'P1', unread:3, slaStartMs:Date.now() - 1 * DAY_MS },
    { id:'k2', title:'Refund dispute #4823', priority:'P3', unread:0, slaStartMs:Date.now() - 2 * DAY_MS },
    { id:'k3', title:'Late delivery #4825', priority:'P2', unread:1, slaStartMs:Date.now() - 20 * 60000 }
  ];
  var activeId = cases.length ? cases[0].id : null;

  function renderTabs(){
    if (!tabbarEl.isConnected) return;
    if (!cases.length){ tabbarEl.innerHTML = '<p class="sl-empty">No open cases.</p>'; return; }
    tabbarEl.innerHTML = cases.map(function(c){
      var lim = SLA_LIMITS[c.priority] || SLA_LIMITS.P2;
      var rem = lim - workingElapsed(c.slaStartMs, Date.now());
      var tier = slaTier(rem, lim);
      var unread = c.unread ? '<span class="sl-unread">' + c.unread + '</span>' : '';
      return '<button type="button" class="sl-tab' + (c.id === activeId ? ' sl-active' : '') + '" data-sl-tab="' + c.id + '">' +
        '<span class="sl-tab-title">' + esc(c.title) + unread + '</span>' +
        '<span class="sl-tab-sla ' + tier.cls + '">' + esc(tier.label) + ' · ' + esc(fmtRemaining(rem)) + '</span>' +
        '</button>';
    }).join('');
  }

  function renderPanel(){
    if (!panelEl.isConnected) return;
    var c = cases.find(function(x){ return x.id === activeId; });
    if (!c){ panelEl.innerHTML = '<p class="sl-empty">Select a case.</p>'; return; }
    var lim = SLA_LIMITS[c.priority] || SLA_LIMITS.P2;
    var rem = lim - workingElapsed(c.slaStartMs, Date.now());
    var tier = slaTier(rem, lim);
    panelEl.innerHTML =
      '<div class="sl-panel-title">' + esc(c.title) + '</div>' +
      '<span class="sl-badge ' + tier.cls + '">' + esc(tier.label) + ' · ' + esc(fmtRemaining(rem)) + '</span>' +
      '<div class="sl-meta">Priority ' + esc(c.priority) + '. The SLA clock only runs 08:00–17:00, so it pauses overnight and resumes the next working day.</div>';
  }

  function renderAll(){ renderTabs(); renderPanel(); }

  tabbarEl.addEventListener('click', function(e){
    var btn = e.target.closest('[data-sl-tab]');
    if (!btn) return;
    activeId = btn.getAttribute('data-sl-tab');
    renderAll();
  });

  renderAll();

  // Self-terminating tick: stops and clears itself the moment this card's
  // root leaves the DOM, so cycling the gallery's filter never stacks a
  // second interval on top of a fresh render of the same pattern.
  var timer = setInterval(function(){
    if (!wrap.isConnected){ clearInterval(timer); return; }
    renderAll();
  }, 1000);
})();
</script>
</template>

<template class="pattern" data-title="Inline Comments" data-category="Flows" data-source="Send Services, SendOS Ops Portal (index.html, per-section comment boxes plus copy-all panel, lines 211 to 259)" data-note="Every section of a long document gets its own optional comment box (a toggle button reveals a textarea), so feedback stays anchored to the section it is about instead of one big free-text field at the bottom. A floating action button carries a live count of sections with a comment. 'Copy comments' assembles every non-empty comment into one pasteable markdown block (a heading per section, then its comment text) and always shows that assembled text in a visible, selectable box: a Clipboard API write is attempted first, a document.execCommand select-and-copy fallback runs if that fails or is unavailable (both are commonly blocked on file://), so the text is always readable and copyable one way or another, never gated behind a silent clipboard success. This demo keeps comments in memory only. A real implementation persists them to their own namespaced localStorage key, JSON-stringified inside a try/catch, the same doctrine as the Undo Snapshot and Sync Engine cards.">
<style>
.ic-wrap{position:relative;width:100%;max-width:460px;display:flex;flex-direction:column;gap:10px;padding-bottom:8px}

.ic-panel{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:360px;max-height:100%;box-shadow:var(--shadow-2);display:flex;flex-direction:column}
.ic-panel-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}

.ic-md{width:100%;min-height:160px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius);padding:9px;white-space:pre-wrap;resize:vertical}
