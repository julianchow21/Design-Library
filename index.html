<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f17">
<title>Kujira Design Library</title>
<link rel="stylesheet" href="tokens.css?v=0.1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-weight:360;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;transition:background var(--dur) ease-out,color var(--dur) ease-out}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}

/* TOPBAR, kept solid on purpose, no backdrop-filter (see starter CLAUDE.md gotchas) */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:100}
.logo{font-weight:700;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;cursor:pointer;color:var(--text);background:none;border:none}
.logo-mark{height:26px;width:26px;flex-shrink:0}
.logo-name{background:linear-gradient(135deg,var(--accent),var(--grad-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.spacer{flex:1}
.ver{font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums;padding:3px 8px;border:1px solid var(--border);border-radius:999px;white-space:nowrap}
.icon-btn{width:32px;height:32px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:background var(--dur) ease-out,color var(--dur) ease-out,transform var(--dur) var(--spring);flex-shrink:0;font-size:15px}
.icon-btn:hover{background:var(--bg4);color:var(--text)}
.icon-btn:active{transform:scale(.92)}

/* MAIN */
.main{padding:20px;max-width:1100px;margin:0 auto}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head-row h1{font-size:18px;font-weight:680;letter-spacing:-.01em}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:12px;font-weight:500;transition:background var(--dur) ease-out,color var(--dur) ease-out,border-color var(--dur) ease-out}
.chip:hover{background:var(--bg4);color:var(--text)}
.chip.active{background:linear-gradient(135deg,var(--accent),var(--grad-2));border-color:transparent;color:var(--onacc)}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}

/* CARD */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-1);display:flex;flex-direction:column;min-width:0}
.card-demo{background:var(--bg3);border-bottom:1px solid var(--border);padding:24px;display:flex;align-items:center;justify-content:center;min-height:140px;overflow:auto}
.card-body{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card-title{font-size:14px;font-weight:640;letter-spacing:-.01em;overflow-wrap:anywhere;min-width:0}
.category-chip{flex-shrink:0;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding:3px 9px;border-radius:999px;white-space:nowrap}
.category-chip.components{background:var(--blue-soft);color:var(--blue)}
.category-chip.flows{background:var(--green-soft);color:var(--green)}
.category-chip.systems{background:var(--amber-soft);color:var(--amber)}
.category-chip.utilities{background:var(--accent-soft);color:var(--accent)}
.card-note{font-size:12px;color:var(--text2);overflow-wrap:anywhere}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px;border-top:1px solid var(--border);margin-top:4px}
.card-source{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.btn{padding:7px 13px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg3);color:var(--text);cursor:pointer;font-size:12px;font-weight:500;transition:background var(--dur) ease-out,border-color var(--dur) ease-out,transform var(--dur) var(--spring);white-space:nowrap;flex-shrink:0}
.btn:hover{background:var(--bg4)}
.btn:active{transform:scale(.96)}
.btn.copied{background:var(--green-soft);border-color:var(--green);color:var(--green)}

/* STATE PANEL (empty), same conventions as the starter */
@keyframes state-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.state{padding:56px 20px;text-align:center;color:var(--text2);animation:state-in var(--dur) var(--spring);grid-column:1/-1}
.state h3{font-size:16px;color:var(--text);margin-bottom:6px;font-weight:680;letter-spacing:-.01em}
.state p{font-size:13px;max-width:340px;margin:0 auto}
.state-scene{margin:0 auto 14px;display:block}
.state-scene .ss-a{fill:var(--accent);opacity:.22}
.state-scene .ss-b{fill:var(--grad-2);opacity:.22}
.state-scene .ss-c{fill:var(--pop);opacity:.32}
.hidden{display:none!important}

/* MOBILE, kept after base rules on purpose (see starter CLAUDE.md gotchas) */
@media(max-width:640px){
  .main{padding:12px}
  .logo-name{display:none}
  .ver{display:none}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo" onclick="location.reload()">
    <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--grad-2)"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg)"/><circle cx="12" cy="18" r="2.2" fill="#fff" opacity=".95"/><circle cx="19.5" cy="11.5" r="3.2" fill="#fff" opacity=".95"/><circle cx="21.5" cy="20" r="1.5" fill="#fff" opacity=".85"/></svg>
    <span class="logo-name">Design Library</span>
  </div>
  <div class="spacer"></div>
  <span class="ver">v1.13 (8 Oct)</span>
  <button class="icon-btn" id="theme-btn" title="Toggle theme" onclick="toggleTheme()">◐</button>
</header>

<main class="main">
  <div class="head-row">
    <h1>Patterns</h1>
    <div class="filters" id="filters" role="tablist" aria-label="Category filter"></div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<!-- ============================================================================
     PATTERN SOURCE, one <template class="pattern"> per pattern. Rendered by the
     gallery script below. See CLAUDE.md, "How to add a pattern".
     data-title, data-category (Components|Flows), data-source, data-note.
     ========================================================================== -->

<template class="pattern" data-title="Designed Empty State" data-category="Flows" data-source="App Starter (house) plus Personal Finance Spending (index.html, #empty onboarding markup at 169-178, .state CSS at 113-120)" data-note="Use whenever a list, table or search can legitimately return zero rows. Never leave a blank panel: name the state, explain why it is empty, and give the one action that fixes it. Two variants shown. Generic empty list (top): the original doctrine, a short named state plus one fix action. Onboarding / first-run (bottom): for the specific case of an app with no data source connected yet, where 'add your first record' alone is not enough, it adds numbered steps spelling out exactly how to get data in before the call-to-action.">
<style>
.dp-demo{display:flex;flex-direction:column;gap:20px;width:100%;max-width:340px}
.dp-block-label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);font-weight:600;margin-bottom:2px}
.dp-empty{padding:40px 16px;text-align:center;color:var(--text2);width:100%}
.dp-empty h3{font-size:15px;color:var(--text);margin-bottom:6px;font-weight:680;letter-spacing:-.01em}
.dp-empty p{font-size:12px;max-width:280px;margin:0 auto 12px}
.dp-scene{margin:0 auto 12px;display:block}
.dp-scene .a{fill:var(--accent);opacity:.22}
.dp-scene .b{fill:var(--grad-2);opacity:.22}
.dp-scene .c{fill:var(--pop);opacity:.32}
.dp-btn{padding:8px 14px;border-radius:var(--radius);border:none;background:linear-gradient(135deg,var(--accent),var(--grad-2));color:var(--onacc);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;transition:filter var(--dur) ease-out,transform var(--dur) var(--spring)}
.dp-btn:hover{filter:brightness(1.06)}
.dp-btn:active{transform:scale(.96)}
.dp-onb{padding:32px 16px;text-align:center;color:var(--text2);width:100%;background:var(--bg4);border-radius:var(--radius-lg)}
.dp-onb-icon{font-size:26px;color:var(--text3);opacity:.8;margin-bottom:8px}
.dp-onb h3{font-size:14px;color:var(--text);margin-bottom:6px;font-weight:640}
.dp-onb p{font-size:12px;max-width:280px;margin:0 auto 10px}
.dp-steps{text-align:left;max-width:280px;margin:0 auto 12px;font-size:12px;color:var(--text2);display:flex;flex-direction:column;gap:6px}
.dp-steps b{color:var(--text)}
</style>
<div class="dp-demo">
  <div class="dp-block">
    <div class="dp-block-label">Empty list</div>
    <div class="dp-empty">
      <svg class="dp-scene" viewBox="0 0 120 90" width="72" aria-hidden="true"><circle class="a" cx="30" cy="60" r="22"/><rect class="b" x="55" y="18" width="46" height="46" rx="14"/><circle class="c" cx="94" cy="66" r="10"/></svg>
      <h3>No items yet</h3>
      <p>Add your first record to get started.</p>
      <button class="dp-btn" type="button">+ Add item</button>
    </div>
  </div>
  <div class="dp-block">
    <div class="dp-block-label">Onboarding (first run)</div>
    <div class="dp-onb">
      <div class="dp-onb-icon" aria-hidden="true">&empty;</div>
      <h3>No data loaded yet</h3>
      <p>There are two ways to get your records in:</p>
      <div class="dp-steps">
        <div><b>1.</b> Drop a data file next to this app and reload, or</div>
        <div><b>2.</b> Use <b>Import data</b> above to load an export.</div>
      </div>
      <button class="dp-btn" type="button">Import data</button>
    </div>
  </div>
</div>
</template>

    var n = bin.length >> 1;
    var out = new Float32Array(n * 3); // packs x0,y,z0 (pre-rotation unit vector)
    for (var i = 0; i < n; i++){
      var latB = bin.charCodeAt(i*2), lonB = bin.charCodeAt(i*2+1);
      var lat = (latB/255*180-90) * Math.PI/180;
      var lon = (lonB/255*360-180) * Math.PI/180;
      var cl = Math.cos(lat);
      out[i*3]   = cl*Math.sin(lon);
      out[i*3+1] = Math.sin(lat);
      out[i*3+2] = cl*Math.cos(lon);
    }
    return out;
  }
  var dots = decodeDots(DOTS_B64);
  var dotCount = dots.length / 3;

  function toVec(latDeg, lonDeg){
    var lat = latDeg*Math.PI/180, lon = lonDeg*Math.PI/180, cl = Math.cos(lat);
    return [cl*Math.sin(lon), Math.sin(lat), cl*Math.cos(lon)];
  }
  // Plausible major-city coordinates, decorative only.
  var CITIES = [
    [40.71,-74.01],  // New York
    [51.51,-0.13],   // London
    [35.68,139.69],  // Tokyo
    [-33.87,151.21], // Sydney
    [-23.55,-46.63], // Sao Paulo
    [30.04,31.24],   // Cairo
    [19.08,72.88]    // Mumbai
  ];
  var markers = CITIES.map(function(c){ return toVec(c[0], c[1]); });
  var ARCS = [[0,1],[1,5],[2,6],[3,4]]; // NY-London, London-Cairo, Tokyo-Mumbai, Sydney-SaoPaulo

  var reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Colours read from tokens.css only, re-read whenever the theme toggles.
  var colors = {};
  function readColors(){
    var cs = getComputedStyle(document.documentElement);
    colors.accent  = cs.getPropertyValue('--accent').trim();
    colors.accent2 = cs.getPropertyValue('--accent2').trim();
    colors.pop     = cs.getPropertyValue('--pop').trim();
  }
  readColors();
  function hexToRgb(hex){
    hex = hex.replace('#','');
    if (hex.length === 3) hex = hex.split('').map(function(c){ return c+c; }).join('');
    var num = parseInt(hex, 16);
    return [(num>>16)&255, (num>>8)&255, num&255];
  }
  function rgba(hex, a){
    var c = hexToRgb(hex);
    return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
  }

  var DISPLAY = 280;
  function setupCanvas(){
    var dpr = window.devicePixelRatio || 1;
    canvas.width = DISPLAY*dpr;
    canvas.height = DISPLAY*dpr;
    canvas.style.width = DISPLAY+'px';
    canvas.style.height = DISPLAY+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  setupCanvas();

  var R = DISPLAY*0.36, cx = DISPLAY/2, cy = DISPLAY/2;
  var theta = 0, last = null, dirty = true;

  function drawArc(v1, v2, cosT, sinT){
    var d = v1[0]*v2[0]+v1[1]*v2[1]+v1[2]*v2[2];
    d = Math.max(-1, Math.min(1, d));
    var ang = Math.acos(d);
    if (ang < 0.001) return;
    var segs = 28, started = false;
    ctx.beginPath();
    for (var s = 0; s <= segs; s++){
      var tt = s/segs;
      var a = Math.sin((1-tt)*ang)/Math.sin(ang);
      var b = Math.sin(tt*ang)/Math.sin(ang);
      var lift = 1 + 0.14*Math.sin(tt*Math.PI); // bulge outward, flight-path look
      var vx = (a*v1[0]+b*v2[0])*lift, vy = (a*v1[1]+b*v2[1])*lift, vz = (a*v1[2]+b*v2[2])*lift;
      var x = vx*cosT + vz*sinT, z = -vx*sinT + vz*cosT, y = vy;
      var depth = (z+1)/2;
      var px = cx + x*R, py = cy - y*R;
      if (depth < 0.12){ started = false; continue; }
      if (!started){ ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
    }
    ctx.strokeStyle = rgba(colors.accent, 0.4);
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawFrame(ts){
    ctx.clearRect(0, 0, DISPLAY, DISPLAY);
    var cosT = Math.cos(theta), sinT = Math.sin(theta);

    var glow = ctx.createRadialGradient(cx, cy, R*0.2, cx, cy, R*1.5);
    glow.addColorStop(0, rgba(colors.accent, 0.28));
    glow.addColorStop(1, rgba(colors.accent, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, DISPLAY, DISPLAY);

    var projected = new Array(dotCount);
    for (var i = 0; i < dotCount; i++){
      var x0 = dots[i*3], y = dots[i*3+1], z0 = dots[i*3+2];
      var x = x0*cosT + z0*sinT, z = -x0*sinT + z0*cosT;
      projected[i] = { x: cx + x*R, y: cy - y*R, depth: (z+1)/2 };
    }
    projected.sort(function(a, b){ return a.depth - b.depth; }); // back-to-front
    for (i = 0; i < dotCount; i++){
      var p = projected[i];
      var rr = 0.55 + p.depth*1.15;
      var a2 = 0.12 + p.depth*0.75;
      ctx.beginPath();
      ctx.fillStyle = rgba(colors.accent2, a2);
      ctx.arc(p.x, p.y, rr, 0, Math.PI*2);
      ctx.fill();
    }

    ARCS.forEach(function(pair){ drawArc(markers[pair[0]], markers[pair[1]], cosT, sinT); });

    markers.forEach(function(m, idx){
      var x = m[0]*cosT + m[2]*sinT, z = -m[0]*sinT + m[2]*cosT, y = m[1];
      var depth = (z+1)/2;
      if (depth < 0.12) return;
      var mx = cx + x*R, my = cy - y*R;
      ctx.beginPath();
      ctx.fillStyle = rgba(colors.pop, 0.55 + depth*0.45);
      ctx.arc(mx, my, 2.2, 0, Math.PI*2);
      ctx.fill();
      if (!reduceMotion){
        var phase = ((ts/1600) + idx/markers.length) % 1;
        var pr = 2.2 + phase*10, pa = (1-phase)*0.5*depth;
        ctx.beginPath();
        ctx.strokeStyle = rgba(colors.pop, pa);
        ctx.lineWidth = 1.2;
        ctx.arc(mx, my, pr, 0, Math.PI*2);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.strokeStyle = rgba(colors.pop, 0.35*depth);
        ctx.lineWidth = 1;
        ctx.arc(mx, my, 5, 0, Math.PI*2);
        ctx.stroke();
      }
    });
  }

  // Single rAF loop. Lifecycle safety: checks canvas.isConnected every frame
  // and stops itself (and disconnects the colour observer) the moment this
  // card's canvas leaves the DOM, e.g. because a filter click re-rendered
  // the grid. Idempotent: every instance owns only its own closured state,
  // so cycling filters repeatedly never stacks loops or leaks past instances.
  function loop(ts){
    if (!canvas.isConnected){ mo.disconnect(); return; }
    if (!reduceMotion){
      if (last == null) last = ts;
      theta += (ts - last) * 0.00012; // slow continuous Y-axis rotation
      last = ts;
      drawFrame(ts);
    } else if (dirty){
      drawFrame(ts);   // one static frame: no rotation, no pulse
      dirty = false;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // Theme toggle recolours the globe live (re-reads tokens.css on change).
  var mo = new MutationObserver(function(){ readColors(); dirty = true; });
  mo.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
})();
</script>
</template>

<template class="pattern" data-title="Launch Intro" data-category="Flows" data-source="Kujira Collectibles v3.23 (features.js, the Launch intro IIFE)" data-note="Full-screen splash that boots the app behind it, progressively enhancing from this CSS-only greeting into a WebGL scene via a lazy vendored import, with a hard ceiling and instant tap/key skip. This card demos only the CSS-only fallback tier, played full-screen (click anywhere in the panel to run the dissolve/greet splash). The full pattern, architecture, kill-switch chain, teardown checklist, asset pipeline, service worker integration, scene notes and verification gotchas, is in Launch Intro.md in this folder, too large for a single card.">
<style>
.li-box{width:260px;height:150px;border-radius:var(--radius-lg);position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--bg4),var(--bg2));transition:opacity 0.25s ease,transform 0.25s ease}
.li-box.li-out{opacity:0.15;transform:scale(1.03)}
/* Immediate tap feedback, fast and distinct from the slower li-out
   dissolve, so a tap reads as registered before the fade cycle even starts. */
.li-box.li-tap{opacity:0.7;transform:scale(0.97)}
.li-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--grad-2));opacity:0;transition:opacity 0.4s ease}
.li-mark.li-show{opacity:1}
/* Idle pulse only applies once the card is resting in the finished greet
   state (li-rest), and only animates transform, never opacity, so it can
   never fight the dissolve/greet opacity transition above. */
.li-mark.li-rest{animation:li-pulse 2.6s ease-in-out infinite}
.li-hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);opacity:0.5}
@keyframes li-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media(prefers-reduced-motion:reduce){ .li-mark.li-rest{animation:none} }
/* Full-screen splash overlay: created and owned entirely by the script
   below, appended to document.body (never inside the card), so it is
   never clipped by the card's own overflow:hidden and is fully portable
   (no gallery-shell class references). Token-based background, mirrors
   the card's own look at full scale, see Launch Intro.md for the real
   pattern this demos (the CSS-only fallback tier, played full-screen). */
.li-overlay{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background:linear-gradient(160deg,var(--bg4),var(--bg2));opacity:1;transition:opacity 0.25s ease,transform 0.25s ease}
.li-overlay.li-overlay-out{opacity:0;transform:scale(1.03);pointer-events:none}
.li-mark-lg{width:96px;height:96px;border-radius:26px;background:linear-gradient(135deg,var(--accent),var(--grad-2));opacity:0;transition:opacity 0.4s ease}
.li-mark-lg.li-show{opacity:1}
.li-mark-lg.li-rest{animation:li-pulse 2.6s ease-in-out infinite}
.li-skip-hint{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom));text-align:center;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);opacity:0.5;user-select:none}
@media(prefers-reduced-motion:reduce){
  .li-overlay{transition:opacity 0.2s linear}
  .li-overlay.li-overlay-out{transform:none}
  .li-mark-lg{animation:none}
}
</style>
<div class="li-box" role="button" tabindex="0" aria-label="Play launch intro splash">
  <div class="li-mark"></div>
  <div class="li-hint">tap to replay</div>
</div>
<script>
(function(){
  // Finds its own root relative to itself, never a global id, so several
  // instances (or repeated re-renders from the filter cycle) never collide.
  var script = document.currentScript;
  var root = script.parentElement;
  var box = root.querySelector('.li-box');
  var mark = root.querySelector('.li-mark');
  if (!box || !mark) return;
  var reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timers = [];
  var tapDimTimer = null; // separate from the cycle's own timers, never cleared by clearTimers()

  function clearTimers(){ timers.forEach(function(id){ clearTimeout(id); }); timers.length = 0; }

  // One static frame under reduced motion: greeting shown, no cycle, no
  // dissolve, no pulse. Tap re-applies the same instant state, never jarring.
  function showStatic(){
    clearTimers();
    box.classList.remove('li-out');
    mark.classList.remove('li-rest');
    mark.classList.add('li-show');
  }

  // Plays the dissolve/greet cycle once, then rests in the finished greet
  // state (mark visible, idle pulse on). Runs once on load and again on
  // every tap, it never re-arms itself, so the card is idle unless tapped.
  function playCycle(){
    if (!box.isConnected){ clearTimers(); return; } // self-terminating: element left the DOM
    clearTimers();
    if (reduceMotion){ showStatic(); return; }

    // Start from hidden (a real dip if a prior cycle left the mark shown).
    mark.classList.remove('li-rest');
    mark.classList.remove('li-show');
    box.classList.remove('li-out');

    timers.push(setTimeout(function(){
      if (!box.isConnected) return;
      mark.classList.add('li-show'); // greeting fades in, mirrors the kill-switch fallback
    }, 450)); // past the 0.4s fade-out above, so a replay from resting fully dips first
    timers.push(setTimeout(function(){
      if (!box.isConnected) return;
      mark.classList.remove('li-show'); // mark itself dissolves out
      box.classList.add('li-out'); // box dissolve flourish, mirrors teardown
    }, 1650));
    timers.push(setTimeout(function(){
      if (!box.isConnected) return;
      box.classList.remove('li-out');
      mark.classList.add('li-show'); // greets again, fading back in to rest here
      mark.classList.add('li-rest'); // idle pulse (transform only) once resting
    }, 2250));
  }

  // ===== Full-screen splash overlay =====
  // Tapping the demo plays the CSS-only fallback tier full-screen, the way
  // Launch Intro.md describes the real app-boot splash, not the miniature
  // in-card cycle. Fully self-contained: created, owned and torn down by
  // this one call, independent of `root`/`box`/`mark` staying connected,
  // so a gallery re-render (filter cycle) can never orphan it. Mirrors
  // Launch Intro.md's teardown checklist (idempotent single "already
  // removed" flag, every listener removed, every timer cleared) and its
  // hard ceiling (force-removed no matter what).
  var HARD_CEILING_MS = 6000;
  function openOverlay(){
    // Never stack: one overlay only, checked in the DOM itself (not a
    // closured flag) so ANY render's instance sees an overlay any other
    // instance already opened. A repeat tap while one is open is ignored.
    if (document.querySelector('.li-overlay')) return;

    var ov = document.createElement('div');
    ov.className = 'li-overlay';
    ov.setAttribute('role', 'dialog');
    ov.setAttribute('aria-label', 'Launch intro splash demo, tap or press Escape to skip');
    var ovMark = document.createElement('div');
    ovMark.className = 'li-mark-lg';
    var ovHint = document.createElement('div');
    ovHint.className = 'li-skip-hint';
    ovHint.textContent = 'tap or press esc to skip';
    ov.appendChild(ovMark);
    ov.appendChild(ovHint);
    document.body.appendChild(ov);

    var ovReduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var ovTimers = [];
    var ending = false, removed = false;

    function clearOvTimers(){ ovTimers.forEach(function(id){ clearTimeout(id); }); ovTimers.length = 0; }

    // Idempotent teardown: single "already removed" flag, every listener
    // removed, every timer cleared, node removed from the DOM.
    function teardown(){
      if (removed) return;
      removed = true;
      clearOvTimers();
      ov.removeEventListener('click', onSkip);
      document.removeEventListener('keydown', onKey);
      if (ov.parentNode) ov.parentNode.removeChild(ov);
    }

    // Dissolve then teardown, the same path for a natural end or a skip.
    function dissolveOut(){
      if (ending) return;
      ending = true;
      clearOvTimers(); // disarms the hard ceiling and any pending cycle steps, we're committed now
      if (ov.isConnected) ov.classList.add('li-overlay-out');
      ovTimers.push(setTimeout(teardown, 400));
    }

    // Instant skip: tap/click on the overlay or Escape/Enter/Space, always
    // converges on the same teardown as the natural end (never a hard cut).
    function onSkip(){ dissolveOut(); }
    function onKey(e){
      if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' '){
        if (e.key === ' ') e.preventDefault();
        onSkip();
      }
    }
    ov.addEventListener('click', onSkip);
    document.addEventListener('keydown', onKey);

    // Hard ceiling: force-removed no matter what state the cycle is in.
    ovTimers.push(setTimeout(teardown, HARD_CEILING_MS));

    if (ovReduceMotion){
      // Reduced motion: no dissolve/greet theatrics, per Launch Intro.md's
      // kill-switch chain (every kill-switch path, incl. reduced-motion,
      // shows the static CSS greeting for a short fixed duration then
      // dissolves). Tap/key still skips it early, never jarring either way.
      ovMark.classList.add('li-show');
      ovTimers.push(setTimeout(dissolveOut, 1200));
      return;
    }

    // Full dissolve/greet cycle at full scale, mirrors the in-card cycle's
    // own timing, then dissolves the whole overlay away on its own.
    ovTimers.push(setTimeout(function(){
      if (!ov.isConnected) return;
      ovMark.classList.add('li-show'); // greeting fades in
    }, 250));
    ovTimers.push(setTimeout(function(){
      if (!ov.isConnected) return;
      ovMark.classList.remove('li-show'); // mark dissolves out
    }, 1650));
    ovTimers.push(setTimeout(function(){
      if (!ov.isConnected) return;
      ovMark.classList.add('li-show'); // greets again
      ovMark.classList.add('li-rest'); // idle pulse, resting beat before the overlay itself dissolves
    }, 2200));
    ovTimers.push(setTimeout(dissolveOut, 2950));
  }

  function onTap(){
    // Fast, immediate feedback that the tap registered, independent of the
    // overlay opening a beat later (so a tap never reads as a no-op).
    box.classList.add('li-tap');
    clearTimeout(tapDimTimer);
    tapDimTimer = setTimeout(function(){ if (box.isConnected) box.classList.remove('li-tap'); }, 140);
    openOverlay();
  }
  // Bound to root, not just the 260x150 box, so any tap in the demo area's
  // padding opens the splash too. Root already includes the box (event
  // bubbles), so this single listener is enough, no double-firing.
  root.style.cursor = 'pointer'; // affordance for the full clickable region
  root.addEventListener('click', onTap);
  // Keyboard stays on the box itself (it owns the role="button"/tabindex).
  box.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){
      if (e.key === ' ') e.preventDefault(); // stop the page scrolling on Space
      // The opening keystroke must not reach the overlay's own document
      // keydown listener (added inside onTap), or it skips itself instantly.
      e.stopPropagation();
      onTap();
    }
  });

  playCycle(); // in-card resting preview only, plays once then rests (mark pulsing, hint shown)
})();
</script>
</template>

<template class="pattern" data-title="Month Calendar" data-category="Components" data-source="Journal (lib/kjr-calendar.js)" data-note="Config-driven month-calendar engine: the engine owns the grid, week-start rotation, nav and roving-tabindex keyboard nav (arrow keys, Enter, PageUp/Down move month). The app injects hooks only, getEvents(startISO,endISO) plus a renderChips(iso,events,ctx) or renderCell override, never forks the grid logic. Canonical vendored copy lives in lib/kjr-calendar.js, configured per app. Click a day then use the arrow keys.">
<style>
.mc-wrap{width:100%;max-width:420px}
.mc-chip{display:inline-flex;align-items:center;gap:3px;max-width:100%;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--accent-soft);color:var(--accent)}

<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var mount = root.querySelector('.mc-mount');
  if (!mount) return;

  // Loads a vendored lib/ script once (id-guarded), waits for it if another
  // instance already kicked off the load, then mounts. Never fetch(): a
  // plain <script src> load works from file:// where fetch() does not.
  function loadLib(src, ready, cb){
    if (ready()) { cb(); return; }
    var existing = document.querySelector('script[data-pl-lib="'+src+'"]');
    if (existing){ existing.addEventListener('load', cb); if (ready()) cb(); return; }
    var s = document.createElement('script');
    s.src = src; s.dataset.plLib = src;
    s.onload = cb;
    document.head.appendChild(s);
  }

  loadLib('lib/kjr-format.js?v=1.2', function(){ return !!window.KjrFmt; }, function(){
    loadLib('lib/kjr-calendar.js?v=1.0', function(){ return !!window.KjrCalendar; }, function(){
      if (!mount.isConnected || !window.KjrCalendar) return; // card left the DOM (filter cycled) or lib failed
      mountDemo();
    });
  });

  function mountDemo(){
    // Invented sample events, no Journal trade data.
    var today = new Date();
    function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
    var labels = ['Standup','Design review','Ship v2.1','Retro','Planning'];
    var sample = {};
    [2,5,11,18,-3].forEach(function(off,i){
      var d = new Date(today.getFullYear(), today.getMonth(), today.getDate()+off);
      sample[iso(d)] = [{ label: labels[i] }];
    });
    KjrCalendar.mount(mount, {
      title: 'Team calendar',
      weekStart: 1,
      getEvents: function(s,e){ var out={}; Object.keys(sample).forEach(function(k){ if (k>=s && k<=e) out[k]=sample[k]; }); return out; },
      // Custom renderChips hook: this app's own chip markup, the engine
      // just hands events back and escapes nothing for you.
      renderChips: function(iso, events, ctx){
        return events.map(function(ev){ return '<span class="mc-chip">'+ctx.esc(ev.label)+'</span>'; }).join('');
      }
    });
  }
})();
</script>

.ts-toast-row{display:flex;align-items:center;gap:12px}

@keyframes ts-pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){ .ts-toast{animation:none} }
</style>
<div class="ts-demo">
  <div class="ts-btns">
    <button type="button" class="ts-btn" data-ts-fire="ok">Fire toast</button>
    <button type="button" class="ts-btn" data-ts-fire="err">Fire error toast</button>
  </div>
  <div class="ts-list">
    <div class="ts-row"><span class="ts-row-label">Renew passport</span><button type="button" class="ts-btn ts-remove">Remove</button></div>
    <div class="ts-row"><span class="ts-row-label">Book dentist appointment</span><button type="button" class="ts-btn ts-remove">Remove</button></div>
    <div class="ts-row"><span class="ts-row-label">Water the plants</span><button type="button" class="ts-btn ts-remove">Remove</button></div>
  </div>
  <div class="ts-stack" aria-live="polite"></div>
</div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var stack = root.querySelector('.ts-stack');
  if (!stack) return;
  var fireBtns = root.querySelectorAll('[data-ts-fire]');
  var list = root.querySelector('.ts-list');

  function autoDismiss(el, ms){
    setTimeout(function(){
      if (!el.isConnected) return;
      el.classList.add('ts-out');
      setTimeout(function(){ if (el.isConnected) el.remove(); }, 220); // just past --dur's 180ms fade
    }, ms);
  }

  function fire(kind){
    if (!stack.isConnected) return;
    var el = document.createElement('div');
    el.className = 'ts-toast' + (kind==='err' ? ' ts-err' : '');
    el.textContent = kind==='err' ? 'Could not save, try again' : 'Saved';
    stack.appendChild(el);
    autoDismiss(el, kind==='err' ? 3200 : 1800);
  }
  fireBtns.forEach(function(b){ b.addEventListener('click', function(){ fire(b.getAttribute('data-ts-fire')); }); });

  // Undo-action toast, the Portfolio showToast(msg,kind,action) shape: built
  // from real nodes, never innerHTML, so the label text can never break the
  // markup, the action itself only ever runs from a real click, never a string.
  function fireUndo(msg, onUndo){
    if (!stack.isConnected) return;
    var el = document.createElement('div');
    el.className = 'ts-toast';
    var row = document.createElement('div'); row.className = 'ts-toast-row';
    var span = document.createElement('span'); span.textContent = msg;
    var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'ts-undo'; btn.textContent = 'Undo';
    var undone = false;
    btn.addEventListener('click', function(){
      if (undone) return;
      undone = true;
      el.remove();
      onUndo();
    });
    row.append(span, btn);
    el.appendChild(row);
    stack.appendChild(el);
    autoDismiss(el, 6000);
  }

  if (list){
    [...list.querySelectorAll('.ts-row')].forEach(function(row){
      var removeBtn = row.querySelector('.ts-remove');
      var label = row.querySelector('.ts-row-label');
      if (!removeBtn || !label) return;
      removeBtn.addEventListener('click', function(){
        if (!row.isConnected) return;
        var text = label.textContent;
        var anchor = row.nextElementSibling;
        row.remove();
        fireUndo('Removed ' + text, function(){
          if (anchor && anchor.isConnected) list.insertBefore(row, anchor);
          else list.appendChild(row);
        });
      });
    });
  }
})();
</script>
</template>

<template class="pattern" data-title="Modal Shell" data-category="Components" data-source="Forex (index.html, .overlay/.modal CSS plus field()/frow() builders)" data-note="Overlay plus centred modal, closed by the X, Cancel, or a click on the overlay itself (checks event.target===this on the overlay's own click handler, so a click inside the modal never bubbles up to close it). field()/frow() are small string builders for a labelled input with its own error slot, reused for every form in the app. This demo scopes the overlay to the card instead of the full viewport, so it cannot leak past a filter re-render. The scrim colour (rgba(0,0,0,.55)) is a deliberate exception to tokens-only, matching Forex's own source: a modal scrim needs to darken whatever is behind it the same way regardless of the page's light/dark theme, the same reasoning Launch Intro.md documents for its fixed brand gradient.">

<template class="pattern" data-title="SVG Charts" data-category="Components" data-source="Journal (index.html, svgEquity/svgDualEquity/svgDrawdown)" data-note="Three pure functions, a number array in, an inline SVG path string out. No chart library: min/max scale the array to a viewBox, join points into a single path 'd' string, fill the area under it at low opacity for a glow. Colour is sign-driven, reads var(--green) or var(--red) straight into the stroke attribute, so a theme toggle recolours it live with no JS. Each one renders its own designed empty state under two points, shown in the last row here.">
<style>
.sc-wrap{width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px}
.sc-block{display:flex;flex-direction:column;gap:4px}
.sc-label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);font-weight:600}
.sc-svg{width:100%;height:80px;display:block}
.sc-empty{padding:16px;text-align:center;color:var(--text2);font-size:12px;background:var(--bg4);border-radius:var(--radius)}
</style>
<div class="sc-wrap">
  <div class="sc-block"><div class="sc-label">Equity curve</div><div class="sc-eq"></div></div>
  <div class="sc-block"><div class="sc-label">Baseline vs scenario</div><div class="sc-dual"></div></div>
  <div class="sc-block"><div class="sc-label">Drawdown</div><div class="sc-dd"></div></div>
  <div class="sc-block"><div class="sc-label">Empty state (fewer than 2 points)</div><div class="sc-empty-demo"></div></div>
</div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var eqEl = root.querySelector('.sc-eq'), dualEl = root.querySelector('.sc-dual'), ddEl = root.querySelector('.sc-dd'), emptyEl = root.querySelector('.sc-empty-demo');
  if (!eqEl || !dualEl || !ddEl || !emptyEl) return;

  function scEquity(cum){
    if (!cum || cum.length<2) return '<div class="sc-empty">Not enough data points yet to plot a curve.</div>';
    var W=460,H=80,pad=8, min=Math.min(0,Math.min.apply(null,cum)), max=Math.max(0,Math.max.apply(null,cum)), range=(max-min)||1;
    var xs=function(i){ return pad+(i/(cum.length-1))*(W-2*pad); }, ys=function(v){ return pad+(1-(v-min)/range)*(H-2*pad); };
    var line=cum.map(function(v,i){ return (i?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1); }).join(' ');
    var area=line+' L'+xs(cum.length-1).toFixed(1)+' '+ys(min).toFixed(1)+' L'+xs(0).toFixed(1)+' '+ys(min).toFixed(1)+' Z';
    var col=cum[cum.length-1]>=0?'var(--green)':'var(--red)', zeroY=ys(0).toFixed(1);
    return '<svg class="sc-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Equity curve"><line x1="'+pad+'" y1="'+zeroY+'" x2="'+(W-pad)+'" y2="'+zeroY+'" stroke="var(--border2)" stroke-width="1" stroke-dasharray="3 3"/><path d="'+area+'" fill="'+col+'" opacity="0.14"/><path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round"/></svg>';
  }
  function scDualEquity(a,b){
    if ((!a||a.length<2)&&(!b||b.length<2)) return '<div class="sc-empty">Not enough data points to plot.</div>';
    var W=460,H=80,pad=8, all=[0].concat(a||[],b||[]), min=Math.min.apply(null,all), max=Math.max.apply(null,all), range=(max-min)||1;
    var ys=function(v){ return pad+(1-(v-min)/range)*(H-2*pad); };
    function path(arr,col,w,dash){
      if (!arr||arr.length<2) return '';
      var d = arr.map(function(v,i){ return (i?'L':'M')+(pad+(i/(arr.length-1))*(W-2*pad)).toFixed(1)+' '+ys(v).toFixed(1); }).join(' ');
      return '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+w+'"'+(dash?' stroke-dasharray="5 3"':'')+' stroke-linejoin="round"/>';
    }
    var zeroY=ys(0).toFixed(1);
    return '<svg class="sc-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Baseline vs scenario"><line x1="'+pad+'" y1="'+zeroY+'" x2="'+(W-pad)+'" y2="'+zeroY+'" stroke="var(--border2)" stroke-width="1" stroke-dasharray="3 3"/>'+path(a,'var(--text3)',1.5,true)+path(b,'var(--accent)',2.2,false)+'</svg>';
  }
  function scDrawdown(equity){
    if (!equity || equity.length<2) return '<div class="sc-empty">Not enough data points yet.</div>';
    var peak=equity[0]; var uw=equity.map(function(v){ if (v>peak) peak=v; return v-peak; });
    var min=Math.min.apply(null,uw.concat([0])), W=460,H=80,pad=8, range=(0-min)||1;
    var xs=function(i){ return pad+(i/(uw.length-1))*(W-2*pad); }, ys=function(v){ return pad+((0-v)/range)*(H-2*pad); };
    var line=uw.map(function(v,i){ return (i?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1); }).join(' ');
    var area=line+' L'+xs(uw.length-1).toFixed(1)+' '+ys(0).toFixed(1)+' L'+xs(0).toFixed(1)+' '+ys(0).toFixed(1)+' Z';
    return '<svg class="sc-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Drawdown"><path d="'+area+'" fill="var(--red)" opacity="0.14"/><path d="'+line+'" fill="none" stroke="var(--red)" stroke-width="2" stroke-linejoin="round"/></svg>';
  }

  // Invented sample data, no Journal trade data.
  var sample = [0,120,80,300,250,430,380,520,470,610];
  var baseline = [0,60,40,150,120,210,180,260,235,300];
  eqEl.innerHTML = scEquity(sample);
  dualEl.innerHTML = scDualEquity(baseline, sample);
  ddEl.innerHTML = scDrawdown(sample);
  emptyEl.innerHTML = scEquity([0]);
})();
</script>
</template>

<template class="pattern" data-title="Breakdown Bars" data-category="Components" data-source="Journal (index.html, bdCard())" data-note="Proportional horizontal bar list: each bar's track width is |value| over the max |value| in the set, not a percent of the total, so the biggest entry always fills the track and the rest scale relative to it. Positive/negative colour, count shown in parens next to the label. Includes the designed empty state for a zero-entry set.">
<style>
.bb-card{width:100%;max-width:320px;background:var(--bg4);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px}

<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var rowsEl = root.querySelector('.bb-rows');
  if (!rowsEl) return;
  // Invented sample data: [label, net value, count]. No Journal trade data.
  var sample = [ ['Breakout', 640, 12], ['Pullback', 210, 7], ['Reversal', -180, 5], ['Range', -60, 3] ];
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function money(n){ return (n<0?'-':'+') + '$' + Math.abs(n).toFixed(0); }
  function render(entries){
    if (!entries.length){ rowsEl.innerHTML = '<p class="bb-empty">No data yet.</p>'; return; }
    var max = Math.max.apply(null, entries.map(function(e){ return Math.abs(e[1]); })) || 1;
    rowsEl.innerHTML = entries.map(function(e){
      var lab=e[0], v=e[1], n=e[2], pos = v>=0, w=(Math.abs(v)/max*100).toFixed(1);
      return '<div class="bb-row"><div class="bb-lab">'+esc(lab)+' <span class="bb-count">('+n+')</span></div>'+
        '<div class="bb-track"><div class="bb-fill '+(pos?'pos':'neg')+'" style="width:'+w+'%"></div></div>'+
        '<div class="bb-val '+(pos?'pos':'neg')+'">'+money(v)+'</div></div>';
    }).join('');
  }
  render(sample);
})();
</script>
</template>

<template class="pattern" data-title="Table Plumbing" data-category="Flows" data-source="Journal (index.html, sortBy/applyFilter/renderTable/goPage)" data-note="A table's sort, search and pagination all read and write the same small state object, then one render() reruns all three passes every time (filter, sort, slice to a page). Nothing forks between them: change the sort key and the current filter and page still apply on top. Column headers carry an asc/desc CSS class (arrow via ::after content, no icon font). Includes the designed empty state for a search with no matches. ~40 sample rows so the pager actually has pages.">
<style>
.tp-card{width:100%;max-width:560px;background:var(--bg4);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.tp-toolbar{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tp-search,.tp-status{font-family:inherit;font-size:12px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius);padding:6px 9px;outline:none}

</style>
<div class="tp-card">
  <div class="tp-toolbar">
    <input class="tp-search" type="search" placeholder="Search name..." aria-label="Search by name">
    <select class="tp-status" aria-label="Filter by status"><option value="all">All</option><option value="open">Open</option><option value="closed">Closed</option></select>
  </div>
  <div class="tp-wrap"><table><thead><tr class="tp-head"></tr></thead><tbody class="tp-rows"></tbody></table></div>
  <div class="tp-pager"></div>
</div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var card = root.querySelector('.tp-card');
  var headEl = root.querySelector('.tp-head'), rowsEl = root.querySelector('.tp-rows'), pagerEl = root.querySelector('.tp-pager');
  var searchEl = root.querySelector('.tp-search'), statusEl = root.querySelector('.tp-status');
  if (!card || !headEl || !rowsEl || !pagerEl) return;

  var PAGE_SIZE = 10;
  // Invented deterministic sample data, no Journal trade data.
  var NAMES = ['Aurora','Borealis','Cascade','Delta','Ember','Fjord','Granite','Halcyon','Indigo','Juniper','Kestrel','Lumen','Meridian','Nimbus','Onyx','Pilgrim','Quartz','Ridge','Solstice','Tundra'];
  var DATA = [];
  for (var i=0;i<40;i++){
    var d = new Date(2026,0,1); d.setDate(d.getDate()+i*3);
    DATA.push({
      id:i, name: NAMES[i % NAMES.length] + ' ' + (Math.floor(i/NAMES.length)+1),
      status: i % 3 === 0 ? 'open' : 'closed',
      amount: Math.round(Math.sin(i*1.7)*500 + (i%7-3)*40),
      date: d
    });
  }
  var COLS = [
    { k:'name', label:'Name' },
    { k:'status', label:'Status' },
    { k:'amount', label:'Amount', num:true },
    { k:'date', label:'Date' }
  ];

  // Per-instance state, closured, never a global, so cycling filters never
  // lets one instance's sort/page bleed into another's.
  var state = { q:'', status:'all', sortKey:'date', sortDir:-1, page:1 };

  function fmtDate(d){ var p=function(x){return String(x).padStart(2,'0');}; return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear(); }
  function money(n){ return (n<0?'-':'+') + '$' + Math.abs(n).toFixed(0); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function visibleRows(){
    var q = state.q.trim().toLowerCase();
    var rows = DATA.filter(function(r){
      if (q && r.name.toLowerCase().indexOf(q) < 0) return false;
      if (state.status !== 'all' && r.status !== state.status) return false;
      return true;
    });
    var k = state.sortKey, dir = state.sortDir;
    rows.sort(function(a,b){
      var av = k==='date' ? a.date.getTime() : a[k], bv = k==='date' ? b.date.getTime() : b[k];
      if (typeof av === 'number' && typeof bv === 'number') return (av-bv)*dir;
      return String(av) < String(bv) ? -dir : String(av) > String(bv) ? dir : 0;
    });
    return rows;
  }

  function render(){
    if (!card.isConnected) return;
    headEl.innerHTML = COLS.map(function(c){
      var cls = 'tp-sortable' + (c.num?' tp-num':'') + (state.sortKey===c.k ? (state.sortDir>0?' tp-asc':' tp-desc') : '');
      return '<th class="'+cls+'" data-key="'+c.k+'">'+c.label+'</th>';
    }).join('');
    var rows = visibleRows();
    var noRows = rows.length===0;
    if (noRows){
      rowsEl.innerHTML = '';
      root.querySelector('.tp-wrap').classList.toggle('hidden', false);
      pagerEl.innerHTML = '';
      rowsEl.parentElement.parentElement.querySelectorAll('.tp-empty').forEach(function(n){ n.remove(); });
      var empty = document.createElement('div');
      empty.className = 'tp-empty';
      empty.textContent = 'No rows match your filters.';
      root.querySelector('.tp-wrap').appendChild(empty);
      return;
    }
    root.querySelectorAll('.tp-empty').forEach(function(n){ n.remove(); });
    var pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    if (state.page > pages) state.page = pages;
    if (state.page < 1) state.page = 1;
    var start = (state.page-1)*PAGE_SIZE;
    var pageRows = rows.slice(start, start+PAGE_SIZE);
    rowsEl.innerHTML = pageRows.map(function(r){
      return '<tr><td>'+esc(r.name)+'</td>'+
        '<td><span class="tp-chip tp-'+r.status+'">'+(r.status==='open'?'Open':'Closed')+'</span></td>'+
        '<td class="tp-num '+(r.amount>=0?'tp-pos':'tp-neg')+'">'+money(r.amount)+'</td>'+
        '<td>'+fmtDate(r.date)+'</td></tr>';
    }).join('');
    pagerEl.innerHTML = pages>1
      ? '<button type="button" data-page="'+(state.page-1)+'" '+(state.page<=1?'disabled':'')+'>Prev</button><span>Page '+state.page+' of '+pages+'</span><button type="button" data-page="'+(state.page+1)+'" '+(state.page>=pages?'disabled':'')+'>Next</button>'
      : '<span>'+rows.length+' row'+(rows.length===1?'':'s')+'</span>';
  }

  headEl.addEventListener('click', function(e){
    var th = e.target.closest('[data-key]');
    if (!th) return;
    var k = th.getAttribute('data-key');
    if (state.sortKey === k) state.sortDir *= -1; else { state.sortKey = k; state.sortDir = 1; }
    render();
  });
  pagerEl.addEventListener('click', function(e){
    var btn = e.target.closest('[data-page]');
    if (!btn || btn.disabled) return;
    state.page = parseInt(btn.getAttribute('data-page'),10);
    render();
  });
  if (searchEl) searchEl.addEventListener('input', function(){ state.q = searchEl.value; state.page = 1; render(); });
  if (statusEl) statusEl.addEventListener('change', function(){ state.status = statusEl.value; state.page = 1; render(); });

  render();
})();
</script>
</template>

<template class="pattern" data-title="Gated Views" data-category="Flows" data-source="Journal (index.html, requireEntitlement seam plus showView)" data-note="Two functions carry the whole paywall: currentUser() is the single place the app asks who is logged in, entitlement(feature) is the single place it asks whether they can use a feature. Every gated entry point (a view switch, a button) calls requireEntitlement(feature,label) first, which is a no-op plus an upgrade toast on denial, never a broken half-open state. Denial is silent to the rest of the app, the view never changes. Try the locked tab.">
<style>
.gv-wrap{position:relative;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;align-items:center}
.gv-seg{display:flex;gap:2px;background:var(--bg3);border:1px solid var(--border);border-radius:999px;padding:3px}
.gv-tab{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--text2);border:none;background:none;cursor:pointer;white-space:nowrap}
.gv-tab.gv-active{background:var(--accent);color:var(--onacc)}
.gv-tab.gv-locked{opacity:.75}
.gv-panel{width:100%;background:var(--bg4);border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-size:12.5px;color:var(--text2);text-align:center;min-height:48px;display:flex;align-items:center;justify-content:center}
.gv-toast-stack{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:5}
.gv-toast{background:var(--red-soft);border:1px solid var(--red);color:var(--red);padding:8px 13px;border-radius:var(--radius);font-size:12px;box-shadow:var(--shadow-2);animation:gv-pop var(--dur) var(--spring);white-space:nowrap}
@keyframes gv-pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){ .gv-toast{animation:none} }
</style>
<div class="gv-wrap">
  <div class="gv-seg" role="tablist" aria-label="Demo view switch">
    <button type="button" class="gv-tab gv-active" data-gv-v="overview">Overview</button>
    <button type="button" class="gv-tab" data-gv-v="reports">Reports</button>
    <button type="button" class="gv-tab gv-locked" data-gv-v="pro">Pro analytics &#128274;</button>
  </div>
  <div class="gv-panel"></div>
  <div class="gv-toast-stack"></div>
</div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var wrap = root.querySelector('.gv-wrap');
  var tabs = root.querySelectorAll('[data-gv-v]');
  var panel = root.querySelector('.gv-panel');
  var toasts = root.querySelector('.gv-toast-stack');
  if (!wrap || !tabs.length || !panel || !toasts) return;

  // The seam: one place for "who", one for "what can they do". Demo
  // entitlements are fixed, pro_analytics stays denied so the lock always demos.
  function currentUser(){ return { id:null, local:true }; }
  var ENTITLEMENTS = { overview:true, reports:true, pro_analytics:false };
  function entitlement(feature){ return !!ENTITLEMENTS[feature]; }
  function requireEntitlement(feature,label){
    if (entitlement(feature)) return true;
    fireToast((label||'This feature')+' needs a plan upgrade.');
    return false;
  }

  function fireToast(msg){
    if (!toasts.isConnected) return;
    var el = document.createElement('div');
    el.className = 'gv-toast';
    el.textContent = msg;
    toasts.appendChild(el);
    setTimeout(function(){ if (el.isConnected) el.remove(); }, 2200);
  }

  var PANELS = { overview:'Everyone sees this.', reports:'Also open in this demo.', pro:'Locked feature, tab click is a no-op with a toast.' };
  var FEATURE = { overview:'overview', reports:'reports', pro:'pro_analytics' };
  var LABEL = { pro:'Pro analytics' };
  var view = 'overview';

  function renderPanel(){ panel.textContent = PANELS[view]; }
  function showView(v){
    if (v === 'pro' && !requireEntitlement(FEATURE[v], LABEL[v])) return; // no-op, view stays put
    view = v;
    tabs.forEach(function(t){ t.classList.toggle('gv-active', t.getAttribute('data-gv-v')===v); });
    renderPanel();
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ showView(t.getAttribute('data-gv-v')); }); });
  renderPanel();
})();
</script>
</template>

<template class="pattern" data-title="CSV Import" data-category="Flows" data-source="Forex (index.html, parseCSV() plus the fuzzy header mapping in importCSV())" data-note="A hand-rolled CSV parser (handles quoted fields, escaped quotes, commas inside quotes, and both CRLF and LF line endings) feeds a fuzzy header mapper: each target field has an alias list, matched by substring against the lower-cased header row, first alias to hit wins, order matters. No column-order assumption, the file can name and order its columns however it likes. This demo uses a generic contacts alias list, not Forex's trade fields.">
<style>
.ci-wrap{width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px}
.ci-textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius);padding:8px 10px;min-height:80px;width:100%;resize:vertical}
.ci-textarea:focus{outline:none;border-color:var(--accent)}
.ci-btn{align-self:flex-start;padding:7px 13px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--accent);border-color:var(--accent);color:var(--onacc);cursor:pointer;font-size:12px;font-weight:600}
.ci-btn:hover{filter:brightness(1.06)}
.ci-map{font-size:11px;color:var(--text3)}
.ci-err{font-size:11px;color:var(--red);min-height:14px}
.ci-table-wrap{overflow:auto;max-height:180px;border:1px solid var(--border);border-radius:var(--radius)}
.ci-wrap table{width:100%;border-collapse:collapse;font-size:11.5px}
.ci-wrap th{text-align:left;padding:6px 8px;color:var(--text3);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--border);background:var(--bg4);white-space:nowrap}
.ci-wrap td{padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.ci-wrap tbody tr:last-child td{border-bottom:none}
.ci-empty{padding:14px;text-align:center;color:var(--text2);font-size:12px}
</style>
<div class="ci-wrap">
  <textarea class="ci-textarea" aria-label="Sample CSV input" spellcheck="false"></textarea>
  <button type="button" class="ci-btn">Parse CSV</button>
  <div class="ci-map"></div>
  <div class="ci-err"></div>
  <div class="ci-table-wrap"><table><thead><tr class="ci-head"></tr></thead><tbody class="ci-rows"></tbody></table></div>
</div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var wrap = root.querySelector('.ci-wrap');
  var ta = root.querySelector('.ci-textarea'), btn = root.querySelector('.ci-btn');
  var mapEl = root.querySelector('.ci-map'), errEl = root.querySelector('.ci-err');
  var headEl = root.querySelector('.ci-head'), rowsEl = root.querySelector('.ci-rows');
  if (!wrap || !ta || !btn) return;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Pre-filled with quoted fields (a comma inside quotes) and CRLF line
  // endings, set via JS so the literal \r\n survives (HTML source
  // normalises embedded newlines otherwise).
  ta.value = 'Full Name,Email Address,Company,Notes\r\n' +
    '"Doe, Jane",jane@example.com,Acme Ltd,"First contact, referred by Sam"\r\n' +
    'John Smith,john@example.com,,Follow up next week\r\n' +
    '"Lee, Priya",priya@example.com,Nimbus Co,';

  // Vendored parser logic (Forex's parseCSV, unchanged): quote-aware,
  // handles "" as an escaped quote, comma and CRLF/LF as terminators.
  function parseCSV(text){
    var rows=[], i=0, field='', row=[], q=false;
    function pushF(){ row.push(field); field=''; }
    function pushR(){ pushF(); rows.push(row); row=[]; }
    while (i<text.length){ var c=text[i];
      if (q){ if (c==='"'){ if (text[i+1]==='"'){ field+='"'; i++; } else q=false; } else field+=c; }
      else { if (c==='"') q=true; else if (c===',') pushF(); else if (c==='\n') pushR(); else if (c==='\r'){} else field+=c; }
      i++; }
    if (field!==''||row.length) pushR();
    return rows.filter(function(r){ return r.some(function(x){ return String(x).trim()!==''; }); });
  }

  // Generic alias list, not Forex's trade-field aliases.
  var ALIASES = {
    name: ['name','full name','contact'],
    email: ['email','e-mail','mail'],
    company: ['company','organisation','organization','employer'],
    note: ['note','notes','comment']
  };
  function findCol(head, aliases){
    for (var a=0; a<aliases.length; a++){
      var i = head.findIndex(function(h){ return h.indexOf(aliases[a]) >= 0; });
      if (i >= 0) return i;
    }
    return -1;
  }

  function run(){
    errEl.textContent = ''; mapEl.textContent = ''; headEl.innerHTML = ''; rowsEl.innerHTML = '';
    var rows = parseCSV(ta.value);
    if (rows.length < 2){ errEl.textContent = 'No data rows found'; return; }
    var head = rows[0].map(function(h){ return h.trim().toLowerCase(); });
    var ix = {};
    Object.keys(ALIASES).forEach(function(k){ ix[k] = findCol(head, ALIASES[k]); });
    if (ix.name < 0){ errEl.textContent = 'Need at least a name column'; return; }
    mapEl.textContent = 'Detected: name to column ' + (ix.name+1) +
      (ix.email>=0 ? ', email to column '+(ix.email+1) : '') +
      (ix.company>=0 ? ', company to column '+(ix.company+1) : '') +
      (ix.note>=0 ? ', notes to column '+(ix.note+1) : '');
    headEl.innerHTML = '<th>Name</th><th>Email</th><th>Company</th><th>Notes</th>';
    var body = rows.slice(1).map(function(r){
      var name = (ix.name>=0 ? r[ix.name] : '').trim();
      if (!name) return null; // invalid row, skipped, never silently dropped without a count
      return { name:name, email:(ix.email>=0?r[ix.email]:'')||'', company:(ix.company>=0?r[ix.company]:'')||'', note:(ix.note>=0?r[ix.note]:'')||'' };
    }).filter(Boolean);
    if (!body.length){ rowsEl.innerHTML = ''; var emptyRow=document.createElement('tr'); var td=document.createElement('td'); td.colSpan=4; td.className='ci-empty'; td.textContent='No valid rows to import.'; emptyRow.appendChild(td); rowsEl.appendChild(emptyRow); return; }
    rowsEl.innerHTML = body.map(function(r){
      return '<tr><td>'+esc(r.name)+'</td><td>'+esc(r.email)+'</td><td>'+esc(r.company)+'</td><td>'+esc(r.note)+'</td></tr>';
    }).join('');
  }
  btn.addEventListener('click', run);
})();
</script>
</template>

<template class="pattern" data-title="Undo Snapshot" data-category="Flows" data-source="Journal (index.html, deleteTag()/undoDeleteTag()), Manpower Portal (index.html, UNDO_MAX/pushUndo()/doUndo()/doRedo(), lines 4618 to 4654)" data-note="Doctrine: snapshot BEFORE a destructive mutation, never after. The original single-slot pattern (delete-selected shows a toast with an inline Undo action) is now backed by a full whole-state undo/redo command stack, capped at 50 entries: every mutation here (add, inline rename via click-to-edit, delete) calls pushUndo() first to snapshot the current item list, a fresh action always clears the redo stack, and the toolbar's Undo/Redo buttons disable and dim themselves the instant their stack is empty. The delete toast's inline Undo calls the same doUndo() the toolbar button uses, one mechanism, not two competing ones. Toast feedback fires on every Undo/Redo. The undo/redo stacks are deliberately in-memory only and do not survive a refresh, matching Manpower Portal's own source: only the resulting document state gets persisted there, never the history of how it got there.">
<style>
.us-wrap{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;position:relative}
.us-toolbar{display:flex;align-items:center;gap:6px}
.us-tbtn{padding:6px 11px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg4);color:var(--text);cursor:pointer;font-size:12px;font-weight:500;font-family:inherit}
.us-tbtn:hover{background:var(--bg3)}
.us-tbtn:disabled{opacity:.35;cursor:not-allowed}
.us-tbtn-add{margin-left:auto}
.us-list{display:flex;flex-direction:column;gap:2px}
.us-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--radius);font-size:12.5px}
.us-row:hover{background:var(--bg4)}
.us-row input[type=checkbox]{width:auto}
.us-name{flex:1;cursor:pointer;padding:2px 4px;border-radius:4px;outline:none}
.us-name:hover{background:var(--bg3)}
.us-rename-input{font-family:inherit;font-size:12.5px;background:var(--bg3);border:1px solid var(--accent);color:var(--text);border-radius:4px;padding:2px 5px;width:100%;outline:none}
.us-del{border:none;background:none;color:var(--text3);cursor:pointer;font-size:11px;padding:2px 5px;border-radius:4px;font-family:inherit}
.us-del:hover{color:var(--red);background:var(--red-soft)}
.us-actions{display:flex;justify-content:flex-end}
.us-btn{padding:7px 13px;border-radius:var(--radius);border:1px solid var(--red);background:var(--red-soft);color:var(--red);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit}
.us-btn:hover{filter:brightness(1.1)}
.us-btn:disabled{opacity:.4;cursor:not-allowed}
.us-empty{padding:14px;text-align:center;color:var(--text2);font-size:12px}
.us-toast-stack{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:5;width:max-content;max-width:90%}
.us-toast{background:var(--bg4);border:1px solid var(--border2);color:var(--text);padding:8px 12px;border-radius:var(--radius);font-size:12px;box-shadow:var(--shadow-2);display:flex;align-items:center;gap:10px;animation:us-pop var(--dur) var(--spring)}
.us-toast button{border:none;background:none;color:var(--accent);cursor:pointer;font-size:12px;font-weight:700;padding:0;font-family:inherit}
@keyframes us-pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){ .us-toast{animation:none} }
</style>
<div class="us-wrap">
  <div class="us-toolbar">
    <button type="button" class="us-tbtn us-undo" disabled title="Undo">&#8617; Undo</button>
    <button type="button" class="us-tbtn us-redo" disabled title="Redo">&#8618; Redo</button>
    <button type="button" class="us-tbtn us-tbtn-add">+ Add item</button>
  </div>
  <div class="us-list"></div>
  <div class="us-actions"><button type="button" class="us-btn">Delete selected</button></div>
  <div class="us-toast-stack"></div>
</div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var wrap = root.querySelector('.us-wrap');
  var listEl = root.querySelector('.us-list'), delBtn = root.querySelector('.us-btn'), toasts = root.querySelector('.us-toast-stack');
  var undoBtn = root.querySelector('.us-undo'), redoBtn = root.querySelector('.us-redo'), addBtn = root.querySelector('.us-tbtn-add');
  if (!wrap || !listEl || !delBtn || !toasts || !undoBtn || !redoBtn || !addBtn) return;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Invented sample data, no Journal/Manpower Portal data.
  var items = [
    { id:'1', name:'Marketing' }, { id:'2', name:'Sales' }, { id:'3', name:'Support' },
    { id:'4', name:'Engineering' }, { id:'5', name:'Design' }, { id:'6', name:'Finance' }
  ];
  var nextId = 7;

  var UNDO_MAX = 50;
  var undoStack = [], redoStack = [];
  function snap(){ return JSON.parse(JSON.stringify(items)); }
  function pushUndo(){
    undoStack.push(snap());
    if (undoStack.length > UNDO_MAX) undoStack.shift();
    redoStack = []; // a fresh action invalidates any redo history
    updateUndoUI();
  }
  function doUndo(silent){
    if (!undoStack.length) return;
    redoStack.push(snap());
    items = undoStack.pop();
    render();
    if (!silent) toast('Undo ↩');
  }
  function doRedo(){
    if (!redoStack.length) return;
    undoStack.push(snap());
    items = redoStack.pop();
    render();
    toast('Redo ↪');
  }
  function updateUndoUI(){
    undoBtn.disabled = !undoStack.length;
    redoBtn.disabled = !redoStack.length;
  }

  function toast(msg){
    if (!toasts.isConnected) return;
    var el = document.createElement('div');
    el.className = 'us-toast';
    el.innerHTML = '<span>' + esc(msg) + '</span>';
    toasts.appendChild(el);
    setTimeout(function(){ if (el.isConnected) el.remove(); }, 2200);
  }

  function fireDeleteToast(count){
    if (!toasts.isConnected) return;
    var el = document.createElement('div');
    el.className = 'us-toast';
    el.innerHTML = '<span>Deleted ' + count + ' item' + (count === 1 ? '' : 's') + '</span>';
    var undoLink = document.createElement('button');
    undoLink.type = 'button';
    undoLink.textContent = 'Undo';
    undoLink.addEventListener('click', function(){
      doUndo(true); // silent: this toast already said what happened
      if (el.isConnected) el.remove();
    });
    el.appendChild(undoLink);
    toasts.appendChild(el);
    setTimeout(function(){ if (el.isConnected) el.remove(); }, 6000);
  }

  function render(){
    if (!listEl.isConnected) return;
    if (!items.length){ listEl.innerHTML = '<p class="us-empty">No items left.</p>'; delBtn.disabled = true; updateUndoUI(); return; }
    delBtn.disabled = false;
    listEl.innerHTML = items.map(function(it){
      return '<div class="us-row">' +
        '<input type="checkbox" data-us-id="' + it.id + '">' +
        '<span class="us-name" data-us-name="' + it.id + '" tabindex="0" title="Click to rename">' + esc(it.name) + '</span>' +
        '<button type="button" class="us-del" data-us-del="' + it.id + '" aria-label="Delete ' + esc(it.name) + '">&#10005;</button>' +
        '</div>';
    }).join('');
    updateUndoUI();
  }

  function startRename(nameEl, id){
    var it = items.find(function(x){ return x.id === id; });
    if (!it) return;
    var input = document.createElement('input');
    input.type = 'text'; input.value = it.name; input.className = 'us-rename-input';
    nameEl.textContent = '';
    nameEl.appendChild(input);
    input.focus(); input.select();
    var done = false;
    function commit(){
      if (done) return; done = true;
      var v = input.value.trim();
      if (v && v !== it.name){ pushUndo(); it.name = v; }
      render();
    }
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter') input.blur();
      else if (e.key === 'Escape'){ done = true; render(); }
    });
    input.addEventListener('blur', commit);
  }

  listEl.addEventListener('click', function(e){
    var delEl = e.target.closest('[data-us-del]');
    if (delEl){
      var did = delEl.getAttribute('data-us-del');
      pushUndo();
      items = items.filter(function(it){ return it.id !== did; });
      render();
      return;
    }
    var nameEl = e.target.closest('[data-us-name]');
    if (nameEl && !nameEl.querySelector('input')) startRename(nameEl, nameEl.getAttribute('data-us-name'));
  });

  addBtn.addEventListener('click', function(){
    pushUndo();
    items.push({ id:String(nextId++), name:'New item ' + (items.length + 1) });
    render();
  });

  delBtn.addEventListener('click', function(){
    var ids = Array.prototype.slice.call(listEl.querySelectorAll('[data-us-id]:checked')).map(function(cb){ return cb.getAttribute('data-us-id'); });
    if (!ids.length) return;
    pushUndo(); // snapshot BEFORE the destructive mutation, never after
    items = items.filter(function(it){ return ids.indexOf(it.id) < 0; });
    render();
    fireDeleteToast(ids.length);
  });

  undoBtn.addEventListener('click', function(){ doUndo(); });
  redoBtn.addEventListener('click', function(){ doRedo(); });

  render();
})();
</script>
</template>

<template class="pattern" data-title="Sync Engine" data-category="Systems" data-source="Journal (index.html, lines 361 to 463: preview guard, dirty tracking, sbBatchUpsert/sbFetchAll, flush/retry, mergeTable)" data-note="localStorage-first sync: per-row dirty tracking, a single bad row retried individually so it never wedges the rest of a batch, queued deletes with a 7-day TTL, timestamp reconciliation on load (documented table-level limitation, not per-row). Full pattern, all five loss-prevention rules and the generalised config-object version, is in Sync Engine.md. This card is a pure front-end visualiser of the dirty-queue flush and per-row retry, no real network.">
<style>
.se-wrap{width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}
.se-rows{display:flex;flex-direction:column;gap:4px}
.se-row{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:var(--radius);background:var(--bg4);font-size:12px}
.se-name{flex:1;color:var(--text2)}
.se-status{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.se-status.se-idle{background:var(--bg3);color:var(--text3)}
.se-status.se-syncing{background:var(--amber-soft);color:var(--amber)}
.se-status.se-synced{background:var(--green-soft);color:var(--green)}
.se-status.se-poisoned{background:var(--red-soft);color:var(--red)}
.se-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.se-btn{padding:7px 13px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg4);color:var(--text);cursor:pointer;font-size:12px;font-weight:500}
.se-btn:hover{background:var(--bg3)}
.se-btn:disabled{opacity:.4;cursor:not-allowed}
.se-log{font-size:11px;color:var(--text3);min-height:14px}
</style>
<div class="se-wrap">
  <div class="se-rows"></div>
  <div class="se-actions">
    <button type="button" class="se-flush">Flush queue</button>
    <button type="button" class="se-retry" disabled>Retry poisoned row</button>
  </div>
  <div class="se-log"></div>
</div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var wrap = root.querySelector('.se-wrap');
  var rowsEl = root.querySelector('.se-rows'), flushBtn = root.querySelector('.se-flush'), retryBtn = root.querySelector('.se-retry'), logEl = root.querySelector('.se-log');
  if (!wrap || !rowsEl || !flushBtn || !retryBtn || !logEl) return;

  // Invented demo rows, no Journal data, no real network. One row (id 4) is
  // scripted to fail its first individual retry so the visual can show the
  // "stays dirty, poisoned" state before eventually recovering.
  var rows = [
    { id:1, name:'Row A', status:'idle' },
    { id:2, name:'Row B', status:'idle' },
    { id:3, name:'Row C', status:'idle' },
    { id:4, name:'Row D (bad payload)', status:'idle' },
    { id:5, name:'Row E', status:'idle' }
  ];
  var timers = [];
  function clearTimers(){ timers.forEach(function(id){ clearTimeout(id); }); timers.length = 0; }

  function render(){
    if (!rowsEl.isConnected) return;
    rowsEl.innerHTML = rows.map(function(r){
      var label = r.status==='idle' ? 'Dirty' : r.status==='syncing' ? 'Syncing' : r.status==='synced' ? 'Synced' : 'Poisoned';
      return '<div class="se-row"><span class="se-name">'+r.name+'</span><span class="se-status se-'+r.status+'">'+label+'</span></div>';
    }).join('');
    retryBtn.disabled = !rows.some(function(r){ return r.status==='poisoned'; });
    flushBtn.disabled = !rows.some(function(r){ return r.status==='idle'; });
  }
  function log(msg){ if (logEl.isConnected) logEl.textContent = msg; }

  function flush(){
    if (!wrap.isConnected) return;
    clearTimers();
    var dirty = rows.filter(function(r){ return r.status==='idle'; });
    if (!dirty.length) return;
    flushBtn.disabled = true;
    dirty.forEach(function(r){ r.status = 'syncing'; });
    render();
    log('Chunk upsert in flight...');
    timers.push(setTimeout(function(){
      if (!wrap.isConnected) return;
      // Simulated chunk-level failure (one bad row poisons the whole batch
      // response), so every row in the chunk now retries individually.
      log('Chunk failed, retrying each row individually...');
      dirty.forEach(function(r, i){
        timers.push(setTimeout(function(){
          if (!wrap.isConnected) return;
          var stillBad = r.id === 4; // this row keeps failing on its own too
          r.status = stillBad ? 'poisoned' : 'synced';
          render();
          if (i === dirty.length - 1){
            var poisoned = rows.filter(function(x){ return x.status==='poisoned'; }).length;
            log(poisoned ? poisoned+' row left dirty, will retry on next flush' : 'All rows synced');
          }
        }, 300 + i*220));
      });
    }, 500));
  }
  function retryPoisoned(){
    if (!wrap.isConnected) return;
    clearTimers();
    var bad = rows.filter(function(r){ return r.status==='poisoned'; });
    if (!bad.length) return;
    bad.forEach(function(r){ r.status = 'syncing'; });
    render();
    log('Retrying poisoned row on its own...');
    timers.push(setTimeout(function(){
      if (!wrap.isConnected) return;
      bad.forEach(function(r){ r.status = 'synced'; }); // recovers on this pass
      render();
      log('Poisoned row recovered and synced');
    }, 700));
  }

  flushBtn.addEventListener('click', flush);
  retryBtn.addEventListener('click', retryPoisoned);
  render();
})();
</script>
</template>

<template class="pattern" data-title="Offline Shell" data-category="Systems" data-source="Journal (sw.js, full file)" data-note="Service worker app shell: precache the static shell on install, network-first with cache fallback on fetch so an online user always gets the latest deploy, cross-origin and non-GET requests excluded entirely so a live API call is never cached or served stale. Versioned cache name bumped per ship, the activate handler deletes every other version. Full pattern and the registration snippet are in Offline Shell.md. Service workers cannot run from file://, so this card is a labelled diagram, not a live demo.">

</style>

<template class="pattern" data-title="Format Utils" data-category="Utilities" data-source="Journal (lib/kjr-format.js)" data-note="Pure, side-effect-free formatting and id helpers (no DOM, no localStorage, no fetch), vendored canonical copy in lib/kjr-format.js, shared unmodified and configured only by what calls it. This card demos live output of each helper, including esc() run against a hostile string so the escaped result renders as inert text instead of executing.">
<style>
.fu-wrap{width:100%;max-width:400px;font-size:12px}
.fu-row{display:grid;grid-template-columns:112px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.fu-row:last-child{border-bottom:none}
.fu-k{color:var(--text3);font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
.fu-v{font-variant-numeric:tabular-nums;overflow-wrap:anywhere;color:var(--text)}
</style>
<div class="fu-wrap"><div class="fu-rows"></div></div>
<script>
(function(){
  var script = document.currentScript;
  var root = script.parentElement;
  var rowsEl = root.querySelector('.fu-rows');
  if (!rowsEl) return;

  function loadLib(cb){
    if (window.KjrFmt) { cb(); return; }
    var existing = document.querySelector('script[data-pl-lib="kjr-format"]');
    if (existing) { existing.addEventListener('load', cb); if (window.KjrFmt) cb(); return; }
    var s = document.createElement('script');
    s.src = 'lib/kjr-format.js?v=1.2'; s.dataset.plLib = 'kjr-format';
    s.onload = cb;
    document.head.appendChild(s);
  }

  loadLib(function(){
    if (!rowsEl.isConnected || !window.KjrFmt) return; // card left the DOM or lib failed
    var F = window.KjrFmt;
    var hostile = '<img src=x onerror=alert(1)> & "quoted" and \'single\'';
    var rows = [
      { k:'uid()', v: F.uid(), raw:false },
      { k:'esc(hostile string)', v: F.esc(hostile), raw:true },
      { k:'todayISO()', v: F.todayISO(), raw:false },
      { k:'fmtDate(iso)', v: F.fmtDate(F.todayISO()), raw:false },
      { k:'fmtLongDate(iso)', v: F.fmtLongDate(F.todayISO()), raw:false }
    ];
    rowsEl.innerHTML = rows.map(function(r){
      var val = r.raw ? r.v : F.esc(r.v);
      return '<div class="fu-row"><div class="fu-k">'+F.esc(r.k)+'</div><div class="fu-v">'+val+'</div></div>';
    }).join('');
  });
})();
</script>
</template>
